<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1240" viewBox="0 0 960 1240" role="img"><title>مساران مختلفان بعد العدوى الفيروسية</title><desc>دخول فيروس إلى خلية مناسبة؛ الكمون ليس مرحلة إلزامية بعد الإنتاج.</desc><rect width="960" height="1240" fill="#f7fbfc"/><rect width="960" height="158" fill="#123f59"/><text x="890" y="65" direction="rtl" text-anchor="start" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="28" fill="#a8eadb">BIO26-S04-02 | R269</text><text x="890" y="120" direction="rtl" text-anchor="start" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="37" fill="#ffffff">مساران مختلفان بعد العدوى الفيروسية</text><rect x="70" y="205" width="820" height="150" rx="22" fill="#e6f0f6" stroke="#91b4c8" stroke-width="2"/><text x="850" y="260" direction="rtl" text-anchor="start" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="29" fill="#0b6171">نقطة البداية</text><text x="850" y="320" direction="rtl" text-anchor="start" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="28" fill="#183349">دخول فيروس إلى خلية مناسبة</text><path d="M480 356 V406 M480 406 H260 V455 M480 406 H700 V455" fill="none" stroke="#177e78" stroke-width="6" stroke-linecap="round"/><path d="M249 440 L260 458 L271 440 M689 440 L700 458 L711 440" fill="none" stroke="#177e78" stroke-width="5"/><rect x="70" y="472" width="405" height="370" rx="20" fill="#fff0dd" stroke="#e6bd83" stroke-width="2"/><rect x="485" y="472" width="405" height="370" rx="20" fill="#e1f4ec" stroke="#99cfb9" stroke-width="2"/><text x="440" y="530" direction="rtl" text-anchor="start" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="31" fill="#85531d">عدوى منتجة</text><text x="440" y="610" direction="rtl" text-anchor="start" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="25" fill="#183349">نسخ وتجميع جسيمات جديدة</text><text x="440" y="686" direction="rtl" text-anchor="start" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="25" fill="#183349">قد يحدث خروج دون تحلل</text><text x="855" y="530" direction="rtl" text-anchor="start" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="31" fill="#0b6b59">كمون لدى فيروسات معينة</text><text x="855" y="610" direction="rtl" text-anchor="start" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="25" fill="#183349">استمرار الجينوم دون إنتاج فوري</text><text x="855" y="686" direction="rtl" text-anchor="start" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="25" fill="#183349">قد تحدث إعادة تنشيط</text><rect x="70" y="875" width="820" height="130" rx="18" fill="#e9f2f9" stroke="#a2c0d1"/><text x="855" y="922" direction="rtl" text-anchor="start" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="28" fill="#15536e">النتيجة العلمية</text><text x="855" y="975" direction="rtl" text-anchor="start" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="25" fill="#183349">الكمون ليس مرحلة إلزامية بعد الإنتاج.</text><rect x="70" y="1030" width="820" height="155" rx="18" fill="#fff7ec" stroke="#e6bc83"/><text x="855" y="1080" direction="rtl" text-anchor="start" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="28" fill="#9b591b">فخ امتحاني</text><text x="855" y="1140" direction="rtl" text-anchor="start" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" font-size="25" fill="#183349">ليس كل فيروس كامنًا، وليس كل خروج تحللًا.</text><text x="75" y="1218" font-size="15" fill="#48687b" font-family="sans-serif">BIO26 · original scientific review diagram · not approved for publication</text></svg>