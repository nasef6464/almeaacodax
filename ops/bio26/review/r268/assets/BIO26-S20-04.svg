<title id="t">BIO26-S20-04 | اتجاه الأسموزية لا يعتمد على حركة الملح</title><desc id="d">الماء يتحرك صافيًا نحو الجهد المائي الأقل عبر غشاء يسمح بمروره. إذا كان الوسط الخارجي أقل تركيزًا من المذابات غير النافذة مقارنة بالخلية، يدخل الماء صافيًا. وإذا كان أعلى، يخرج الماء. يعتمد الأثر على نفاذية الغشاء ونوع المذابات.</desc>
<rect width="960" height="1240" fill="#fbfcfd"/><rect width="960" height="148" fill="#123f59"/>
<text x="885" y="58" direction="rtl" text-anchor="start" font-size="28" font-family="Noto Sans Arabic, sans-serif" fill="#9ce1cf">BIO26-S20-04 | BIO26 R268</text>
<text x="885" y="112" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="38" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" fill="#ffffff">اتجاه الأسموزية لا يعتمد على حركة</text>
<text x="885" y="157" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="38" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" fill="#ffffff">الملح</text>
<rect x="68" y="210" width="824" height="155" rx="20" fill="#eff4fb" stroke="#8ba8bd" stroke-width="2"/><circle cx="120" cy="285" r="29" fill="#164a63"/><text x="120" y="295" font-family="sans-serif" font-size="27" text-anchor="middle" fill="white">1</text><text x="835" y="268" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="29" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" fill="#17314b">فرق تركيز المذابات يغيّر الجهد المائي</text><path d="M480 367 V403" stroke="#0e6d6a" stroke-width="5"/><path d="M468 391 L480 405 L492 391" fill="none" stroke="#0e6d6a" stroke-width="5"/><rect x="68" y="417" width="824" height="155" rx="20" fill="#e7f3ee" stroke="#8ba8bd" stroke-width="2"/><circle cx="120" cy="492" r="29" fill="#164a63"/><text x="120" y="502" font-family="sans-serif" font-size="27" text-anchor="middle" fill="white">2</text><text x="835" y="475" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="29" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" fill="#17314b">حركة صافية للماء عبر غشاء شبه منفذ</text><path d="M480 574 V610" stroke="#0e6d6a" stroke-width="5"/><path d="M468 598 L480 612 L492 598" fill="none" stroke="#0e6d6a" stroke-width="5"/><rect x="68" y="624" width="824" height="155" rx="20" fill="#eff4fb" stroke="#8ba8bd" stroke-width="2"/><circle cx="120" cy="699" r="29" fill="#164a63"/><text x="120" y="709" font-family="sans-serif" font-size="27" text-anchor="middle" fill="white">3</text><text x="835" y="682" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="29" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" fill="#17314b">انتفاخ أو انكماش خلية حيوانية حسب الوسط</text>
<text x="875" y="882" direction="rtl" text-anchor="start" font-size="30" font-family="Noto Sans Arabic, sans-serif" fill="#164a63">المقارنة الحاسمة</text>
<rect x="490" y="911" width="402" height="110" rx="16" fill="#e5f5ef" stroke="#9bc9b7"/><rect x="68" y="911" width="402" height="110" rx="16" fill="#fff0df" stroke="#e8c59b"/>
<text x="855" y="957" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="25" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" fill="#17314b">وسط منخفض التوتر: دخول</text>
<text x="855" y="993" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="25" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" fill="#17314b">ماء</text><text x="432" y="957" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="25" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" fill="#17314b">وسط مرتفع التوتر: خروج</text>
<text x="432" y="993" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="25" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" fill="#17314b">ماء</text>
<rect x="68" y="1054" width="824" height="136" rx="16" fill="#fff7ed" stroke="#e4b785"/>
<text x="850" y="1093" direction="rtl" text-anchor="start" font-size="26" font-family="Noto Sans Arabic, sans-serif" fill="#9a4d0c">فخ الاختبار</text>
<text x="850" y="1141" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="25" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" fill="#17314b">القول إن الملح يجب أن يعبر الغشاء لكي يحدث</text>
<text x="850" y="1177" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="25" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" fill="#17314b">تغير في حجم الخلية.</text>
