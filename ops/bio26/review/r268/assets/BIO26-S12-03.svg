<title id="t">BIO26-S12-03 | مصدر ومصرف اللحاء</title><desc id="d">اتجاه اللحاء يحدده موضع المصدر والمصرف، وليس قاعدة ثابتة للأعلى أو الأسفل. قد تكون الورقة الناضجة مصدرًا والساق النامية مصرفًا. في موسم آخر تصبح أعضاء التخزين مصدرًا، فيتغير اتجاه انتقال السكريات داخل أنابيب غربالية مختلفة.</desc>
