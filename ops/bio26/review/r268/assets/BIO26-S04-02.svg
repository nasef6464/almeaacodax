<title id="t">BIO26-S04-02 | التحلل الفيروسي والكمون</title><desc id="d">التحلل ينتج جسيمات فيروسية ويؤذي الخلية، والكمون يبقي الجينوم دون إنتاج فوري كثيف. تعتمد الفيروسات على آليات الخلية المضيفة. ليست كل عدوى فيروسية فورية التحلل؛ قد يستمر الجينوم الفيروسي في حالة كامنة أو مستديمة حسب الفيروس والخلية.</desc>
