<title id="t">BIO26-S18-02 | اندفاع LH ومرحلة البروجستيرون</title><desc id="d">ارتفاع الإستروجين المستمر قبل الإباضة يمهد لاندفاع LH، وبعدها يرتفع البروجستيرون. يتحول تأثير الإستروجين المرتفع المستمر مؤقتًا إلى تغذية راجعة إيجابية تقود اندفاع LH. بعد الإباضة ينتج الجسم الأصفر بروجستيرونًا يساعد على جعل بطانة الرحم إفرازية.</desc>
