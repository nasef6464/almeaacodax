<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1240" viewBox="0 0 960 1240" role="img" aria-labelledby="t d">
<title id="t">BIO26-S11-02 | التلقيح يسبق الإخصاب ولا يساويه</title><desc id="d">التلقيح نقل حبوب اللقاح، أما الإخصاب فهو اتحاد الجاميتات بعد نمو أنبوب اللقاح. نقل حبوب اللقاح يضع الطور المشيجي الذكري قرب البويضة لكنه لا يضمن الإخصاب. قد يفشل نمو الأنبوب أو التوافق أو وصول الجاميتات، فلا تتكون بذرة رغم حدوث تلقيح.</desc>
<rect width="960" height="1240" fill="#fbfcfd"/><rect width="960" height="148" fill="#123f59"/>
<text x="885" y="58" direction="rtl" text-anchor="start" font-size="28" font-family="Noto Sans Arabic, sans-serif" fill="#9ce1cf">BIO26-S11-02 | BIO26 R268</text>
<text x="885" y="112" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="38" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" fill="#ffffff">التلقيح يسبق الإخصاب ولا يساويه</text>
<rect x="68" y="210" width="824" height="155" rx="20" fill="#eff4fb" stroke="#8ba8bd" stroke-width="2"/><circle cx="120" cy="285" r="29" fill="#164a63"/><text x="120" y="295" font-family="sans-serif" font-size="27" text-anchor="middle" fill="white">1</text><text x="835" y="268" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="29" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" fill="#17314b">وصول حبة لقاح إلى الميسم</text><path d="M480 367 V403" stroke="#0e6d6a" stroke-width="5"/><path d="M468 391 L480 405 L492 391" fill="none" stroke="#0e6d6a" stroke-width="5"/><rect x="68" y="417" width="824" height="155" rx="20" fill="#e7f3ee" stroke="#8ba8bd" stroke-width="2"/><circle cx="120" cy="492" r="29" fill="#164a63"/><text x="120" y="502" font-family="sans-serif" font-size="27" text-anchor="middle" fill="white">2</text><text x="835" y="475" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="29" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" fill="#17314b">نمو أنبوب لقاح ينقل الجاميتات</text><path d="M480 574 V610" stroke="#0e6d6a" stroke-width="5"/><path d="M468 598 L480 612 L492 598" fill="none" stroke="#0e6d6a" stroke-width="5"/><rect x="68" y="624" width="824" height="155" rx="20" fill="#eff4fb" stroke="#8ba8bd" stroke-width="2"/><circle cx="120" cy="699" r="29" fill="#164a63"/><text x="120" y="709" font-family="sans-serif" font-size="27" text-anchor="middle" fill="white">3</text><text x="835" y="682" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="29" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" fill="#17314b">حدوث الإخصاب داخل البويضة</text>
<text x="875" y="882" direction="rtl" text-anchor="start" font-size="30" font-family="Noto Sans Arabic, sans-serif" fill="#164a63">المقارنة الحاسمة</text>
<rect x="490" y="911" width="402" height="110" rx="16" fill="#e5f5ef" stroke="#9bc9b7"/><rect x="68" y="911" width="402" height="110" rx="16" fill="#fff0df" stroke="#e8c59b"/>
<text x="855" y="957" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="25" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" fill="#17314b">تلقيح: نقل حبوب اللقاح</text><text x="432" y="957" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="25" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" fill="#17314b">إخصاب: اتحاد جاميتات</text>
