<text x="850" y="1093" direction="rtl" text-anchor="start" font-size="26" font-family="Noto Sans Arabic, sans-serif" fill="#9a4d0c">فخ الاختبار</text>
<text x="850" y="1141" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="25" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" fill="#17314b">ظهور حبوب لقاح على الميسم يثبت حدوث</text>
<text x="850" y="1177" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-size="25" font-family="Noto Naskh Arabic, Noto Sans Arabic, sans-serif" fill="#17314b">الإخصاب.</text>
