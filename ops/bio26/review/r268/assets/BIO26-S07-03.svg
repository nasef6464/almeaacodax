<title id="t">BIO26-S07-03 | الطور البولِيبي والميدوزي في اللاسعات</title><desc id="d">الطوران شكلان بنيويان مختلفان، ولا يجتمعان بالضرورة في دورة حياة كل نوع. تسمح البنية الشعاعية واللوامس اللاسعة باصطياد الغذاء. يتباين تعاقب الأطوار والتكاثر بين مجموعات اللاسعات؛ بعض الأنواع يغلب عليها طور واحد.</desc>
<rect width="960" height="1240" fill="#fbfcfd"/><rect width="960" height="148" fill="#123f59"/>
