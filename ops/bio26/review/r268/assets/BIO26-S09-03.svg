<title id="t">BIO26-S09-03 | تناظر شوكيات الجلد عبر العمر</title><desc id="d">قد تكون اليرقة ثنائية التناظر بينما يصبح البالغ خماسي التناظر الشعاعي. تختلف خطة الجسم بين مراحل النمو في شوكيات الجلد. التناظر الشعاعي عند البالغ لا يعني أن اليرقة شعاعية كذلك، وهو مثال على أهمية تحديد المرحلة العمرية.</desc>
