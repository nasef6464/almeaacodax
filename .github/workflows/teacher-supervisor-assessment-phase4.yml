name: Teacher Supervisor Assessment Phase 4

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'dashboards/admin/SupervisorOverviewPanel.tsx'
      - 'dashboards/admin/SupervisorTestsManager.tsx'
      - 'dashboards/admin/supervisorTests/**'
      - 'scripts/smoke-supervisor-dashboard-contract.mjs'
      - 'scripts/smoke-supervisor-classroom-intervention-phase4.mjs'
      - 'package.json'
      - '.github/workflows/teacher-supervisor-assessment-phase4.yml'

permissions:
  contents: read

concurrency:
  group: teacher-supervisor-assessment-phase4-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  phase4-supervisor-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Existing supervisor scope contract
        run: npm run smoke:supervisor-dashboard

      - name: Phase 4 classroom intervention certification
        run: npm run smoke:supervisor-classroom-intervention-phase4

      - name: Frontend typecheck
        run: npm run typecheck
