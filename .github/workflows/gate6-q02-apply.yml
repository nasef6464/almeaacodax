name: Gate 6 Apply Question Usage Analytics

on:
  push:
    branches:
      - codex/gate6-questions-curriculum-operations
    paths:
      - tools/gate6/apply-question-usage-analytics.mjs
      - .github/workflows/gate6-q02-apply.yml

permissions:
  contents: write

jobs:
  apply-question-analytics:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Apply focused UI patch
        run: node tools/gate6/apply-question-usage-analytics.mjs
      - name: Install frontend dependencies
        run: npm ci
      - name: Install API dependencies
        run: npm --prefix server ci
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Frontend build
        run: npm run build
      - name: API typecheck
        run: npm --prefix server run check
      - name: API build
        run: npm --prefix server run build
      - name: Gate 6 question analytics contract
        run: node scripts/smoke-gate6-question-usage-analytics-contract.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit focused runtime patch and remove one-off scaffolding
        run: |
          rm tools/gate6/apply-question-usage-analytics.mjs
          rm .github/workflows/gate6-q02-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboards/admin/QuestionBankManager.tsx tools/gate6/apply-question-usage-analytics.mjs .github/workflows/gate6-q02-apply.yml
          git commit -m "feat(questions): surface bounded usage analytics"
          git push
