name: Platform V3 Public UI Gate
# PR audit is intentionally offline: browser rendering + contracts, zero production API traffic.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'App.tsx'
      - 'pages/**'
      - 'components/**'
      - 'contexts/**'
      - 'services/**'
      - 'store/**'
      - 'utils/**'
      - 'styles/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'scripts/pr-public-ui-offline-audit.mjs'
      - 'scripts/smoke-membership-pricing-contract.mjs'
      - 'scripts/smoke-public-open-items-contract.mjs'
      - '.github/workflows/platform-v3-public-ui-gate.yml'

permissions:
  contents: read

concurrency:
  group: platform-v3-public-ui-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  public-ui-live:
    name: Branch public UI — desktop + mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_API_URL: /api
      UI_AUDIT_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout exact recovery head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Build exact branch frontend
        run: npm run build

      - name: Public commerce and auth contracts
        run: |
          set -euo pipefail
          npm run smoke:membership-pricing
          npm run smoke:public-open-items
          npm run smoke:auth-frontend
          npm run smoke:barcode-public-tests

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start built frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/platform-v3-preview.log 2>&1 &
          echo $! > /tmp/platform-v3-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo "Branch preview is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/platform-v3-preview.log || true
          exit 1

      - name: Offline public and guarded UI audit — zero production API traffic
        run: node scripts/pr-public-ui-offline-audit.mjs

      - name: Stop built frontend
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/platform-v3-preview.pid ]; then
            kill "$(cat /tmp/platform-v3-preview.pid)" 2>/dev/null || true
          fi
