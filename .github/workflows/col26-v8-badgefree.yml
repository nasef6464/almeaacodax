name: COL26 V8 Badge-Free Production Update
on:
  push:
    branches:
      - ops/col26-v8-badgefree-20261004
    paths:
      - "ops/col26-v8-badgefree/**"
      - ".github/workflows/col26-v8-badgefree.yml"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PILOT_API_BASE: https://almeaacodax.vercel.app/api
      SMOKE_ADMIN_TOKEN: ${{ secrets.SMOKE_ADMIN_TOKEN }}
      SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL || secrets.ROLE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD || secrets.ROLE_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lossless WebP crop dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Reconstruct previously verified COL26 V7 source package
        run: |
          bash ops/col26-v7-transport/reconstruct.sh
          rm -rf /tmp/cv8 /tmp/cv8-v8
          mkdir -p /tmp/cv8 /tmp/cv8-v8
          unzip -oq /tmp/COL26_V7_CANONICAL_READY_FINAL.zip -d /tmp/cv8
          test "$(find /tmp/cv8/images -maxdepth 1 -name 'TAH-MATH-COL26-*.webp' | wc -l)" = "1012"

      - name: Generate V8 badge-free images
        run: |
          python ops/col26-v8-badgefree/crop.py /tmp/cv8/images /tmp/cv8-v8/images

      - name: Canary, upload, patch existing records, and verify
        env:
          COL26_V8_IMAGE_DIR: /tmp/cv8-v8/images
        run: node ops/col26-v8-badgefree/update.mjs

      - name: Upload V8 audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: col26-v8-badgefree-${{ github.sha }}
          path: |
            /tmp/cv8-v8/crop-report.json
            audit-artifacts/col26-v8/update-report.json
          if-no-files-found: warn
          retention-days: 7
