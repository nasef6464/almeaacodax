name: Platform V3 Public Smoke Roles Preview

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: platform-v3-public-smoke-roles-preview
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.pull_request.number == 26 && github.event.pull_request.head.ref == 'develop/platform-v3-recovery'
    name: Student + teacher + supervisor + parent on exact local build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UI_AUDIT_BASE_URL: http://127.0.0.1:4173
      UI_AUDIT_API_BASE_URL: https://almeaacodax-k2ux.onrender.com/api
      VITE_API_URL: /api
      ROLE_PAGES_AUDIT_RUN_ID: platform-v3-public-smoke-roles-${{ github.run_id }}
      ROLE_STUDENT_EMAIL: ${{ secrets.ROLE_STUDENT_EMAIL }}
      ROLE_STUDENT_PASSWORD: ${{ secrets.ROLE_STUDENT_PASSWORD }}
      ROLE_TEACHER_EMAIL: ${{ secrets.ROLE_TEACHER_EMAIL }}
      ROLE_TEACHER_PASSWORD: ${{ secrets.ROLE_TEACHER_PASSWORD }}
      ROLE_SUPERVISOR_EMAIL: ${{ secrets.ROLE_SUPERVISOR_EMAIL }}
      ROLE_SUPERVISOR_PASSWORD: ${{ secrets.ROLE_SUPERVISOR_PASSWORD }}
      ROLE_PARENT_EMAIL: ${{ secrets.ROLE_PARENT_EMAIL }}
      ROLE_PARENT_PASSWORD: ${{ secrets.ROLE_PARENT_PASSWORD }}
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build exact recovery frontend
        run: npm run build

      - name: Start exact recovery frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/platform-v3-role-preview.log 2>&1 &
          echo $! > /tmp/platform-v3-role-preview.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/platform-v3-role-preview.log || true
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve secret-backed role-smoke availability
        id: role_creds
        shell: bash
        run: |
          set -euo pipefail
          ready=true
          for role in STUDENT TEACHER SUPERVISOR PARENT; do
            email_var="ROLE_${role}_EMAIL"
            pass_var="ROLE_${role}_PASSWORD"
            if [ -z "${!email_var:-}" ] || [ -z "${!pass_var:-}" ]; then
              echo "${role}: secure credentials not configured"
              ready=false
            else
              echo "${role}: secure credentials configured"
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = "true" ]; then
            echo "Secret-backed authenticated role smoke is enabled."
          else
            echo "::warning::Authenticated role smoke is BLOCKED because one or more GitHub Secret credential pairs are missing. Repository seed passwords are intentionally not used. Run Platform V3 Live Role Gate with secure secrets before merge."
          fi

      - name: Run existing live-role browser audit
        if: steps.role_creds.outputs.ready == 'true'
        id: role_audit
        shell: bash
        run: |
          set +e
          npm run smoke:role-pages-live
          code=$?
          echo "audit_exit=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Require all secret-backed public smoke roles green and admin only blocked
        if: steps.role_creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const runId = process.env.ROLE_PAGES_AUDIT_RUN_ID;
          const reportPath = path.join('audit-artifacts', 'ui-audit-exhaustive', runId, 'role-pages-audit.json');
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const required = ['guest', 'student', 'teacher', 'supervisor', 'parent'];
          const loginByRole = new Map(report.loginResults.map((item) => [item.role, item]));
          for (const role of required) {
            const login = loginByRole.get(role);
            if (!login?.ok) throw new Error(`${role} login is not green: ${login?.reason || 'missing result'}`);
            const entries = report.results.filter((item) => item.role === role);
            if (!entries.length) throw new Error(`${role} has no page results`);
            const bad = entries.filter((item) => item.status !== 'PASS');
            if (bad.length) throw new Error(`${role} has ${bad.length} non-PASS page result(s)`);
          }
          const adminLogin = loginByRole.get('admin');
          if (adminLogin?.ok || adminLogin?.reason !== 'missing credentials') {
            throw new Error(`admin must be the only intentionally blocked credential set, got: ${JSON.stringify(adminLogin)}`);
          }
          const adminEntries = report.results.filter((item) => item.role === 'admin');
          if (!adminEntries.length || adminEntries.some((item) => item.status !== 'BLOCKED')) {
            throw new Error('admin page entries are not exclusively BLOCKED');
          }
          const failures = report.results.filter((item) => item.status === 'FAIL');
          if (failures.length) throw new Error(`live role audit reported ${failures.length} FAIL result(s)`);
          const pass = report.results.filter((item) => item.status === 'PASS').length;
          console.log(JSON.stringify({ total: report.total, pass, fail: report.fail, blocked: report.blocked, adminBlocked: adminEntries.length }, null, 2));
          NODE

      - name: Record secure role-smoke blocker
        if: steps.role_creds.outputs.ready != 'true'
        shell: bash
        run: |
          {
            echo "### Authenticated role smoke: BLOCKED"
            echo ""
            echo "This PR no longer reads demo passwords from repository seed files."
            echo "Configure the ROLE_* GitHub Secrets and rerun this check, or run Platform V3 Live Role Gate before merge."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload role evidence
        if: always() && steps.role_creds.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: platform-v3-public-smoke-roles-${{ github.run_id }}
          path: audit-artifacts/ui-audit-exhaustive/platform-v3-public-smoke-roles-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop exact recovery frontend
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/platform-v3-role-preview.pid ]; then
            kill "$(cat /tmp/platform-v3-role-preview.pid)" 2>/dev/null || true
          fi
