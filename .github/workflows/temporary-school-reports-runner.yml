name: Temporary School Reports Runner

on:
  pull_request:
    branches:
      - refactor/reports-runner-base
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-verified-reports-phase:
    if: github.head_ref == 'refactor/reports-runner-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout target refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/repository-v2-safe
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Apply reports presentation extraction
        run: python tools/refactor/apply-school-reports-extraction.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Full reports phase review
        run: node tools/refactor/phase-review-school-reports.mjs

      - name: Restore generated audit snapshots
        run: git checkout -- docs/architecture/generated

      - name: Commit only verified non-workflow changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          status_path = Path('docs/architecture/CURRENT_REFACTOR_STATUS_AR.md')
          status = status_path.read_text(encoding='utf-8')
          status += '''\n## إغلاق دفعة Schools Relations Presentation ✅\n\n- Safety Gate run `#285`: **PASS**.\n- Vercel Preview Gate لنفس checkpoint: **PASS**.\n- تم فصل status/readiness وquick supervisor UI مع بقاء API/store/orchestration خارج presentation children.\n\n## دفعة Schools Reports Presentation\n\n- تم استخراج reports tab من `SchoolsManager.tsx` إلى `SchoolReportsPanel.tsx`.\n- تم فصل handover/readiness report إلى `SchoolHandoverReportSummary.tsx`.\n- تم فصل performance metrics/weak skills/class summaries إلى `SchoolPerformanceReportPanel.tsx`.\n- Full Reports Phase Review: **PASS** قبل commit الإغلاق.\n- القبول النهائي ينتظر Safety Gate + Vercel Preview Gate على commit الناتج.\n'''
          status_path.write_text(status, encoding='utf-8')

          ledger_path = Path('docs/architecture/REFACTOR_V2_EXECUTION_LEDGER_AR.md')
          ledger = ledger_path.read_text(encoding='utf-8')
          ledger += '''\n## دفعة Schools Reports Presentation\n\n**الحالة: Full Phase Review PASS؛ تنتظر Safety Gate + Vercel Preview على commit الإغلاق.**\n\n- نقل report tab من God Component إلى feature-owned presentation composition.\n- حافظت الدفعة على readiness decision، downloads/print، blocking gaps/navigation، loading/error/empty states، performance metrics، weakest skills، class summaries.\n- presentation children لا تستورد API أو global store.\n- `smoke-school-management-contract.mjs` أصبح يتبع ownership الجديد بدل إجبار markup على البقاء في parent.\n- أضيف direct boundary contract جديد وحدود أحجام للملفات المستخرجة.\n'''
          ledger_path.write_text(ledger, encoding='utf-8')
          PY

          git rm -f tools/refactor/apply-school-reports-extraction.py
          git config user.name "almeaa-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboards/admin/SchoolsManager.tsx \
            scripts/smoke-school-management-contract.mjs \
            docs/architecture/CURRENT_REFACTOR_STATUS_AR.md \
            docs/architecture/REFACTOR_V2_EXECUTION_LEDGER_AR.md
          git diff --cached --check
          git status --short
          git commit -m "refactor(schools): extract reports presentation boundaries"
          git push origin HEAD:refactor/repository-v2-safe
