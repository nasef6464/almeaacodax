name: Temporary Refactor Phase Runner

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  run-schools-workspace-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout target refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/repository-v2-safe
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Apply relationship workspace extraction
        run: python tools/refactor/apply-schools-relationship-viewmodel.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Direct relationship workspace contract
        run: node scripts/smoke-schools-relationship-viewmodel-contract.mjs

      - name: Fast targeted schools gate
        run: node tools/refactor/quick-check.mjs schools

      - name: Full schools workspace phase review
        run: node tools/refactor/phase-review-schools-workspace.mjs

      - name: Restore generated audit snapshots
        run: git checkout -- docs/architecture/generated

      - name: Finalize verified phase
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ledger_path = Path('docs/architecture/REFACTOR_V2_EXECUTION_LEDGER_AR.md')
          ledger = ledger_path.read_text(encoding='utf-8')
          ledger = ledger.replace(
              '**الحالة: تم تطبيق أول دفعة من workspace extraction وتنتظر Quick + Full Gate.**',
              '**الحالة: أول دفعة Workspace Full Phase Review PASS؛ تنتظر Safety Gate القياسي.**',
              1,
          )
          if 'Schools relationship workspace Full Phase Review' not in ledger:
              ledger += '\n- Schools relationship workspace Full Phase Review: **PASS** قبل إنشاء commit الدفعة.\n'
          ledger_path.write_text(ledger, encoding='utf-8')
          PY

          git rm -f tools/refactor/apply-schools-relationship-viewmodel.py
          git config user.name "almeaa-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "refactor(schools): extract relationship workspace view model"
          git push origin HEAD:refactor/repository-v2-safe
