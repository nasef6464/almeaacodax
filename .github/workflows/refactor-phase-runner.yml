name: Temporary Refactor Phase Runner

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  run-schools-readiness-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout target refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/repository-v2-safe
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Apply schools readiness extraction
        run: python tools/refactor/apply-schools-readiness-decomposition.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Direct readiness view-model contract
        run: node scripts/smoke-schools-readiness-viewmodel-contract.mjs

      - name: Fast targeted schools gate
        run: node tools/refactor/quick-check.mjs schools

      - name: Full schools readiness phase review
        run: node tools/refactor/phase-review-schools-readiness.mjs

      - name: Restore generated audit snapshots
        run: git checkout -- docs/architecture/generated

      - name: Finalize verified phase
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ledger_path = Path('docs/architecture/REFACTOR_V2_EXECUTION_LEDGER_AR.md')
          ledger = ledger_path.read_text(encoding='utf-8')
          ledger = ledger.replace(
              '**الحالة: تم تطبيق استخراج readiness/view-model وتنتظر Full Phase Review قبل الإغلاق.**',
              '**الحالة: Full Phase Review PASS؛ تنتظر Safety Gate القياسي على commit الناتج.**',
              1,
          )
          if 'Schools readiness Full Phase Review' not in ledger:
              ledger += '\n- Schools readiness Full Phase Review: **PASS** قبل إنشاء commit المرحلة.\n'
          ledger_path.write_text(ledger, encoding='utf-8')
          PY

          git rm -f tools/refactor/apply-schools-readiness-decomposition.py
          git config user.name "almeaa-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "refactor(schools): extract readiness view model"
          git push origin HEAD:refactor/repository-v2-safe
