name: Temporary Refactor Phase Runner

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  run-schools-roster-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout target refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/repository-v2-safe
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Apply roster filter and pagination extraction
        run: python tools/refactor/apply-schools-roster-viewmodel.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Direct roster view-model contract
        run: node scripts/smoke-schools-roster-viewmodel-contract.mjs

      - name: Fast targeted schools gate
        run: node tools/refactor/quick-check.mjs schools

      - name: Full schools workspace phase review
        run: node tools/refactor/phase-review-schools-workspace.mjs

      - name: Restore generated audit snapshots
        run: git checkout -- docs/architecture/generated

      - name: Finalize verified phase
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          checkpoint_path = Path('docs/architecture/REFACTOR_V2_LATEST_CHECKPOINT_AR.md')
          checkpoint = checkpoint_path.read_text(encoding='utf-8')
          checkpoint = checkpoint.replace(
              '## Roster/filter/pagination extraction — قيد التحقق',
              '## Roster/filter/pagination extraction — Full Phase Review PASS',
              1,
          )
          if 'Roster Full Phase Review: **PASS**' not in checkpoint:
              checkpoint += '\n- Roster Full Phase Review: **PASS** قبل إنشاء commit الدفعة؛ القبول النهائي ينتظر Standard Safety Gate.\n'
          checkpoint_path.write_text(checkpoint, encoding='utf-8')
          PY

          git rm -f tools/refactor/apply-schools-roster-viewmodel.py
          git config user.name "almeaa-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "refactor(schools): extract roster view model"
          git push origin HEAD:refactor/repository-v2-safe
