name: Refactor V2 Safety Gate

on:
  push:
    branches:
      - refactor/repository-v2-safe
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'apps/**'
      - 'server/**'
      - 'pages/**'
      - 'components/**'
      - 'dashboards/**'
      - 'contexts/**'
      - 'services/**'
      - 'store/**'
      - 'utils/**'
      - 'hooks/**'
      - 'styles/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - 'App.tsx'
      - 'index.tsx'
      - 'types.ts'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - 'Dockerfile.*'
      - '.github/workflows/refactor-v2-guard.yml'

permissions:
  contents: read
  statuses: read

concurrency:
  group: refactor-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Frontend typecheck
        run: npm run typecheck

      - name: API typecheck
        run: npm run server:check

      - name: Frontend production build
        run: npm run build

      - name: API production build
        run: npm run server:build

      - name: Generate architecture snapshot
        run: node tools/refactor/repository-audit.mjs

      - name: Immutable architecture contract gate
        run: node tools/refactor/architecture-gate.mjs

      - name: Progressive module boundary gate
        run: node tools/refactor/module-boundary-gate.mjs

      - name: School management contract
        run: node scripts/smoke-school-management-contract.mjs

      - name: School XLSX safety contract
        run: node scripts/smoke-xlsx-safety-contract.mjs

      - name: School import parsing logic and performance contract
        run: npm run smoke:schools-import-parsing

      - name: School readiness view-model logic contract
        run: node scripts/smoke-schools-readiness-viewmodel-contract.mjs

      - name: School relationship workspace logic contract
        run: node scripts/smoke-schools-relationship-viewmodel-contract.mjs

      - name: School decision and handover workspace logic contract
        run: node scripts/smoke-schools-workspace-viewmodel-contract.mjs

      - name: School roster filter and pagination logic contract
        run: node scripts/smoke-schools-roster-viewmodel-contract.mjs

      - name: School package access projection contract
        run: node scripts/smoke-schools-package-access-viewmodel-contract.mjs

      - name: School package card presentation boundary contract
        run: node scripts/smoke-schools-package-card-boundary-contract.mjs

      - name: School access codes presentation boundary contract
        run: node scripts/smoke-schools-access-codes-boundary-contract.mjs

      - name: School relations import presentation boundary contract
        run: node scripts/smoke-schools-relations-import-boundary-contract.mjs

      - name: School relations report presentation boundary contract
        run: node scripts/smoke-schools-relations-report-boundary-contract.mjs

      - name: School relations status presentation boundary contract
        run: node scripts/smoke-schools-relations-status-boundary-contract.mjs

      - name: School quick supervisor presentation boundary contract
        run: node scripts/smoke-schools-quick-supervisor-boundary-contract.mjs

      - name: Frontend performance contract
        run: npm run smoke:performance

      - name: School package revenue contract
        run: node scripts/smoke-package-revenue-contract.mjs

      - name: School admin relationship contract
        run: node scripts/smoke-batch136-admin-users-schools-parent-payment-contract.mjs

      - name: School relationship audit contract
        run: node scripts/smoke-batch100f-relationship-audit-contract.mjs

      - name: Route loading contract
        run: npm run smoke:route-loading

      - name: Runtime source contract
        run: npm run smoke:runtime-source

      - name: Quiz integrity contract
        run: npm run smoke:quiz-integrity-guard

      - name: Authentication security contract
        run: npm run smoke:auth-login-security

      - name: API security contract
        run: npm run smoke:api-security

  preview-deployment-gate:
    name: Vercel preview deployment gate
    needs: baseline-quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Vercel preview to become ready
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_SHA="${PR_HEAD_SHA:-$PUSH_SHA}"
          echo "Waiting for Vercel status on ${DEPLOY_SHA}"

          for attempt in $(seq 1 60); do
            STATUS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEPLOY_SHA}/status")"
            STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[] | select(.context == "Vercel")][0].state // "missing"')"
            TARGET_URL="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[] | select(.context == "Vercel")][0].target_url // ""')"

            echo "Attempt ${attempt}/60: Vercel=${STATE}"
            case "$STATE" in
              success)
                echo "Vercel preview deployment is ready."
                if [ -n "$TARGET_URL" ]; then
                  echo "Deployment status page: $TARGET_URL"
                fi
                exit 0
                ;;
              failure|error)
                echo "Vercel reported deployment failure for ${DEPLOY_SHA}."
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "Timed out waiting for Vercel preview deployment status."
          exit 1

  execute-school-reports-extraction:
    if: github.event_name == 'push' && github.event.head_commit.message == 'ci(refactor): execute school reports extraction'
    needs: baseline-quality-gate
    permissions:
      contents: write
      statuses: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/repository-v2-safe
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Apply reports presentation extraction
        run: python tools/refactor/apply-school-reports-extraction.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Full reports phase review
        run: node tools/refactor/phase-review-school-reports.mjs

      - name: Restore generated audit snapshots
        run: git checkout -- docs/architecture/generated

      - name: Finalize verified reports phase
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          guard_path = Path('.github/workflows/refactor-v2-guard.yml')
          guard = guard_path.read_text(encoding='utf-8')
          marker = '\n  execute-school-reports-extraction:\n'
          if marker not in guard:
              raise SystemExit('Temporary reports executor marker not found.')
          guard = guard.split(marker, 1)[0].rstrip() + '\n'

          quick_step = '''      - name: School quick supervisor presentation boundary contract\n        run: node scripts/smoke-schools-quick-supervisor-boundary-contract.mjs\n\n'''
          report_step = quick_step + '''      - name: School reports presentation boundary contract\n        run: node scripts/smoke-schools-reports-boundary-contract.mjs\n\n'''
          if 'School reports presentation boundary contract' not in guard:
              if quick_step not in guard:
                  raise SystemExit('Quick supervisor step insertion point not found.')
              guard = guard.replace(quick_step, report_step, 1)
          guard_path.write_text(guard, encoding='utf-8')

          status_path = Path('docs/architecture/CURRENT_REFACTOR_STATUS_AR.md')
          status = status_path.read_text(encoding='utf-8')
          status += '''\n## إغلاق دفعة Schools Relations Presentation ✅\n\n- Safety Gate run `#285`: **PASS**.\n- Vercel Preview Gate لنفس checkpoint: **PASS**.\n- تم فصل status/readiness وquick supervisor UI مع بقاء API/store/orchestration خارج presentation children.\n\n## دفعة Schools Reports Presentation\n\n- تم استخراج reports tab من `SchoolsManager.tsx` إلى `SchoolReportsPanel.tsx`.\n- تم فصل handover/readiness report إلى `SchoolHandoverReportSummary.tsx`.\n- تم فصل performance metrics/weak skills/class summaries إلى `SchoolPerformanceReportPanel.tsx`.\n- Full Reports Phase Review: **PASS** قبل commit الإغلاق.\n- القبول النهائي ينتظر Safety Gate + Vercel Preview Gate على commit الناتج.\n'''
          status_path.write_text(status, encoding='utf-8')

          ledger_path = Path('docs/architecture/REFACTOR_V2_EXECUTION_LEDGER_AR.md')
          ledger = ledger_path.read_text(encoding='utf-8')
          ledger += '''\n## دفعة Schools Reports Presentation\n\n**الحالة: Full Phase Review PASS؛ تنتظر Safety Gate + Vercel Preview على commit الإغلاق.**\n\n- نقل report tab من God Component إلى feature-owned presentation composition.\n- حافظت الدفعة على readiness decision، downloads/print، blocking gaps/navigation، loading/error/empty states، performance metrics، weakest skills، class summaries.\n- presentation children لا تستورد API أو global store.\n- `smoke-school-management-contract.mjs` أصبح يتبع ownership الجديد بدل إجبار markup على البقاء في parent.\n- أضيف direct boundary contract جديد وحدود أحجام للملفات المستخرجة.\n'''
          ledger_path.write_text(ledger, encoding='utf-8')
          PY

          git rm -f tools/refactor/apply-school-reports-extraction.py
          git config user.name "almeaa-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "refactor(schools): extract reports presentation boundaries"
          git push origin HEAD:refactor/repository-v2-safe
