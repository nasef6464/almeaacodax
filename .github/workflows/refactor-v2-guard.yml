name: Refactor V2 Safety Gate

on:
  push:
    branches:
      - refactor/repository-v2-safe
  pull_request:
    branches:
      - main
      - refactor/phase-runner-base
    paths:
      - 'src/**'
      - 'apps/**'
      - 'server/**'
      - 'pages/**'
      - 'components/**'
      - 'dashboards/**'
      - 'contexts/**'
      - 'services/**'
      - 'store/**'
      - 'utils/**'
      - 'hooks/**'
      - 'styles/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - 'App.tsx'
      - 'index.tsx'
      - 'types.ts'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - 'Dockerfile.*'
      - '.github/workflows/refactor-v2-guard.yml'

permissions:
  contents: write

concurrency:
  group: refactor-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Frontend typecheck
        run: npm run typecheck

      - name: API typecheck
        run: npm run server:check

      - name: Frontend production build
        run: npm run build

      - name: API production build
        run: npm run server:build

      - name: Generate architecture snapshot
        run: node tools/refactor/repository-audit.mjs

      - name: Immutable architecture contract gate
        run: node tools/refactor/architecture-gate.mjs

      - name: Progressive module boundary gate
        run: node tools/refactor/module-boundary-gate.mjs

      - name: School management contract
        run: node scripts/smoke-school-management-contract.mjs

      - name: School XLSX safety contract
        run: node scripts/smoke-xlsx-safety-contract.mjs

      - name: School package revenue contract
        run: node scripts/smoke-package-revenue-contract.mjs

      - name: School admin relationship contract
        run: node scripts/smoke-batch136-admin-users-schools-parent-payment-contract.mjs

      - name: School relationship audit contract
        run: node scripts/smoke-batch100f-relationship-audit-contract.mjs

      - name: Route loading contract
        run: npm run smoke:route-loading

      - name: Runtime source contract
        run: npm run smoke:runtime-source

      - name: Quiz integrity contract
        run: npm run smoke:quiz-integrity-guard

      - name: Authentication security contract
        run: npm run smoke:auth-login-security

      - name: API security contract
        run: npm run smoke:api-security

  execute-schools-import-decomposition:
    if: (github.event_name == 'push' && github.event.head_commit.message == 'ci(refactor): execute schools import decomposition') || (github.event_name == 'pull_request' && (github.head_ref == 'refactor/repository-v2-safe' || github.head_ref == 'refactor/phase-runner-trigger'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/repository-v2-safe
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Apply extraction patch
        run: python tools/refactor/apply-schools-import-decomposition.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Full phase review before commit
        run: node tools/refactor/phase-review-schools-import.mjs

      - name: Restore generated audit snapshots
        run: git checkout -- docs/architecture/generated

      - name: Finalize verified phase and remove temporary machinery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ledger_path = Path('docs/architecture/REFACTOR_V2_EXECUTION_LEDGER_AR.md')
          ledger = ledger_path.read_text(encoding='utf-8')
          ledger = ledger.replace(
              'الحالة: **تم تطبيق الاستخراج، وتنتظر نتيجة Phase Review قبل الإغلاق.**',
              'الحالة: **Phase Review PASS؛ تم تطبيق الدفعة، والقبول النهائي مشروط بنجاح Safety Gate على commit الناتج.**',
          )
          ledger_path.write_text(ledger, encoding='utf-8')

          guard_path = Path('.github/workflows/refactor-v2-guard.yml')
          guard = guard_path.read_text(encoding='utf-8')
          marker = '\n  execute-schools-import-decomposition:\n'
          if marker not in guard:
              raise SystemExit('Temporary patch job marker was not found during finalization.')
          guard = guard.split(marker, 1)[0].rstrip() + '\n'
          guard = guard.replace('permissions:\n  contents: write', 'permissions:\n  contents: read', 1)
          xlsx_step = '''      - name: School XLSX safety contract\n        run: node scripts/smoke-xlsx-safety-contract.mjs\n\n'''
          persistent_steps = xlsx_step + '''      - name: School import parsing logic and performance contract\n        run: npm run smoke:schools-import-parsing\n\n      - name: Frontend performance contract\n        run: npm run smoke:performance\n\n'''
          if xlsx_step not in guard:
              raise SystemExit('Safety Gate XLSX insertion point was not found during finalization.')
          guard = guard.replace(xlsx_step, persistent_steps, 1)
          guard_path.write_text(guard, encoding='utf-8')
          PY

          git rm -f tools/refactor/apply-schools-import-decomposition.py
          if [ -f .github/workflows/refactor-v2-schools-import-phase.yml ]; then
            git rm -f .github/workflows/refactor-v2-schools-import-phase.yml
          fi

          git config user.name "almeaa-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboards/admin/SchoolsManager.tsx \
            scripts/smoke-xlsx-safety-contract.mjs \
            scripts/smoke-performance-contract.mjs \
            docs/architecture/REFACTOR_V2_EXECUTION_LEDGER_AR.md \
            package.json \
            .github/workflows/refactor-v2-guard.yml
          git diff --cached --check
          git status --short
          git commit -m "refactor(schools): extract import parsing with verified phase gate"
          git push origin HEAD:refactor/repository-v2-safe
