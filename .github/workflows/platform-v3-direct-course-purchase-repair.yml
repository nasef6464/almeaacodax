name: Platform V3 Direct Course Purchase Repair

on:
  push:
    branches:
      - develop/platform-v3-recovery
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: platform-v3-direct-course-purchase-repair-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' && ((github.event_name == 'pull_request' && github.head_ref == 'develop/platform-v3-recovery') || (github.event_name == 'push' && github.ref_name == 'develop/platform-v3-recovery') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/platform-v3-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Apply exact guarded repair
        run: node tools/recovery/apply-direct-course-purchase-repair.mjs
      - name: Install frontend dependencies
        run: npm ci
      - name: Install API dependencies
        run: npm --prefix server ci
      - name: Verify package/course separation
        run: npm run smoke:package-course-split
      - name: Verify payment package contract
        run: npm run smoke:payment-package
      - name: Verify payment tampering contract
        run: npm run smoke:payment-tampering
      - name: Verify frontend types
        run: npm run typecheck
      - name: Verify API types
        run: npm run server:check
      - name: Verify frontend production build
        run: npm run build
      - name: Verify clean patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "Repair already present; nothing to commit."
            exit 0
          fi
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "components/CourseOverview.tsx" ]; then
            printf 'Unexpected changed files:\n%s\n' "${changed[*]}"
            exit 1
          fi
      - name: Commit verified repair
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No repair commit needed."
            exit 0
          fi
          remote_sha="$(git ls-remote origin refs/heads/develop/platform-v3-recovery | awk '{print $1}')"
          if [ "$remote_sha" != "$EXPECTED_SHA" ]; then
            echo "Branch moved from $EXPECTED_SHA to $remote_sha; refusing stale auto-commit."
            exit 1
          fi
          git config user.name "almeaa-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add components/CourseOverview.tsx
          mapfile -t staged < <(git diff --cached --name-only)
          if [ "${#staged[@]}" -ne 1 ] || [ "${staged[0]}" != "components/CourseOverview.tsx" ]; then
            printf 'Unexpected staged files:\n%s\n' "${staged[*]}"
            exit 1
          fi
          git commit -m "fix(courses): keep direct course purchase separate from packages"
          git push origin HEAD:develop/platform-v3-recovery
