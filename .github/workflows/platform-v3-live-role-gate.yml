name: Platform V3 Live Role Gate

on:
  workflow_dispatch:
  push:
    branches:
      - develop/platform-v3-recovery
    paths:
      - '.github/workflows/platform-v3-live-role-gate.yml'

permissions:
  contents: read

concurrency:
  group: platform-v3-live-role-gate
  cancel-in-progress: false

jobs:
  role-pages-live:
    name: Authenticated role pages — desktop + mobile
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      UI_AUDIT_BASE_URL: https://almeaacodax.vercel.app
      UI_AUDIT_API_BASE_URL: https://almeaacodax-k2ux.onrender.com/api
      ROLE_PAGES_AUDIT_RUN_ID: platform-v3-live-${{ github.run_id }}
      ROLE_STUDENT_EMAIL: ${{ secrets.ROLE_STUDENT_EMAIL }}
      ROLE_STUDENT_PASSWORD: ${{ secrets.ROLE_STUDENT_PASSWORD }}
      ROLE_ADMIN_EMAIL: ${{ secrets.ROLE_ADMIN_EMAIL }}
      ROLE_ADMIN_PASSWORD: ${{ secrets.ROLE_ADMIN_PASSWORD }}
      ROLE_PARENT_EMAIL: ${{ secrets.ROLE_PARENT_EMAIL }}
      ROLE_PARENT_PASSWORD: ${{ secrets.ROLE_PARENT_PASSWORD }}
      ROLE_TEACHER_EMAIL: ${{ secrets.ROLE_TEACHER_EMAIL }}
      ROLE_TEACHER_PASSWORD: ${{ secrets.ROLE_TEACHER_PASSWORD }}
      ROLE_SUPERVISOR_EMAIL: ${{ secrets.ROLE_SUPERVISOR_EMAIL }}
      ROLE_SUPERVISOR_PASSWORD: ${{ secrets.ROLE_SUPERVISOR_PASSWORD }}
    steps:
      - name: Checkout recovery head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Report credential availability without exposing values
        shell: bash
        run: |
          set -euo pipefail
          for role in STUDENT ADMIN PARENT TEACHER SUPERVISOR; do
            email_var="ROLE_${role}_EMAIL"
            pass_var="ROLE_${role}_PASSWORD"
            if [ -n "${!email_var:-}" ] && [ -n "${!pass_var:-}" ]; then
              echo "${role}: credentials configured"
            else
              echo "${role}: credentials missing -> audit will mark this role BLOCKED"
            fi
          done

      - name: Run authenticated role-page audit
        run: npm run smoke:role-pages-live

      - name: Upload role audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-v3-live-role-audit-${{ github.run_id }}
          path: audit-artifacts/ui-audit-exhaustive/platform-v3-live-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 14
