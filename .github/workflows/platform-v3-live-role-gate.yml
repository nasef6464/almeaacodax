name: Platform V3 Live Role Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Live Role and Public UI share one mutex per exact tested revision.
  # The SHA prevents stale PR attempts from cancelling the current exact head.
  group: platform-production-live-audit-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  role-pages-live:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    name: All authenticated roles — desktop + mobile
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      UI_AUDIT_BASE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4173' || 'https://almeaacodax.vercel.app' }}
      UI_AUDIT_API_BASE_URL: https://almeaacodax.vercel.app/api
      VITE_API_URL: /api
      ROLE_PAGES_AUDIT_RUN_ID: platform-v3-live-${{ github.run_id }}
      ROLE_STUDENT_EMAIL: ${{ secrets.ROLE_STUDENT_EMAIL }}
      ROLE_STUDENT_PASSWORD: ${{ secrets.ROLE_STUDENT_PASSWORD }}
      ROLE_ADMIN_EMAIL: ${{ secrets.ROLE_ADMIN_EMAIL }}
      ROLE_ADMIN_PASSWORD: ${{ secrets.ROLE_ADMIN_PASSWORD }}
      ROLE_PARENT_EMAIL: ${{ secrets.ROLE_PARENT_EMAIL }}
      ROLE_PARENT_PASSWORD: ${{ secrets.ROLE_PARENT_PASSWORD }}
      ROLE_TEACHER_EMAIL: ${{ secrets.ROLE_TEACHER_EMAIL }}
      ROLE_TEACHER_PASSWORD: ${{ secrets.ROLE_TEACHER_PASSWORD }}
      ROLE_SUPERVISOR_EMAIL: ${{ secrets.ROLE_SUPERVISOR_EMAIL }}
      ROLE_SUPERVISOR_PASSWORD: ${{ secrets.ROLE_SUPERVISOR_PASSWORD }}
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build exact tested frontend
        run: npm run build

      - name: Start exact recovery frontend for PR audit
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/platform-v3-live-role-preview.log 2>&1 &
          echo $! > /tmp/platform-v3-live-role-preview.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/platform-v3-live-role-preview.log || true
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Require all secure role credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=false
          for role in STUDENT ADMIN PARENT TEACHER SUPERVISOR; do
            email_var="ROLE_${role}_EMAIL"
            pass_var="ROLE_${role}_PASSWORD"
            if [ -n "${!email_var:-}" ] && [ -n "${!pass_var:-}" ]; then
              echo "${role}: credentials configured"
            else
              echo "${role}: credentials missing"
              missing=true
            fi
          done
          if [ "$missing" = "true" ]; then
            echo "::error::All five ROLE_* credential pairs are required for the live role gate."
            exit 1
          fi

      - name: Run authenticated role-page audit
        id: role_pages
        continue-on-error: true
        run: npm run smoke:role-pages-live

      - name: Run read-only deep parent + teacher journeys
        id: deep_role_v2
        continue-on-error: true
        env:
          DEEP_ROLE_V2_AUDIT_RUN_ID: platform-v3-live-${{ github.run_id }}-v2
        run: node scripts/live-parent-teacher-deep-audit.mjs

      - name: Require every role and deep journey green
        if: always()
        shell: bash
        env:
          ROLE_PAGES_OUTCOME: ${{ steps.role_pages.outcome }}
          DEEP_ROLE_V2_OUTCOME: ${{ steps.deep_role_v2.outcome }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const failures = [];
          const roleRunId = process.env.ROLE_PAGES_AUDIT_RUN_ID;
          const rolePath = path.join('audit-artifacts', 'ui-audit-exhaustive', roleRunId, 'role-pages-audit.json');
          const roleReport = JSON.parse(fs.readFileSync(rolePath, 'utf8'));
          const required = ['guest', 'student', 'admin', 'parent', 'teacher', 'supervisor'];
          const loginByRole = new Map(roleReport.loginResults.map((item) => [item.role, item]));

          for (const role of required) {
            const login = loginByRole.get(role);
            if (!login?.ok) failures.push(`${role} login: ${login?.reason || 'missing result'}`);
            const entries = roleReport.results.filter((item) => item.role === role);
            if (!entries.length) failures.push(`${role}: no page results`);
            const bad = entries.filter((item) => item.status !== 'PASS');
            if (bad.length) failures.push(`${role}: ${bad.length} non-PASS page result(s)`);
          }
          if (roleReport.fail !== 0 || roleReport.blocked !== 0) {
            failures.push(`role audit fail=${roleReport.fail}, blocked=${roleReport.blocked}`);
          }

          const deepRunId = process.env.DEEP_ROLE_V2_AUDIT_RUN_ID || `${roleRunId}-v2`;
          const deepPath = path.join('audit-artifacts', 'ui-audit-exhaustive', deepRunId, 'deep-role-v2-parent-teacher.json');
          const deepReport = JSON.parse(fs.readFileSync(deepPath, 'utf8'));
          if (deepReport.fail !== 0 || deepReport.blocked !== 0) {
            failures.push(`deep role v2 fail=${deepReport.fail}, blocked=${deepReport.blocked}`);
          }

          if (process.env.ROLE_PAGES_OUTCOME !== 'success') failures.push(`role step outcome=${process.env.ROLE_PAGES_OUTCOME}`);
          if (process.env.DEEP_ROLE_V2_OUTCOME !== 'success') failures.push(`deep role step outcome=${process.env.DEEP_ROLE_V2_OUTCOME}`);

          console.log(JSON.stringify({
            rolePages: { total: roleReport.total, pass: roleReport.pass, fail: roleReport.fail, blocked: roleReport.blocked },
            deepRoleV2: { total: deepReport.total, pass: deepReport.pass, fail: deepReport.fail, blocked: deepReport.blocked },
            failures,
          }, null, 2));

          if (failures.length) throw new Error(failures.join(' | '));
          NODE

      - name: Upload role audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-v3-live-role-audit-${{ github.run_id }}
          path: |
            audit-artifacts/ui-audit-exhaustive/platform-v3-live-${{ github.run_id }}/
            audit-artifacts/ui-audit-exhaustive/platform-v3-live-${{ github.run_id }}-v2/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop exact recovery frontend
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ -f /tmp/platform-v3-live-role-preview.pid ]; then
            kill "$(cat /tmp/platform-v3-live-role-preview.pid)" 2>/dev/null || true
          fi
