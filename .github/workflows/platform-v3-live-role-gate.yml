name: Platform V3 Live Role Gate

on:
  workflow_dispatch:
    inputs:
      classroom_audit:
        description: Run four distributed workers against an owner-authorized trial session
        type: boolean
        default: false
      classroom_session:
        description: Existing owned trial session id (24 hexadecimal characters)
        type: string
        default: ''
      classroom_release:
        description: Expected published main SHA (40 hexadecimal characters)
        type: string
        default: ''
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: platform-v3-live-role-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  role-pages-live:
    if: (github.event_name == 'workflow_dispatch' && !inputs.classroom_audit) || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    name: All authenticated roles — desktop + mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UI_AUDIT_API_BASE_URL: https://almeaacodax-codex.onrender.com/api
      ROLE_STUDENT_EMAIL: ${{ secrets.ROLE_STUDENT_EMAIL }}
      ROLE_STUDENT_PASSWORD: ${{ secrets.ROLE_STUDENT_PASSWORD }}
      ROLE_ADMIN_EMAIL: ${{ secrets.ROLE_ADMIN_EMAIL }}
      ROLE_ADMIN_PASSWORD: ${{ secrets.ROLE_ADMIN_PASSWORD }}
      ROLE_PARENT_EMAIL: ${{ secrets.ROLE_PARENT_EMAIL }}
      ROLE_PARENT_PASSWORD: ${{ secrets.ROLE_PARENT_PASSWORD }}
      ROLE_TEACHER_EMAIL: ${{ secrets.ROLE_TEACHER_EMAIL }}
      ROLE_TEACHER_PASSWORD: ${{ secrets.ROLE_TEACHER_PASSWORD }}
      ROLE_SUPERVISOR_EMAIL: ${{ secrets.ROLE_SUPERVISOR_EMAIL }}
      ROLE_SUPERVISOR_PASSWORD: ${{ secrets.ROLE_SUPERVISOR_PASSWORD }}
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build exact tested frontend
        run: npm run build

      - name: PR role and auth contracts — zero production traffic
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          node --test scripts/classroom-distributed/guards.test.mjs
          npm run smoke:auth-frontend
          npm run smoke:rbac-school-scope
          npm run smoke:parent-authority
          npm run smoke:teacher-supervisor-final-certification

      - name: Require secure role credentials for production smoke
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          missing=false
          for role in STUDENT ADMIN PARENT TEACHER SUPERVISOR; do
            email_var="ROLE_${role}_EMAIL"
            pass_var="ROLE_${role}_PASSWORD"
            if [ -n "${!email_var:-}" ] && [ -n "${!pass_var:-}" ]; then
              echo "${role}: credentials configured"
            else
              echo "${role}: credentials missing"
              missing=true
            fi
          done
          if [ "$missing" = "true" ]; then
            echo "::error::All five ROLE_* credential pairs are required for the paced production smoke."
            exit 1
          fi

      - name: Production role auth smoke — paced and low-load
        if: github.event_name != 'pull_request'
        run: node scripts/smoke-production-role-auth-light.mjs

  classroom-distributed-browser:
    if: github.event_name == 'workflow_dispatch' && inputs.classroom_audit
    name: Classroom browser group ${{ matrix.group }} (6 independent contexts)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [0, 1, 2, 3]
    env:
      CLASSROOM_AUDIT_GROUP: ${{ matrix.group }}
      CLASSROOM_AUDIT_SESSION: ${{ inputs.classroom_session }}
      CLASSROOM_AUDIT_RELEASE: ${{ inputs.classroom_release }}
      CLASSROOM_AUDIT_FIXTURE: ${{ secrets[format('ALMEAA_CLASSROOM_AUDIT_GROUP_{0}', matrix.group)] }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install existing audit dependencies
        run: npm ci
      - name: Verify fail-closed fixture and sanitized traffic contracts
        run: node --test scripts/classroom-distributed/guards.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Six production browser journeys on the owned trial only
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CLASSROOM_AUDIT_FIXTURE" | node scripts/classroom-distributed/worker.mjs \
            --group "$CLASSROOM_AUDIT_GROUP" --session "$CLASSROOM_AUDIT_SESSION" \
            --release "$CLASSROOM_AUDIT_RELEASE" --run-id "$GITHUB_RUN_ID" --runner "$RUNNER_NAME"
      - name: Upload sanitized measurement receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-distributed-${{ github.run_id }}-group-${{ matrix.group }}
          path: output/classroom-distributed/
          if-no-files-found: error
          retention-days: 7
