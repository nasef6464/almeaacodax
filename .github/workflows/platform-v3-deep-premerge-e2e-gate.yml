name: Platform V3 Deep Pre-Merge E2E Gate

on:
  workflow_dispatch:
  push:
    branches:
      - develop/platform-v3-recovery
      - refactor/modular-platform-safe
      - codex/assessment-data-evolution
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: platform-v3-deep-premerge-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  isolated-full-stack-e2e:
    name: Full-stack roles + CRUD + school + quiz flows on isolated Mongo
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      NODE_ENV: test
      PORT: "4010"
      CLIENT_URL: http://127.0.0.1:4173
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
      MONGODB_URI: mongodb://127.0.0.1:27017/almeaa_platform_v3_deep_${{ github.run_id }}
      REDIS_URL: ""
      RATE_LIMIT_REDIS_ENABLED: "false"
      RATE_LIMIT_GLOBAL_LIMIT: "5000"
      RATE_LIMIT_AUTH_LIMIT: "500"
      RATE_LIMIT_SENSITIVE_LIMIT: "2000"
      NOTIFICATION_QUEUE_ENABLED: "false"
      GOOGLE_OAUTH_ENABLED: "false"
      DEV_LOCAL_ADMIN_BYPASS: "false"
      ADMIN_PASSWORD_SYNC_ON_BOOT: "false"
      AI_PROVIDER: none
      GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VITE_API_URL: http://127.0.0.1:4010/api
      UI_AUDIT_BASE_URL: http://127.0.0.1:4173
      UI_AUDIT_API_BASE_URL: http://127.0.0.1:4010/api
      SEED_API_BASE_URL: http://127.0.0.1:4010/api
      SMOKE_API_BASE_URL: http://127.0.0.1:4010/api
      SMOKE_ALLOW_PASSWORD_LOGIN: "true"
      ADMIN_NAME: Platform V3 Deep E2E Admin
      ADMIN_EMAIL: nasef64@gmail.com
      ROLE_ADMIN_EMAIL: nasef64@gmail.com
      SMOKE_ADMIN_EMAIL: nasef64@gmail.com
      ROLE_STUDENT_EMAIL: student.a@almeaa.local
      SMOKE_STUDENT_EMAIL: student.a@almeaa.local
      SMOKE_STUDENT_REDEEMED_EMAIL: student.d@almeaa.local
      ROLE_TEACHER_EMAIL: teacher.quant@almeaa.local
      SMOKE_TEACHER_EMAIL: teacher.quant@almeaa.local
      ROLE_SUPERVISOR_EMAIL: supervisor.group@almeaa.local
      SMOKE_SUPERVISOR_EMAIL: supervisor.group@almeaa.local
      ROLE_SCHOOL_SUPERVISOR_EMAIL: supervisor.school@almeaa.local
      ROLE_PARENT_EMAIL: parent.a@almeaa.local
      SMOKE_PARENT_EMAIL: parent.a@almeaa.local

    steps:
      - name: Checkout exact recovery head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        timeout-minutes: 10
        run: npm ci

      - name: Install API dependencies
        timeout-minutes: 10
        run: npm --prefix server ci

      - name: Generate masked ephemeral credentials
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { randomBytes } = require('node:crypto');
          const random = (bytes = 36) => randomBytes(bytes).toString('base64url');
          const adminPassword = random();
          const studentPassword = random();
          const redeemedStudentPassword = random();
          const teacherPassword = random();
          const supervisorPassword = random();
          const schoolSupervisorPassword = random();
          const parentPassword = random();
          const jwtSecret = random(48);
          const values = {
            ADMIN_PASSWORD: adminPassword,
            ROLE_ADMIN_PASSWORD: adminPassword,
            SMOKE_ADMIN_PASSWORD: adminPassword,
            ROLE_STUDENT_PASSWORD: studentPassword,
            SMOKE_STUDENT_PASSWORD: studentPassword,
            SMOKE_STUDENT_REDEEMED_PASSWORD: redeemedStudentPassword,
            ROLE_TEACHER_PASSWORD: teacherPassword,
            SMOKE_TEACHER_PASSWORD: teacherPassword,
            ROLE_SUPERVISOR_PASSWORD: supervisorPassword,
            SMOKE_SUPERVISOR_PASSWORD: supervisorPassword,
            ROLE_SCHOOL_SUPERVISOR_PASSWORD: schoolSupervisorPassword,
            ROLE_PARENT_PASSWORD: parentPassword,
            SMOKE_PARENT_PASSWORD: parentPassword,
            JWT_SECRET: jwtSecret,
          };
          for (const value of Object.values(values)) console.log(`::add-mask::${value}`);
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(values).map(([key, value]) => `${key}=${value}\n`).join(''));
          NODE

      - name: Frontend typecheck
        timeout-minutes: 10
        run: npm run typecheck

      - name: API typecheck
        timeout-minutes: 10
        run: npm run server:check

      - name: Frontend production build
        timeout-minutes: 15
        run: npm run build

      - name: API production build
        timeout-minutes: 10
        run: npm run server:build

      - name: Start isolated API
        shell: bash
        run: |
          set -euo pipefail
          nohup npm --prefix server run start > /tmp/almeaa-deep-e2e-api.log 2>&1 &
          echo $! > /tmp/almeaa-deep-e2e-api.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4010/api/health >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/almeaa-deep-e2e-api.pid)" 2>/dev/null; then
              cat /tmp/almeaa-deep-e2e-api.log || true
              exit 1
            fi
            sleep 2
          done
          cat /tmp/almeaa-deep-e2e-api.log || true
          exit 1

      - name: Seed isolated recovery baseline
        timeout-minutes: 5
        run: npm run seed:recovery

      - name: Install Playwright browser
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Start isolated frontend preview
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/almeaa-deep-e2e-ui.log 2>&1 &
          echo $! > /tmp/almeaa-deep-e2e-ui.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/almeaa-deep-e2e-ui.pid)" 2>/dev/null; then
              cat /tmp/almeaa-deep-e2e-ui.log || true
              exit 1
            fi
            sleep 2
          done
          cat /tmp/almeaa-deep-e2e-ui.log || true
          exit 1

      - name: Run full-stack role audit
        timeout-minutes: 12
        run: npm run smoke:roles

      - name: Run admin CRUD browser audit
        timeout-minutes: 12
        run: npm run smoke:admin-crud

      - name: Run school supervisor browser audit
        timeout-minutes: 12
        run: npm run smoke:school-supervisor

      - name: Run school E2E read-contract audit
        timeout-minutes: 8
        run: npm run smoke:supervisor-school-e2e

      - name: Run supervisor-to-student delivery audit
        timeout-minutes: 8
        run: npm run smoke:supervisor-student-delivery

      - name: Run student school-directed assessment audit
        timeout-minutes: 8
        run: npm run smoke:student-school-tests

      - name: Run smart-classroom API E2E audit
        timeout-minutes: 8
        run: npm run smoke:smart-classroom-e2e

      - name: Run smart-classroom browser E2E audit
        timeout-minutes: 10
        run: npm run smoke:smart-classroom-ui-e2e

      - name: Run smart-classroom concurrent load audit
        timeout-minutes: 10
        run: npm run smoke:smart-classroom-load

      - name: Run public barcode browser audit
        timeout-minutes: 8
        run: npm run smoke:barcode-public-e2e

      - name: Run quiz flow browser audit
        timeout-minutes: 8
        run: npm run smoke:quiz-flow

      - name: Run post-test intervention browser audit
        timeout-minutes: 8
        run: npm run smoke:post-test-intervention

      - name: Run interactive video browser audit
        timeout-minutes: 8
        run: npm run smoke:interactive-video-e2e

      - name: Run package and course access browser audit
        timeout-minutes: 8
        run: npm run smoke:package-course-access-e2e

      - name: Run free course enrollment browser audit
        timeout-minutes: 8
        run: npm run smoke:course-free-enrollment-e2e

      - name: Run access code browser audit
        timeout-minutes: 8
        run: npm run smoke:access-code-e2e

      - name: Run user delete browser audit
        timeout-minutes: 8
        run: npm run smoke:user-delete-e2e

      - name: Run student notifications browser audit
        timeout-minutes: 8
        run: npm run smoke:student-notifications-e2e

      - name: Run course student browser audit
        timeout-minutes: 8
        run: npm run smoke:course-student-e2e

      - name: Run admin school from-scratch browser audit
        timeout-minutes: 10
        run: npm run smoke:admin-school-from-scratch-e2e

      - name: Run teacher school-assessment browser audit
        timeout-minutes: 8
        run: npm run smoke:teacher-school-assessment-e2e

      - name: Run teacher course browser audit
        timeout-minutes: 8
        run: npm run smoke:teacher-course-e2e

      - name: Run teacher course CRUD browser audit
        timeout-minutes: 8
        run: npm run smoke:teacher-course-crud-e2e

      - name: Run trainer course management browser audit
        timeout-minutes: 8
        run: npm run smoke:trainer-course-management-e2e

      - name: Run trainer content approval browser audit
        timeout-minutes: 8
        run: npm run smoke:trainer-content-approval-e2e

      - name: Run trainer analytics browser audit
        timeout-minutes: 8
        run: npm run smoke:trainer-analytics-e2e

      - name: Run course commercial journey browser audit
        timeout-minutes: 8
        run: npm run smoke:course-commercial-journey-e2e

      - name: Run school membership E2E audit
        timeout-minutes: 8
        run: npm run smoke:school-membership-e2e

      - name: Run live-session E2E audit
        timeout-minutes: 8
        run: npm run smoke:live-session-e2e

      - name: Run payment E2E audit
        timeout-minutes: 8
        run: npm run smoke:payment-e2e

      - name: Upload isolated logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platform-v3-deep-premerge-logs-${{ github.run_id }}
          path: |
            /tmp/almeaa-deep-e2e-api.log
            /tmp/almeaa-deep-e2e-ui.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop isolated services
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/almeaa-deep-e2e-ui.pid ]; then
            kill "$(cat /tmp/almeaa-deep-e2e-ui.pid)" || true
          fi
          if [ -f /tmp/almeaa-deep-e2e-api.pid ]; then
            kill "$(cat /tmp/almeaa-deep-e2e-api.pid)" || true
          fi
