name: ALMEAA Quiz Final-Answer Evidence (Isolated)
on:
  push:
    branches:
      - test/almeaa-isolated-20261008
    paths:
      - .github/workflows/almeaa-quiz-draft-evidence-boundary.yml
      - scripts/verify-quiz-draft-attempt-boundary.mjs
      - scripts/smoke-adaptive-phase4-treatment-recheck-contract.mjs
      - scripts/test-quiz-finalized-question-attempt-operations.mjs
      - pages/QuizPage.tsx
      - server/src/models/QuestionAttempt.ts
      - server/src/modules/quizzes/application/quizSubmissionSideEffects.ts
      - server/src/modules/quizzes/application/quizFinalizedQuestionAttemptOperations.ts
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-quiz-final-answer-evidence:
    name: Exact-SHA quiz draft and final evidence proof (no production)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies only (no production connections)
        run: |
          npm ci --ignore-scripts
          npm --prefix server ci --ignore-scripts
      - name: Verify draft choices never persist mastery evidence before submit
        run: |
          node --check scripts/verify-quiz-draft-attempt-boundary.mjs
          node scripts/verify-quiz-draft-attempt-boundary.mjs
      - name: Verify canonical finalized question attempts and replay behavior
        run: |
          node --check scripts/test-quiz-finalized-question-attempt-operations.mjs
          ./server/node_modules/.bin/tsx scripts/test-quiz-finalized-question-attempt-operations.mjs
      - name: Typecheck frontend and backend
        run: |
          npm run typecheck
          npm --prefix server run check
      - name: Run related pre-existing source contracts
        run: |
          node scripts/smoke-quiz-client-security-contract.mjs
          node scripts/smoke-adaptive-phase4-treatment-recheck-contract.mjs
          node scripts/smoke-quiz-submission-schema-boundary-contract.mjs
          node scripts/smoke-assessment-question-attempt-document-contract.mjs
          node scripts/smoke-exam-question-source-contract.mjs
