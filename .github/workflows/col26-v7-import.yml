name: COL26 V7 Production Import
on:
  push:
    branches:
      - ops/col26-canary-presign-20261002
    paths:
      - ops/col26-v7-import/**
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PILOT_API_BASE: https://almeaacodax.vercel.app/api
      PILOT_ADMIN_TOKEN: ${{ secrets.SMOKE_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run bounded COL26 canary
        run: bash ops/col26-v7-import/run.sh
