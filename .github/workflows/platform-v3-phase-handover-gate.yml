name: Platform V3 Phase + Handover Gate

on:
  workflow_dispatch:
  push:
    branches:
      - develop/platform-v3-recovery
      - codex/supervisor-student-journey-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: platform-v3-phase-handover-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  patch-school-directed-quiz-access:
    name: One-shot school-directed quiz access patch
    if: (github.event_name == 'pull_request' && github.head_ref == 'codex/supervisor-student-journey-hardening') || (github.event_name == 'push' && github.ref_name == 'codex/supervisor-student-journey-hardening')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/supervisor-student-journey-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch exact audience gate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'pages/QuizPage.tsx';
          const source = fs.readFileSync(path, 'utf8');
          const before = `    const hasExplicitTargets = (foundQuiz.targetUserIds || []).length > 0 || (foundQuiz.targetGroupIds || []).length > 0;
    if (!isStaffViewer && ((foundQuiz.mode || 'regular') === 'central' || hasExplicitTargets)) {
      const userGroups = user.groupIds || [];
      const isUserTargeted =
        (foundQuiz.targetUserIds || []).length === 0 || (foundQuiz.targetUserIds || []).includes(user.id);
      const isGroupTargeted =
        (foundQuiz.targetGroupIds || []).length === 0 ||
        (foundQuiz.targetGroupIds || []).some((id) => userGroups.includes(id));

      if (!isUserTargeted || !isGroupTargeted) {
        setHasAccess(false);
        setAccessMessage('هذا اختبار مركزي موجّه لطلاب محددين فقط.');
        return;
      }
    }`;
          const after = `    const targetUserIds = foundQuiz.targetUserIds || [];
    const targetGroupIds = foundQuiz.targetGroupIds || [];
    const hasExplicitTargets = targetUserIds.length > 0 || targetGroupIds.length > 0;
    if (!isStaffViewer && ((foundQuiz.mode || 'regular') === 'central' || hasExplicitTargets)) {
      const userGroups = Array.from(new Set([...(user.groupIds || []), ...(user.schoolId ? [user.schoolId] : [])]));
      const isUserTargeted = targetUserIds.length > 0 && targetUserIds.includes(user.id);
      const isGroupTargeted = targetGroupIds.length > 0 && targetGroupIds.some((id) => userGroups.includes(id));

      // Direct student targeting and school/class targeting are additive, matching the API contract.
      if (hasExplicitTargets && !isUserTargeted && !isGroupTargeted) {
        setHasAccess(false);
        setAccessMessage('هذا اختبار مدرسي موجّه لطلاب محددين فقط.');
        return;
      }
    }`;
          if (source.includes(after)) {
            console.log('Audience patch already applied.');
            process.exit(0);
          }
          if (!source.includes(before)) {
            console.error('Expected QuizPage audience block not found; refusing broad modification.');
            process.exit(1);
          }
          const next = source.replace(before, after);
          if (next === source || next.split(after).length !== 2) {
            console.error('Audience patch was not applied exactly once.');
            process.exit(1);
          }
          fs.writeFileSync(path, next);
          NODE
      - name: Verify patch and typecheck
        run: |
          grep -F "if (hasExplicitTargets && !isUserTargeted && !isGroupTargeted)" pages/QuizPage.tsx
          grep -F "...(user.schoolId ? [user.schoolId] : [])" pages/QuizPage.tsx
          npm ci
          npm run typecheck
      - name: Commit exact patch to branch
        shell: bash
        run: |
          if git diff --quiet -- pages/QuizPage.tsx; then
            echo "No source change required."
            exit 0
          fi
          git config user.name "workflow-patch-bot"
          git config user.email "workflow-patch-bot@users.noreply.github.com"
          git add pages/QuizPage.tsx
          git commit -m "Fix school-directed quiz audience access"
          git push origin HEAD:codex/supervisor-student-journey-hardening

  cross-phase-handover:
    name: Cross-phase + handover regression
    if: github.event_name != 'push' || github.ref_name == 'develop/platform-v3-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install API dependencies
        run: npm --prefix server ci
      - name: ProductConfig variant and secret-safety proof
        run: npm --prefix server run verify:product-config
      - name: ProductConfig admin ownership proof
        run: node scripts/smoke-product-config-admin-ownership-contract.mjs
      - name: Customer bootstrap dry-run and apply guards
        run: npm --prefix server run verify:customer-bootstrap
      - name: Customer deployment package proof
        run: npm --prefix server run verify:customer-packaging
      - name: API phase 4 contract
        run: npm run smoke:api-phase4
      - name: Frontend phase 5 contract
        run: npm run smoke:frontend-phase5
      - name: Security and RBAC phase 6 contract
        run: npm run smoke:security-rbac-phase6
      - name: Gate 6 question AI authoring contract
        run: node scripts/smoke-gate6-question-ai-authoring-contract.mjs
      - name: Gate 6 question usage analytics contract
        run: node scripts/smoke-gate6-question-usage-analytics-contract.mjs
      - name: Gate 6 Questions commercial closure contract
        run: node scripts/smoke-gate6-questions-commercial-closure-contract.mjs
      - name: Gate 6 curriculum ownership contract
        run: node scripts/smoke-gate6-curriculum-ownership-contract.mjs
      - name: Gate 6 Curriculum commercial closure contract
        run: node scripts/smoke-gate6-curriculum-commercial-closure-contract.mjs
      - name: Gate 6 courses product boundary contract
        run: node scripts/smoke-gate6-courses-product-boundary-contract.mjs
      - name: Exam and payment phase 8 contract
        run: npm run smoke:exam-payment-phase8
      - name: Dashboards phase 11 contract
        run: npm run smoke:dashboards-phase11
      - name: Production ops phase 14 contract
        run: npm run smoke:production-ops-phase14
      - name: QA phase 17 contract
        run: npm run smoke:qa-phase17
      - name: Deployment handover phase 19 contract
        run: npm run smoke:deployment-handover-phase19
      - name: Current handover contract
        run: npm run smoke:handover-current
      - name: Full handover gate suite
        run: npm run smoke:handover:all