name: Platform V3 Phase + Handover Gate

on:
  push:
    branches:
      - codex/supervisor-student-journey-hardening

permissions:
  contents: write

jobs:
  patch-school-wide-quiz-catalog-targeting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/supervisor-student-journey-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch exact school-wide catalog audience
        run: node scripts/patch-school-wide-quiz-catalog-targeting.mjs
      - name: Verify and typecheck
        run: |
          grep -F "...(user.schoolId ? [user.schoolId] : [])" pages/Quizzes.tsx
          grep -F "user.id, user.schoolId, visiblePathIds" pages/Quizzes.tsx
          npm ci
          npm --prefix server ci
          npm run typecheck
      - name: Commit exact patch
        shell: bash
        run: |
          if git diff --quiet -- pages/Quizzes.tsx; then
            exit 0
          fi
          git config user.name "workflow-patch-bot"
          git config user.email "workflow-patch-bot@users.noreply.github.com"
          git add pages/Quizzes.tsx
          git commit -m "Fix school-wide quiz catalog targeting"
          git push origin HEAD:codex/supervisor-student-journey-hardening