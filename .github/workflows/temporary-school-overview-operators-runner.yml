name: Temporary School Overview Operators Runner

on:
  pull_request:
    branches:
      - refactor/school-overview-operators-runner-base
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-verified-overview-operators-phase:
    if: startsWith(github.head_ref, 'refactor/school-overview-operators-runner-trigger')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout target refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/repository-v2-safe
          fetch-depth: 0

      - name: Import staged overview-operator phase files
        shell: bash
        run: |
          git checkout origin/refactor/school-overview-operators-runner-base -- \
            dashboards/admin/SchoolsManager/SchoolSingleStudentPanel.tsx \
            dashboards/admin/SchoolsManager/SchoolWideSupervisorsPanel.tsx \
            scripts/smoke-schools-overview-operators-boundary-contract.mjs \
            tools/refactor/apply-school-overview-operators-extraction.py \
            tools/refactor/phase-review-school-overview-operators.mjs

      - name: Apply overview-operator presentation extraction
        run: python tools/refactor/apply-school-overview-operators-extraction.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Full overview-operator phase review
        run: node tools/refactor/phase-review-school-overview-operators.mjs

      - name: Restore generated audit snapshots
        run: git checkout -- docs/architecture/generated

      - name: Commit verified overview-operator phase
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          status_path = Path('docs/architecture/CURRENT_REFACTOR_STATUS_AR.md')
          status = status_path.read_text(encoding='utf-8')
          status += '''\n## دفعة Schools Overview Operators Presentation\n\n- تم فصل بطاقة إضافة الطالب المنفرد إلى `SchoolSingleStudentPanel.tsx`.\n- تم فصل عرض مدير/مشرف المدرسة ونطاقاته إلى `SchoolWideSupervisorsPanel.tsx`.\n- إنشاء الطالب وربط/إزالة المشرف وتأكيد الإزالة بقيت في `SchoolsManager.tsx`؛ المكونات الجديدة تستقبل callbacks صريحة فقط.\n- Full Overview Operators Phase Review: **PASS** قبل commit التطبيق.\n- القبول النهائي ينتظر Safety Gate + Vercel Preview Gate على checkpoint التحقق.\n'''
          status_path.write_text(status, encoding='utf-8')

          ledger_path = Path('docs/architecture/REFACTOR_V2_EXECUTION_LEDGER_AR.md')
          ledger = ledger_path.read_text(encoding='utf-8')
          ledger += '''\n## دفعة Schools Overview Operators Presentation\n\n**الحالة: Full Phase Review PASS؛ تنتظر Safety Gate + Vercel Preview checkpoint.**\n\n- تم إخراج single-student presentation وschool-wide supervisor scope presentation من `SchoolsManager.tsx`.\n- API/store mutations والتأكيدات بقيت في orchestration layer، ولم تنتقل إلى child components.\n- تم تحديث عقود school management وrelationship audit لتتبع ownership الجديد عبر الملفات الجديدة.\n'''
          ledger_path.write_text(ledger, encoding='utf-8')
          PY

          git rm -f tools/refactor/apply-school-overview-operators-extraction.py
          git config user.name "almeaa-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboards/admin/SchoolsManager.tsx \
            dashboards/admin/SchoolsManager/SchoolSingleStudentPanel.tsx \
            dashboards/admin/SchoolsManager/SchoolWideSupervisorsPanel.tsx \
            scripts/smoke-school-management-contract.mjs \
            scripts/smoke-batch100f-relationship-audit-contract.mjs \
            scripts/smoke-schools-overview-operators-boundary-contract.mjs \
            tools/refactor/phase-review-school-overview-operators.mjs \
            docs/architecture/CURRENT_REFACTOR_STATUS_AR.md \
            docs/architecture/REFACTOR_V2_EXECUTION_LEDGER_AR.md
          git diff --cached --check
          git status --short
          git commit -m "refactor(schools): extract overview operator panels"
          git push origin HEAD:refactor/repository-v2-safe
