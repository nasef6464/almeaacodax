name: Refactor V2 Fix School Contract Test

on:
  push:
    branches:
      - refactor/repository-v2-safe
    paths:
      - '.github/workflows/refactor-v2-fix-school-contract-test.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/repository-v2-safe
          fetch-depth: 0

      - name: Repair obsolete supervisor panel contract marker
        shell: python
        run: |
          from pathlib import Path

          file = Path('scripts/smoke-school-management-contract.mjs')
          source = file.read_text(encoding='utf-8')
          old = "  assertIncludes(files.schools, 'data-testid=\"school-supervisors-panel\"');"
          new = "  assertIncludes(files.schools, 'data-testid=\"school-wide-supervisors-panel\"');"

          if new in source and old not in source:
              raise SystemExit(0)
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one obsolete marker, found {source.count(old)}')

          file.write_text(source.replace(old, new, 1), encoding='utf-8')

      - name: Commit contract repair
        shell: bash
        run: |
          if git diff --quiet -- scripts/smoke-school-management-contract.mjs; then
            echo "School contract marker is already current."
            exit 0
          fi
          git config user.name "almeaa-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/smoke-school-management-contract.mjs
          git commit -m "test(schools): align supervisor panel contract with current workspace"
          git push origin HEAD:refactor/repository-v2-safe
