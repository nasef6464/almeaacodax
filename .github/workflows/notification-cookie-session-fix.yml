name: Notification Cookie Session Fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/patch-notification-cookie-session.mjs'
      - 'scripts/smoke-notification-cookie-session-contract.mjs'
      - '.github/workflows/notification-cookie-session-fix.yml'

permissions:
  contents: write

concurrency:
  group: notification-cookie-session-fix-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/supervisor-student-journey-hardening
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Apply bounded notification cookie-session patch
        run: node scripts/patch-notification-cookie-session.mjs
      - name: Install frontend dependencies
        run: npm ci
      - name: Install API dependencies
        run: npm --prefix server ci
      - name: Frontend typecheck
        run: npm run typecheck
      - name: API typecheck
        run: npm run server:check
      - name: Frontend production build
        run: npm run build
      - name: API production build
        run: npm --prefix server run build
      - name: Notification cookie-session contract
        run: node scripts/smoke-notification-cookie-session-contract.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit bounded runtime and permanent contract
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch-notification-cookie-session.mjs .github/workflows/notification-cookie-session-fix.yml
          git add -A -- \
            services/api.ts \
            components/Header.tsx \
            components/NotificationBell.tsx \
            contexts/useNotificationStream.ts \
            scripts/smoke-notification-cookie-session-contract.mjs \
            .github/workflows/platform-v3-phase-handover-gate.yml \
            scripts/patch-notification-cookie-session.mjs \
            .github/workflows/notification-cookie-session-fix.yml
          if git diff --cached --quiet; then
            echo 'Notification cookie-session fix already present.'
            exit 0
          fi
          git config user.name 'almeaa-release-readiness'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Fix cookie-session notification delivery'
          git push origin HEAD:codex/supervisor-student-journey-hardening
