name: YLM26 Manifest Extract

on:
  push:
    branches:
      - chatgpt/ylm26-tahsili-content-audit-20260928
    paths:
      - '.github/workflows/ylm26-manifest-extract.yml'
      - 'tmp/ylm26-transfer/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct audited crop package
        shell: bash
        run: |
          set -euo pipefail
          cat tmp/ylm26-transfer/chunk_*.txt | base64 --decode > /tmp/ylm26.zip
          echo 'ed1f2e677f86cbb81769df28fc18386bccfe382e2604e3fbf41ee2a3ed0fffe1  /tmp/ylm26.zip' | sha256sum -c -
          mkdir -p /tmp/ylm26
          unzip -q /tmp/ylm26.zip -d /tmp/ylm26
          test "$(find /tmp/ylm26/crops_v2 -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 326
          test -s /tmp/ylm26/YLM26_CROP_MANIFEST_V2.json
          node - <<'NODE'
          const fs = require('fs');
          const p = '/tmp/ylm26/YLM26_CROP_MANIFEST_V2.json';
          const d = JSON.parse(fs.readFileSync(p, 'utf8'));
          const items = Array.isArray(d) ? d : Array.isArray(d.items) ? d.items : Array.isArray(d.questions) ? d.questions : Array.isArray(d.records) ? d.records : null;
          console.log(JSON.stringify({
            rootType: Array.isArray(d) ? 'array' : typeof d,
            keys: Array.isArray(d) ? [] : Object.keys(d),
            itemCount: items?.length ?? null,
            firstItemKeys: items?.[0] ? Object.keys(items[0]) : [],
            sample: items?.slice(0, 2) ?? null
          }, null, 2));
          if (!items || items.length !== 326) process.exit(2);
          const codes = new Set(items.map(x => x.questionCode).filter(Boolean));
          const sources = new Set(items.map(x => x.sourceItemId).filter(Boolean));
          if (codes.size !== 326 || sources.size !== 326) process.exit(3);
          NODE
      - name: Upload canonical manifest
        uses: actions/upload-artifact@v4
        with:
          name: ylm26-crop-manifest-v2
          path: /tmp/ylm26/YLM26_CROP_MANIFEST_V2.json
          if-no-files-found: error
          retention-days: 7
