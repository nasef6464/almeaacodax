name: Refactor V2 Repair Handover Blockers

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/repository-v2-safe
    paths:
      - 'tools/refactor/apply-handover-blockers-repair.mjs'
      - '.github/workflows/refactor-v2-repair-handover-blockers.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/refactor/apply-handover-blockers-repair.mjs'
      - '.github/workflows/refactor-v2-repair-handover-blockers.yml'

permissions:
  contents: write

concurrency:
  group: refactor-v2-repair-handover-blockers-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify repair preconditions
        run: node tools/refactor/apply-handover-blockers-repair.mjs --check

      - name: Apply handover blockers repair
        if: github.actor != 'github-actions[bot]'
        run: node tools/refactor/apply-handover-blockers-repair.mjs

      - name: Verify handover blockers contract
        if: github.actor != 'github-actions[bot]'
        run: npm run smoke:handover-blockers

      - name: Verify repair scope
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only | sort)"
          if [ "$CHANGED" != "docs/NEXT_SESSION_HANDOVER_AR.md" ]; then
            echo "Unexpected repair scope:" >&2
            printf '%s\n' "$CHANGED" >&2
            exit 1
          fi
          git diff --check -- docs/NEXT_SESSION_HANDOVER_AR.md

      - name: Commit verified handover repair
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          git add docs/NEXT_SESSION_HANDOVER_AR.md
          if git diff --cached --quiet; then
            echo 'No handover repair to commit.'
            exit 0
          fi

          git config user.name "almeaa-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin refactor/repository-v2-safe
          REMOTE_SHA="$(git rev-parse origin/refactor/repository-v2-safe)"
          if [ "$REMOTE_SHA" != "$EXPECTED_SHA" ]; then
            echo "Safe branch moved from ${EXPECTED_SHA} to ${REMOTE_SHA}; skipping stale repair commit safely."
            exit 0
          fi

          git commit -m "docs(readiness): record handover blockers"
          if git push origin HEAD:refactor/repository-v2-safe; then
            echo 'Verified handover blockers repair pushed successfully.'
            exit 0
          fi

          git fetch origin refactor/repository-v2-safe
          NEW_REMOTE_SHA="$(git rev-parse origin/refactor/repository-v2-safe)"
          if [ "$NEW_REMOTE_SHA" != "$EXPECTED_SHA" ]; then
            echo "Safe branch advanced to ${NEW_REMOTE_SHA}; newer verification owns the save."
            exit 0
          fi

          echo "Repair push failed while remote remained at ${EXPECTED_SHA}." >&2
          exit 1
