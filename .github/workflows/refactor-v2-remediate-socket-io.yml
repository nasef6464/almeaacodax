name: Refactor V2 Remediate Socket.IO

on:
  push:
    branches:
      - refactor/repository-v2-safe
    paths:
      - 'server/package.json'
      - 'server/package-lock.json'
      - 'server/src/sockets/**'
      - 'server/src/config/redis.ts'
      - 'scripts/smoke-security-rbac-phase6-contract.mjs'
      - 'scripts/smoke-notification-contract.mjs'
      - 'scripts/smoke-notification-phase10-contract.mjs'
      - 'docs/archive_reports/SECURITY_CHECKLIST.md'
      - 'docs/archive_reports/RBAC_MATRIX.md'
      - 'docs/archive_reports/06_07_SECURITY_RBAC_REPORT.md'
      - 'tools/refactor/assert-audit-packages-clean.mjs'
      - '.github/workflows/refactor-v2-remediate-socket-io.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'server/package.json'
      - 'server/package-lock.json'
      - 'server/src/sockets/**'
      - 'server/src/config/redis.ts'
      - 'scripts/smoke-security-rbac-phase6-contract.mjs'
      - 'scripts/smoke-notification-contract.mjs'
      - 'scripts/smoke-notification-phase10-contract.mjs'
      - 'docs/archive_reports/SECURITY_CHECKLIST.md'
      - 'docs/archive_reports/RBAC_MATRIX.md'
      - 'docs/archive_reports/06_07_SECURITY_RBAC_REPORT.md'
      - 'tools/refactor/assert-audit-packages-clean.mjs'
      - '.github/workflows/refactor-v2-remediate-socket-io.yml'

permissions:
  contents: write

concurrency:
  group: refactor-v2-remediate-socket-io-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-and-remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Record pre-remediation API production audit
        shell: bash
        run: |
          set -uo pipefail
          npm --prefix server audit --omit=dev --json > /tmp/server-prod-before.json || true
          node tools/refactor/dependency-audit-summary.mjs server-production-before /tmp/server-prod-before.json

      - name: Update only Socket.IO lock resolution
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          cp server/package.json /tmp/server-package.json.before
          npm --prefix server update --package-lock-only socket.io
          cmp --silent server/package.json /tmp/server-package.json.before || {
            echo "server/package.json changed during lock-only remediation; refusing scope expansion." >&2
            git diff -- server/package.json
            exit 1
          }
          git diff --check -- server/package-lock.json

      - name: Verify Socket.IO-owned advisories are gone
        shell: bash
        run: |
          set -uo pipefail
          npm --prefix server audit --omit=dev --json > /tmp/server-prod-after.json || true
          node tools/refactor/dependency-audit-summary.mjs server-production-after /tmp/server-prod-after.json
          node tools/refactor/assert-audit-packages-clean.mjs /tmp/server-prod-after.json ws socket.io-parser

      - name: Install exact frontend dependencies for repository contracts
        run: npm ci

      - name: Install exact remediated API dependencies
        run: npm --prefix server ci

      - name: Explain remediated Socket.IO tree
        shell: bash
        run: |
          set -uo pipefail
          echo '===== SOCKET.IO ====='
          npm --prefix server explain socket.io || true
          echo '===== ENGINE.IO ====='
          npm --prefix server explain engine.io || true
          echo '===== WS ====='
          npm --prefix server explain ws || true
          echo '===== SOCKET.IO-PARSER ====='
          npm --prefix server explain socket.io-parser || true

      - name: API typecheck
        run: npm run server:check

      - name: API production build
        run: npm run server:build

      - name: Security and Redis socket contract
        run: npm run smoke:security-rbac-phase6

      - name: Notification contract
        run: npm run smoke:notifications

      - name: Notification phase 10 contract
        run: npm run smoke:notification-phase10

      - name: Integrations runtime contract
        run: npm run smoke:integrations-runtime

      - name: API security contract
        run: npm run smoke:api-security

      - name: Runtime source contract
        run: npm run smoke:runtime-source

      - name: Global student journey contract
        run: npm run smoke:global-student-journey

      - name: Confirm remediation scope
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          if [ -z "$CHANGED" ]; then
            echo "Socket.IO tree is already clean; no lockfile remediation is required."
            exit 0
          fi
          if [ "$CHANGED" != "server/package-lock.json" ]; then
            echo "Socket.IO remediation must modify server/package-lock.json only." >&2
            exit 1
          fi

      - name: Commit verified Socket.IO remediation
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          git config user.name "almeaa-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/package-lock.json

          if git diff --cached --quiet; then
            echo "No Socket.IO lockfile remediation changes to commit."
            exit 0
          fi

          git fetch origin refactor/repository-v2-safe
          REMOTE_SHA="$(git rev-parse origin/refactor/repository-v2-safe)"
          if [ "$REMOTE_SHA" != "$EXPECTED_SHA" ]; then
            echo "Refactor branch moved from verified head ${EXPECTED_SHA} to ${REMOTE_SHA}; skipping stale remediation commit safely."
            exit 0
          fi

          git commit -m "fix(deps): remediate socket io advisories"
          git push origin HEAD:refactor/repository-v2-safe
