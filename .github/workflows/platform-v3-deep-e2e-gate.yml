name: Platform V3 Deep Pre-Merge E2E Gate

on:
  workflow_dispatch:
  push:
    branches:
      - develop/platform-v3-recovery
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: platform-v3-deep-e2e-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  isolated-deep-e2e:
    name: Isolated deep E2E — full roles + destructive-safe flows
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      NODE_ENV: test
      PORT: "5001"
      MONGODB_URI: mongodb://127.0.0.1:27017/almeaa_platform_v3_deep_e2e
      CLIENT_URL: http://127.0.0.1:4173
      VITE_API_URL: http://127.0.0.1:5001/api
      UI_AUDIT_BASE_URL: http://127.0.0.1:4173
      UI_AUDIT_API_BASE_URL: http://127.0.0.1:5001/api
      AI_PROVIDER: none
      REDIS_URL: ""
      JWT_SECRET: deep-e2e-jwt-secret-${{ github.run_id }}-${{ github.run_attempt }}
      REFRESH_TOKEN_SECRET: deep-e2e-refresh-secret-${{ github.run_id }}-${{ github.run_attempt }}
      SMTP_HOST: ""
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_REDIRECT_URI: ""
      SMARTCLASS_SEED_DEMO: "1"
      DEMO_STUDENT_PASSWORD: StudentDeepE2E!${{ github.run_id }}
      DEMO_ADMIN_PASSWORD: AdminDeepE2E!${{ github.run_id }}
      DEMO_TEACHER_PASSWORD: TeacherDeepE2E!${{ github.run_id }}
      DEMO_SUPERVISOR_PASSWORD: SupervisorDeepE2E!${{ github.run_id }}
      DEMO_PARENT_PASSWORD: ParentDeepE2E!${{ github.run_id }}
      ROLE_STUDENT_EMAIL: student@demo.local
      ROLE_ADMIN_EMAIL: admin@demo.local
      ROLE_TEACHER_EMAIL: teacher@demo.local
      ROLE_SUPERVISOR_EMAIL: supervisor@demo.local
      ROLE_PARENT_EMAIL: parent@demo.local
      ROLE_STUDENT_PASSWORD: StudentDeepE2E!${{ github.run_id }}
      ROLE_ADMIN_PASSWORD: AdminDeepE2E!${{ github.run_id }}
      ROLE_TEACHER_PASSWORD: TeacherDeepE2E!${{ github.run_id }}
      ROLE_SUPERVISOR_PASSWORD: SupervisorDeepE2E!${{ github.run_id }}
      ROLE_PARENT_PASSWORD: ParentDeepE2E!${{ github.run_id }}

    steps:
      - name: Checkout exact recovery head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Typecheck API
        run: npm run server:check

      - name: Build frontend
        run: npm run build

      - name: Build API
        run: npm run server:build

      - name: Seed isolated demo users and data
        run: npm --prefix server run seed:demo

      - name: Start isolated API
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix server run start > /tmp/platform-v3-deep-api.log 2>&1 &
          echo $! > /tmp/platform-v3-deep-api.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5001/api/health > /dev/null; then
              echo "Isolated API ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/platform-v3-deep-api.log || true
          echo "Isolated API failed to start." >&2
          exit 1

      - name: Start exact frontend build
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/platform-v3-deep-ui.log 2>&1 &
          echo $! > /tmp/platform-v3-deep-ui.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo "Isolated frontend ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/platform-v3-deep-ui.log || true
          echo "Isolated frontend failed to start." >&2
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Full live role pages — desktop + mobile
        run: npm run smoke:role-pages-live

      - name: Deep student learning journey
        run: npm run smoke:student-learning-live

      - name: Report actions live audit
        run: npm run smoke:report-actions-live

      - name: Supervisor school scope live audit
        run: npm run smoke:supervisor-school-live

      - name: Supervisor executive snapshot live audit
        run: npm run smoke:supervisor-executive-snapshot-live

      - name: School from scratch CRUD + relationships + cleanup
        run: npm run smoke:school-from-scratch-live

      - name: Public barcode live audit
        run: npm run smoke:barcode-public-tests-live

      - name: Contract regression after destructive-safe flows
        run: |
          npm run smoke:rbac-school-scope
          npm run smoke:quiz-integrity-guard
          npm run smoke:quiz-answer-exposure
          npm run smoke:payment-tampering
          npm run smoke:certificate-integrity
          npm run smoke:health-readiness

      - name: Verify isolated API remains healthy
        run: curl --fail --silent http://127.0.0.1:5001/api/health

      - name: Upload deep E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-v3-deep-e2e-${{ github.run_id }}
          path: audit-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop isolated services
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/platform-v3-deep-ui.pid ]; then
            kill "$(cat /tmp/platform-v3-deep-ui.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/platform-v3-deep-api.pid ]; then
            kill "$(cat /tmp/platform-v3-deep-api.pid)" 2>/dev/null || true
          fi
          echo "--- API log tail ---"
          tail -n 80 /tmp/platform-v3-deep-api.log 2>/dev/null || true
          echo "--- UI log tail ---"
          tail -n 40 /tmp/platform-v3-deep-ui.log 2>/dev/null || true
