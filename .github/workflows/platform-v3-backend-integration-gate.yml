name: Platform V3 Backend Integration Gate

on:
  workflow_dispatch:
  push:
    branches:
      - develop/platform-v3-recovery
      - refactor/modular-platform-safe
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: platform-v3-backend-integration-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  isolated-backend-integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'develop/platform-v3-recovery' || github.event.pull_request.head.ref == 'refactor/modular-platform-safe'
    name: Auth + RBAC + assessments + AI + certificates on isolated Mongo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: "4010"
      CLIENT_URL: http://127.0.0.1:4173
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
      MONGODB_URI: mongodb://127.0.0.1:27017/almeaa_platform_v3_ci_${{ github.run_id }}
      REDIS_URL: ""
      RATE_LIMIT_REDIS_ENABLED: "false"
      NOTIFICATION_QUEUE_ENABLED: "false"
      GOOGLE_OAUTH_ENABLED: "false"
      DEV_LOCAL_ADMIN_BYPASS: "false"
      ADMIN_PASSWORD_SYNC_ON_BOOT: "false"
      AI_PROVIDER: none
      BACKEND_INTEGRATION_BASE_URL: http://127.0.0.1:4010/api
      GIT_COMMIT_SHA: ${{ github.sha }}
      ADMIN_NAME: Platform V3 CI Bootstrap Admin
      ADMIN_EMAIL: platform-v3-ci-bootstrap-${{ github.run_id }}@example.invalid
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Generate ephemeral runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_ENV"
          const { randomBytes } = require("node:crypto");
          console.log(`JWT_SECRET=${randomBytes(48).toString("base64url")}`);
          console.log(`ADMIN_PASSWORD=${randomBytes(32).toString("base64url")}`);
          NODE

      - name: API typecheck
        run: npm --prefix server run check

      - name: API production build
        run: npm --prefix server run build

      - name: Integration harness typecheck
        run: cd server && npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --esModuleInterop --skipLibCheck --types node src/scripts/backendIntegrationGate.ts

      - name: Start exact branch API
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix server run start > /tmp/platform-v3-backend-integration-api.log 2>&1 &
          echo $! > /tmp/platform-v3-backend-integration-api.pid

          for attempt in $(seq 1 45); do
            if curl --fail --silent "$BACKEND_INTEGRATION_BASE_URL/health/ready" > /tmp/platform-v3-backend-ready.json; then
              cat /tmp/platform-v3-backend-ready.json
              exit 0
            fi
            sleep 1
          done

          echo "Isolated branch API failed to become ready." >&2
          tail -n 200 /tmp/platform-v3-backend-integration-api.log || true
          exit 1

      - name: Run real HTTP backend integration suite
        run: cd server && npx tsx src/scripts/backendIntegrationGate.ts

      - name: Print API log on failure
        if: failure()
        shell: bash
        run: tail -n 200 /tmp/platform-v3-backend-integration-api.log || true

      - name: Stop isolated branch API
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/platform-v3-backend-integration-api.pid ]; then
            kill "$(cat /tmp/platform-v3-backend-integration-api.pid)" 2>/dev/null || true
          fi
