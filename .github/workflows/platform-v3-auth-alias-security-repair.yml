name: Platform V3 Auth Alias Security Repair

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/platform-v3-auth-alias-security-repair.yml

permissions:
  contents: write

concurrency:
  group: platform-v3-auth-alias-security-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.number == 26 && github.event.pull_request.head.ref == 'develop/platform-v3-recovery'
    name: Keep /auth compatibility alias under API-equivalent protections
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact recovery head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Apply exact auth alias security parity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const appPath = 'server/src/app.ts';
          let app = fs.readFileSync(appPath, 'utf8');

          const bodyOld = '  app.use("/api/auth", express.json({ limit: "100kb" }));';
          const bodyNew = '  app.use(["/api/auth", "/auth"], express.json({ limit: "100kb" }));';
          if (app.split(bodyOld).length - 1 !== 1) throw new Error('Auth JSON limit anchor changed');
          app = app.replace(bodyOld, bodyNew);

          const rateOld = `  app.use(\n    ["/api/auth/login", "/api/auth/register", "/api/auth/forgot-password", "/api/auth/reset-password"],\n    authRateLimiter,\n  );`;
          const rateNew = `  app.use(\n    [\n      "/api/auth/login",\n      "/api/auth/register",\n      "/api/auth/forgot-password",\n      "/api/auth/reset-password",\n      "/auth/login",\n      "/auth/register",\n      "/auth/forgot-password",\n      "/auth/reset-password",\n    ],\n    authRateLimiter,\n  );`;
          if (app.split(rateOld).length - 1 !== 1) throw new Error('Auth rate-limit anchor changed');
          app = app.replace(rateOld, rateNew);

          const sensitiveOld = `    ["/api/quizzes/*/submit", "/api/ai/*", "/api/payments/*", "/api/auth/me/redeem-access-code"],`;
          const sensitiveNew = `    [\n      "/api/quizzes/*/submit",\n      "/api/ai/*",\n      "/api/payments/*",\n      "/api/auth/me/redeem-access-code",\n      "/auth/me/redeem-access-code",\n    ],`;
          if (app.split(sensitiveOld).length - 1 !== 1) throw new Error('Sensitive action limiter anchor changed');
          app = app.replace(sensitiveOld, sensitiveNew);

          const csrfOld = '  app.use("/api", csrfGuard);';
          const csrfNew = '  app.use("/api", csrfGuard);\n  app.use("/auth", csrfGuard);';
          if (app.split(csrfOld).length - 1 !== 1) throw new Error('CSRF mount anchor changed');
          app = app.replace(csrfOld, csrfNew);
          fs.writeFileSync(appPath, app);

          const csrfContractPath = 'scripts/smoke-csrf-contract.mjs';
          let csrfContract = fs.readFileSync(csrfContractPath, 'utf8');
          const guardOld = `check("csrf guard is enabled for API routes", () => {\n  assertIncludes(appSource, "import { csrfGuard } from \\\"./middleware/csrf.js\\\"");\n  assertIncludes(appSource, "app.use(\\\"/api\\\", csrfGuard)");\n});`;
          const guardNew = `check("csrf guard is enabled for API and compatibility auth routes", () => {\n  assertIncludes(appSource, "import { csrfGuard } from \\\"./middleware/csrf.js\\\"");\n  assertIncludes(appSource, "app.use(\\\"/api\\\", csrfGuard)");\n  assertIncludes(appSource, "app.use(\\\"/auth\\\", csrfGuard)");\n});\n\ncheck("compatibility auth alias keeps API-equivalent request protections", () => {\n  assertIncludes(appSource, 'app.use(["/api/auth", "/auth"], express.json({ limit: "100kb" }))');\n  for (const route of ["/auth/login", "/auth/register", "/auth/forgot-password", "/auth/reset-password"]) {\n    assertIncludes(appSource, route);\n  }\n  assertIncludes(appSource, '"/auth/me/redeem-access-code"');\n  assertIncludes(appSource, "authRateLimiter");\n  assertIncludes(appSource, "sensitiveActionRateLimiter");\n});`;
          if (csrfContract.split(guardOld).length - 1 !== 1) throw new Error('CSRF contract guard block changed');
          csrfContract = csrfContract.replace(guardOld, guardNew);
          fs.writeFileSync(csrfContractPath, csrfContract);

          const apiContractPath = 'scripts/smoke-api-security-contract.mjs';
          let apiContract = fs.readFileSync(apiContractPath, 'utf8');
          const apiLimitOld = `  assertIncludes(appSource, 'app.use("/api/auth", express.json({ limit: "100kb" }));');`;
          const apiLimitNew = `  assertIncludes(appSource, 'app.use(["/api/auth", "/auth"], express.json({ limit: "100kb" }));');`;
          if (apiContract.split(apiLimitOld).length - 1 !== 1) throw new Error('API security auth body-limit assertion changed');
          apiContract = apiContract.replace(apiLimitOld, apiLimitNew);
          fs.writeFileSync(apiContractPath, apiContract);
          NODE

      - name: CSRF contract
        run: npm run smoke:csrf
      - name: Auth login security contract
        run: npm run smoke:auth-login-security
      - name: API security contract
        run: npm run smoke:api-security
      - name: Production hardening contract
        run: npm run smoke:production-hardening
      - name: Frontend typecheck
        run: npm run typecheck
      - name: API typecheck
        run: npm --prefix server run check
      - name: Frontend production build
        run: npm run build
      - name: API production build
        run: npm --prefix server run build

      - name: Confirm narrow diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = "scripts/smoke-api-security-contract.mjs"
          test "${changed[1]}" = "scripts/smoke-csrf-contract.mjs"
          test "${changed[2]}" = "server/src/app.ts"

      - name: Commit verified alias repair
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin develop/platform-v3-recovery
          test "$(git rev-parse origin/develop/platform-v3-recovery)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/app.ts scripts/smoke-csrf-contract.mjs scripts/smoke-api-security-contract.mjs
          git commit -m "fix(security): protect auth compatibility alias"
          git push origin HEAD:develop/platform-v3-recovery
