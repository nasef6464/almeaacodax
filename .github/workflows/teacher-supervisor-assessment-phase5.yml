name: Teacher Supervisor Assessment Phase 5

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'dashboards/admin/UnifiedQuizBuilder.tsx'
      - 'dashboards/SchoolTeacherDashboard.tsx'
      - 'dashboards/school-teacher/**'
      - 'dashboards/admin/SupervisorOverviewPanel.tsx'
      - 'dashboards/admin/SupervisorTestsManager.tsx'
      - 'server/src/modules/quizzes/**'
      - 'server/src/modules/schools/application/schoolTeacherWorkspace.ts'
      - 'scripts/smoke-unified-quiz-builder-role-policy-contract.mjs'
      - 'scripts/smoke-account-workspaces-g8-contract.mjs'
      - 'scripts/smoke-supervisor-dashboard-contract.mjs'
      - 'scripts/smoke-supervisor-classroom-intervention-phase4.mjs'
      - 'scripts/smoke-assessment-directed-scope-contract.mjs'
      - 'scripts/smoke-reports-role-contract.mjs'
      - 'scripts/smoke-results-contract.mjs'
      - 'scripts/smoke-student-result-skill-integrity-contract.mjs'
      - 'scripts/smoke-unified-skill-mastery-contract.mjs'
      - 'scripts/smoke-quiz-access-contract.mjs'
      - 'package.json'
      - '.github/workflows/teacher-supervisor-assessment-phase5.yml'

permissions:
  contents: read

concurrency:
  group: teacher-supervisor-assessment-phase5-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  final-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Teacher + supervisor final certification
        run: npm run smoke:teacher-supervisor-final-certification

      - name: Frontend typecheck
        run: npm run typecheck

      - name: API typecheck
        run: npm run server:check
