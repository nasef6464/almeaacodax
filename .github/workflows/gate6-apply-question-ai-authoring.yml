name: Gate 6 Apply Question AI Authoring

on:
  push:
    branches:
      - codex/gate6-questions-curriculum-operations
    paths:
      - .github/workflows/gate6-apply-question-ai-authoring.yml

permissions:
  contents: write

jobs:
  apply-question-ai-authoring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gate 6 branch
        uses: actions/checkout@v4
        with:
          ref: codex/gate6-questions-curriculum-operations
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Apply guarded Question Bank AI codemod
        run: node scripts/gate6-apply-question-ai-authoring.mjs

      - name: Gate 6 Question AI authoring contract
        run: node scripts/smoke-gate6-question-ai-authoring-contract.mjs

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Diff safety
        run: git diff --check

      - name: Commit verified Question Bank implementation
        run: |
          if git diff --quiet -- dashboards/admin/QuestionBankManager.tsx; then
            echo "QuestionBankManager already matches the Gate 6 contract."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboards/admin/QuestionBankManager.tsx
          git commit -m "feat(questions): replace fake AI action with review-first draft"
          git push origin HEAD:codex/gate6-questions-curriculum-operations
