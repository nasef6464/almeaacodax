name: Platform V3 AI Question RBAC Repair

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/platform-v3-ai-question-rbac-repair.yml

permissions:
  contents: write

concurrency:
  group: platform-v3-ai-question-rbac-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.number == 26 && github.event.pull_request.head.ref == 'develop/platform-v3-recovery'
    name: Guard AI question generation with staff RBAC
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact recovery head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Apply exact staff RBAC guards
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const appPath = 'App.tsx';
          let app = fs.readFileSync(appPath, 'utf8');
          const appOld = '                  <Route path="/admin/quiz-gen" element={<QuizGenerator />} />';
          const appNew = '                  <Route path="/admin/quiz-gen" element={<RequireRole allowedRoles={[\'admin\', \'teacher\', \'supervisor\']}><QuizGenerator /></RequireRole>} />';
          if (app.split(appOld).length - 1 !== 1) {
            throw new Error('Expected exactly one unguarded /admin/quiz-gen route');
          }
          app = app.replace(appOld, appNew);
          fs.writeFileSync(appPath, app);

          const aiPath = 'server/src/routes/ai.routes.ts';
          let ai = fs.readFileSync(aiPath, 'utf8');
          const aiOld = 'aiRouter.post(\n  "/question",\n  asyncHandler(async (req, res) => {';
          const aiNew = 'aiRouter.post(\n  "/question",\n  requireAuth,\n  requireRole(["admin", "teacher", "supervisor"]),\n  asyncHandler(async (req, res) => {';
          if (ai.split(aiOld).length - 1 !== 1) {
            throw new Error('Expected exactly one unguarded /ai/question endpoint');
          }
          ai = ai.replace(aiOld, aiNew);
          fs.writeFileSync(aiPath, ai);

          const contractPath = 'scripts/smoke-security-rbac-phase6-contract.mjs';
          let contract = fs.readFileSync(contractPath, 'utf8');
          const filesOld = '  app: await readFile(new URL("../server/src/app.ts", import.meta.url), "utf8"),\n  auth: await readFile(new URL("../server/src/middleware/auth.ts", import.meta.url), "utf8"),';
          const filesNew = '  app: await readFile(new URL("../server/src/app.ts", import.meta.url), "utf8"),\n  clientApp: await readFile(new URL("../App.tsx", import.meta.url), "utf8"),\n  aiRoutes: await readFile(new URL("../server/src/routes/ai.routes.ts", import.meta.url), "utf8"),\n  auth: await readFile(new URL("../server/src/middleware/auth.ts", import.meta.url), "utf8"),';
          if (contract.split(filesOld).length - 1 !== 1) {
            throw new Error('Security contract file map insertion point changed');
          }
          contract = contract.replace(filesOld, filesNew);

          const checkAnchor = 'check("security documents cover phase six controls", () => {';
          const staffCheck = [
            'check("AI question generation is staff-only in UI and API", () => {',
            '  assertIncludes(files.clientApp, `<Route path="/admin/quiz-gen" element={<RequireRole allowedRoles={[\'admin\', \'teacher\', \'supervisor\']}><QuizGenerator /></RequireRole>} />`);',
            '  assertIncludes(files.aiRoutes, \'aiRouter.post(\\n  "/question",\\n  requireAuth,\\n  requireRole(["admin", "teacher", "supervisor"]),\');',
            '});',
            '',
          ].join('\n');
          if (contract.split(checkAnchor).length - 1 !== 1) {
            throw new Error('Security contract check insertion point changed');
          }
          contract = contract.replace(checkAnchor, staffCheck + checkAnchor);
          fs.writeFileSync(contractPath, contract);
          NODE

      - name: Security and RBAC contract
        run: npm run smoke:security-rbac-phase6

      - name: API security contract
        run: npm run smoke:api-security

      - name: Frontend typecheck
        run: npm run typecheck

      - name: API typecheck
        run: npm --prefix server run check

      - name: Frontend production build
        run: npm run build

      - name: API production build
        run: npm --prefix server run build

      - name: Confirm narrow diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = "App.tsx"
          test "${changed[1]}" = "scripts/smoke-security-rbac-phase6-contract.mjs"
          test "${changed[2]}" = "server/src/routes/ai.routes.ts"

      - name: Commit verified RBAC repair
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin develop/platform-v3-recovery
          test "$(git rev-parse origin/develop/platform-v3-recovery)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx server/src/routes/ai.routes.ts scripts/smoke-security-rbac-phase6-contract.mjs
          git commit -m "fix(security): guard AI question generation by staff role"
          git push origin HEAD:develop/platform-v3-recovery
