name: Refactor V2 Schools Dead Parser Cleanup

on:
  push:
    branches:
      - refactor/repository-v2-safe
    paths:
      - '.github/workflows/refactor-v2-schools-dead-parser-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/repository-v2-safe
          fetch-depth: 0

      - name: Remove unreachable commented CSV parser
        shell: python
        run: |
          from pathlib import Path

          file = Path('dashboards/admin/SchoolsManager.tsx')
          source = file.read_text(encoding='utf-8')
          start_marker = "    return parseImportRows(lines.map((line) => line.split(delimiter)));\n/*\n"
          end_marker = "*/\n};\n\nconst parseRelationRows"

          if start_marker not in source:
              if "return parseImportRows(lines.map((line) => line.split(delimiter)));\n};\n\nconst parseRelationRows" in source:
                  raise SystemExit(0)
              raise SystemExit('Dead CSV parser start marker changed')

          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = "    return parseImportRows(lines.map((line) => line.split(delimiter)));\n};\n\nconst parseRelationRows"
          source = source[:start] + replacement + source[end + len(end_marker):]

          if 'const headers = lines[0].split(delimiter).map(normalizeHeader);' in source:
              raise SystemExit('Legacy commented CSV parser still present')
          file.write_text(source, encoding='utf-8')

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- dashboards/admin/SchoolsManager.tsx; then
            echo "Dead CSV parser is already removed."
            exit 0
          fi
          git config user.name "almeaa-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboards/admin/SchoolsManager.tsx
          git commit -m "refactor(schools): remove dead CSV parser comment block"
          git push origin HEAD:refactor/repository-v2-safe
