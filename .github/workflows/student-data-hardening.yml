name: Student Data and Report Hardening
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/src/middleware/auth.ts'
      - 'server/src/app.ts'
      - 'server/src/middleware/rateLimiters.ts'
      - 'server/src/middleware/rateLimitIdentity.ts'
      - 'server/src/middleware/loginProtection.ts'
      - 'server/src/config/env.ts'
      - 'server/.env.example'
      - 'server/src/routes/auth.routes.ts'
      - 'server/src/routes/quiz*.ts'
      - 'server/src/models/CommandCenterDraft.ts'
      - 'server/src/models/CommandCenterWorkflow.ts'
      - 'server/src/models/commandIdempotencyLookup.ts'
      - 'server/src/modules/quizzes/application/quizSubmissionTaxonomyRead.ts'
      - 'server/src/routes/live-exams.routes.ts'
      - 'server/src/modules/content/http/contentBootstrapRoutes.ts'
      - 'server/src/modules/content/infrastructure/contentBootstrapOperationalData.ts'
      - 'server/src/modules/schools/application/schoolDirectoryScope.ts'
      - 'server/src/modules/schools/application/classroomSupervisorReport.ts'
      - 'server/src/modules/quizzes/application/schoolSkillReadModel.ts'
      - 'server/src/modules/quizzes/application/quizReportScope.ts'
      - 'server/src/modules/quizzes/application/schoolSkillReportJoin.ts'
      - 'server/src/models/SchoolSkillAggregate.ts'
      - 'server/src/modules/quizzes/application/schoolSkillAggregateView.ts'
      - 'server/src/modules/quizzes/http/quizResultsRoutes.ts'
      - 'server/src/modules/quizzes/infrastructure/quizResultsCache.ts'
      - 'scripts/test-student-data-*.ts'
      - 'scripts/test-teacher-report-work.ts'
      - 'scripts/test-school-skill-work.ts'
      - 'scripts/test-school-report-filter-before-limit.ts'
      - 'scripts/test-school-report-user-join.ts'
      - 'scripts/test-school-report-complete-scope.ts'
      - 'scripts/test-shared-network-rate-limits.ts'
      - 'scripts/test-shared-network-rate-identity.ts'
      - 'scripts/smoke-adaptive-phase8-school-skill-aggregates-contract.mjs'
      - 'scripts/smoke-unified-skill-mastery-contract.mjs'
      - 'scripts/test-command-idempotency-indexes.ts'
      - 'scripts/test-quiz-submission-taxonomy-work.ts'
      - 'scripts/smoke-assessment-read-model-context-contract.mjs'
      - 'scripts/smoke-assessment-side-effects-contract.mjs'
      - 'scripts/live-session-test-fixture.ts'
      - '.github/workflows/student-data-hardening.yml'
permissions:
  contents: read
jobs:
  student-data-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - name: Install isolated Mongo runner without changing manifests
        run: npm install --no-save --package-lock=false --ignore-scripts mongodb-memory-server-core@11.2.0
      - run: npm run server:check
      - run: npm --prefix server run build
      - name: Exact scopes, fresh principal and bounded report work
        run: |
          node scripts/smoke-assessment-read-model-context-contract.mjs
          node scripts/smoke-assessment-side-effects-contract.mjs
          node scripts/smoke-adaptive-phase8-school-skill-aggregates-contract.mjs
          node scripts/smoke-unified-skill-mastery-contract.mjs
          node scripts/smoke-production-hardening-contract.mjs
          node scripts/smoke-security-rbac-phase6-contract.mjs
          node scripts/smoke-auth-login-security-contract.mjs
          node scripts/smoke-api-security-contract.mjs
          node scripts/smoke-csrf-contract.mjs
          node scripts/smoke-smart-classroom-hardening-contract.mjs
          server/node_modules/.bin/tsx scripts/test-student-data-boundaries.ts
          server/node_modules/.bin/tsx scripts/test-student-data-performance.ts
          server/node_modules/.bin/tsx scripts/test-teacher-report-work.ts
          server/node_modules/.bin/tsx scripts/test-school-skill-work.ts
          server/node_modules/.bin/tsx scripts/test-school-report-filter-before-limit.ts
          server/node_modules/.bin/tsx scripts/test-school-report-user-join.ts
          server/node_modules/.bin/tsx scripts/test-school-report-complete-scope.ts
          server/node_modules/.bin/tsx scripts/test-shared-network-rate-limits.ts
          server/node_modules/.bin/tsx scripts/test-shared-network-rate-identity.ts
          server/node_modules/.bin/tsx scripts/test-command-idempotency-indexes.ts
          server/node_modules/.bin/tsx scripts/test-quiz-submission-taxonomy-work.ts
