name: Student Data and Report Hardening
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/src/middleware/auth.ts'
      - 'server/src/routes/auth.routes.ts'
      - 'server/src/routes/quiz*.ts'
      - 'server/src/routes/live-exams.routes.ts'
      - 'server/src/modules/content/http/contentBootstrapRoutes.ts'
      - 'server/src/modules/content/infrastructure/contentBootstrapOperationalData.ts'
      - 'server/src/modules/schools/application/schoolDirectoryScope.ts'
      - 'server/src/modules/schools/application/classroomSupervisorReport.ts'
      - 'server/src/modules/quizzes/application/schoolSkillReadModel.ts'
      - 'server/src/modules/quizzes/http/quizResultsRoutes.ts'
      - 'server/src/modules/quizzes/infrastructure/quizResultsCache.ts'
      - 'scripts/test-student-data-*.ts'
      - 'scripts/test-teacher-report-work.ts'
      - 'scripts/test-school-skill-work.ts'
      - 'scripts/live-session-test-fixture.ts'
      - '.github/workflows/student-data-hardening.yml'
permissions:
  contents: read
jobs:
  student-data-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - name: Install isolated Mongo runner without changing manifests
        run: npm install --no-save --package-lock=false --ignore-scripts mongodb-memory-server-core@11.2.0
      - run: npm run server:check
      - name: Exact scopes, fresh principal and bounded report work
        run: |
          server/node_modules/.bin/tsx scripts/test-student-data-boundaries.ts
          server/node_modules/.bin/tsx scripts/test-student-data-performance.ts
          server/node_modules/.bin/tsx scripts/test-teacher-report-work.ts
          server/node_modules/.bin/tsx scripts/test-school-skill-work.ts
