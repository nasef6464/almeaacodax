name: Post Deploy Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      extended_live:
        description: "Run extended production operational/OAuth/latency/Sentry checks"
        required: false
        type: boolean
        default: false
      counter_live:
        description: "Run live counter integrity browser check"
        required: false
        type: boolean
        default: false
      r2_live:
        description: "Run R2 live presign/write/read proof"
        required: false
        type: boolean
        default: false
      auth_read_load:
        description: "Run bounded authenticated student read-load measurement"
        required: false
        type: boolean
        default: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SMOKE_API_BASE_URL: https://almeaacodax.vercel.app/api
      PRODUCTION_API_BASE_URL: https://almeaacodax.vercel.app/api
      SMOKE_ADMIN_TOKEN: ${{ secrets.SMOKE_ADMIN_TOKEN }}
      SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL || secrets.ROLE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD || secrets.ROLE_ADMIN_PASSWORD }}
      SMOKE_TEACHER_EMAIL: ${{ secrets.ROLE_TEACHER_EMAIL }}
      SMOKE_TEACHER_PASSWORD: ${{ secrets.ROLE_TEACHER_PASSWORD }}
      SMOKE_SUPERVISOR_EMAIL: ${{ secrets.ROLE_SUPERVISOR_EMAIL }}
      SMOKE_SUPERVISOR_PASSWORD: ${{ secrets.ROLE_SUPERVISOR_PASSWORD }}
      SMOKE_STUDENT_EMAIL: ${{ secrets.ROLE_STUDENT_EMAIL }}
      SMOKE_STUDENT_PASSWORD: ${{ secrets.ROLE_STUDENT_PASSWORD }}
      SMOKE_STUDENT_REDEEMED_EMAIL: ${{ secrets.ROLE_STUDENT_EMAIL }}
      SMOKE_STUDENT_REDEEMED_PASSWORD: ${{ secrets.ROLE_STUDENT_PASSWORD }}
      SMOKE_PARENT_EMAIL: ${{ secrets.ROLE_PARENT_EMAIL }}
      SMOKE_PARENT_PASSWORD: ${{ secrets.ROLE_PARENT_PASSWORD }}
      ROLE_STUDENT_EMAIL: ${{ secrets.ROLE_STUDENT_EMAIL }}
      ROLE_STUDENT_PASSWORD: ${{ secrets.ROLE_STUDENT_PASSWORD }}
      ROLE_ADMIN_EMAIL: ${{ secrets.ROLE_ADMIN_EMAIL }}
      ROLE_ADMIN_PASSWORD: ${{ secrets.ROLE_ADMIN_PASSWORD }}
      ROLE_PARENT_EMAIL: ${{ secrets.ROLE_PARENT_EMAIL }}
      ROLE_PARENT_PASSWORD: ${{ secrets.ROLE_PARENT_PASSWORD }}
      ROLE_TEACHER_EMAIL: ${{ secrets.ROLE_TEACHER_EMAIL }}
      ROLE_TEACHER_PASSWORD: ${{ secrets.ROLE_TEACHER_PASSWORD }}
      ROLE_SUPERVISOR_EMAIL: ${{ secrets.ROLE_SUPERVISOR_EMAIL }}
      ROLE_SUPERVISOR_PASSWORD: ${{ secrets.ROLE_SUPERVISOR_PASSWORD }}
      SMOKE_ALLOW_PASSWORD_LOGIN: "true"
      RELEASE_API_BASE: https://almeaacodax.vercel.app/api
      EXPECTED_RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Frontend strict smoke — local contract
        run: npm run smoke:frontend:strict

      - name: Production hardening smoke — local contract
        run: npm run smoke:production-hardening

      - name: Require credentials for paced production role auth
        shell: bash
        run: |
          set -euo pipefail
          missing=false
          for role in STUDENT ADMIN PARENT TEACHER SUPERVISOR; do
            email_var="ROLE_${role}_EMAIL"
            pass_var="ROLE_${role}_PASSWORD"
            if [ -z "${!email_var:-}" ] || [ -z "${!pass_var:-}" ]; then
              echo "${role}: credentials missing"
              missing=true
            fi
          done
          if [ "$missing" = "true" ]; then
            echo "::error::Five role credential pairs are required for the lightweight post-deploy auth smoke."
            exit 1
          fi

      - name: Release identity and readiness — lightweight
        env:
          RELEASE_IDENTITY_MAX_ATTEMPTS: "40"
          RELEASE_IDENTITY_INTERVAL_MS: "15000"
        run: npm run smoke:release-identity

      - name: Production role auth smoke — paced and low-load
        run: node scripts/smoke-production-role-auth-light.mjs

      - name: Extended operational smoke — manual only
        if: github.event_name == 'workflow_dispatch' && inputs.extended_live == true
        run: npm run smoke:operational

      - name: Google OAuth live start/callback proof — manual only
        if: github.event_name == 'workflow_dispatch' && inputs.extended_live == true
        run: npm run smoke:google-oauth-live-proof

      - name: Production bounded latency evidence — manual only
        if: github.event_name == 'workflow_dispatch' && inputs.extended_live == true
        env:
          PRODUCTION_API_BASE: https://almeaacodax.vercel.app/api
          PRODUCTION_LATENCY_SAMPLES: "7"
          PRODUCTION_LATENCY_OUTPUT: audit-artifacts/production-latency/summary.json
        run: npm run measure:production-latency

      - name: Upload production latency evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.extended_live == true
        uses: actions/upload-artifact@v4
        with:
          name: production-latency-${{ github.sha }}
          path: audit-artifacts/production-latency/summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Sentry live proof smoke — manual only
        if: github.event_name == 'workflow_dispatch' && inputs.extended_live == true
        run: npm run smoke:sentry-live-proof

      - name: Install Chromium for counter certification — manual only
        if: github.event_name == 'workflow_dispatch' && inputs.counter_live == true
        run: npx playwright install --with-deps chromium

      - name: Live counter integrity — manual only
        if: github.event_name == 'workflow_dispatch' && inputs.counter_live == true
        env:
          UI_AUDIT_BASE_URL: https://almeaacodax.vercel.app
          UI_AUDIT_API_BASE_URL: https://almeaacodax.vercel.app/api
        run: npm run smoke:counter-integrity-live

      - name: Upload counter integrity evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.counter_live == true
        uses: actions/upload-artifact@v4
        with:
          name: counter-integrity-${{ github.sha }}
          path: audit-artifacts/counter-integrity/
          if-no-files-found: error
          retention-days: 14

      - name: R2 live presign/write/read proof — manual only
        if: github.event_name == 'workflow_dispatch' && inputs.r2_live == true
        run: npm run smoke:r2-live-proof

      - name: Bounded authenticated student read-load — manual only
        if: github.event_name == 'workflow_dispatch' && inputs.auth_read_load == true
        run: npm run measure:production-auth-read-load

      - name: Upload authenticated read-load evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.auth_read_load == true
        uses: actions/upload-artifact@v4
        with:
          name: production-auth-read-load-${{ github.sha }}
          path: audit-artifacts/production-auth-read-load/summary.json
          if-no-files-found: error
          retention-days: 14
