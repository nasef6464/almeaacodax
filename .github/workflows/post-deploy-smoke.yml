name: Post Deploy Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Exercise the same production transport used by browsers. Vercel proxies
      # /api to the current Render backend, avoiding stale Render service URLs.
      SMOKE_API_BASE_URL: https://almeaacodax.vercel.app/api
      SMOKE_ADMIN_TOKEN: ${{ secrets.SMOKE_ADMIN_TOKEN }}
      SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL || secrets.ROLE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD || secrets.ROLE_ADMIN_PASSWORD }}
      SMOKE_ALLOW_PASSWORD_LOGIN: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Frontend strict smoke
        run: npm run smoke:frontend:strict

      - name: Production hardening smoke
        run: npm run smoke:production-hardening

      - name: Ensure operational auth material exists
        run: |
          if [ -z "$SMOKE_ADMIN_TOKEN" ] && { [ -z "$SMOKE_ADMIN_EMAIL" ] || [ -z "$SMOKE_ADMIN_PASSWORD" ]; }; then
            echo "Operational smoke auth material is missing."
            echo "Provide SMOKE_ADMIN_TOKEN or an admin email/password pair in SMOKE_ADMIN_* or ROLE_ADMIN_* GitHub Secrets."
            exit 1
          fi

      - name: Prefer dedicated admin credentials over a stale token
        run: |
          if [ -n "$SMOKE_ADMIN_EMAIL" ] && [ -n "$SMOKE_ADMIN_PASSWORD" ]; then
            echo "SMOKE_ADMIN_TOKEN=" >> "$GITHUB_ENV"
          fi

      - name: Operational smoke
        run: npm run smoke:operational

      - name: Sentry live proof smoke
        run: npm run smoke:sentry-live-proof
