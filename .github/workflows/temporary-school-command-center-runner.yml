name: Temporary School Command Center Runner

on:
  pull_request:
    branches:
      - refactor/school-command-center-runner-base
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-verified-command-center-phase:
    if: startsWith(github.head_ref, 'refactor/school-command-center-runner-trigger')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout target refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/repository-v2-safe
          fetch-depth: 0

      - name: Import staged command-center phase files
        shell: bash
        run: |
          git checkout origin/refactor/school-command-center-runner-base -- \
            dashboards/admin/SchoolsManager/SchoolCommandCenterPanel.tsx \
            scripts/smoke-schools-command-center-boundary-contract.mjs \
            tools/refactor/apply-school-command-center-extraction.py \
            tools/refactor/phase-review-school-command-center.mjs

      - name: Apply command-center presentation extraction
        run: python tools/refactor/apply-school-command-center-extraction.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Full command-center phase review
        run: node tools/refactor/phase-review-school-command-center.mjs

      - name: Restore generated audit snapshots
        run: git checkout -- docs/architecture/generated

      - name: Commit verified command-center phase
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          status_path = Path('docs/architecture/CURRENT_REFACTOR_STATUS_AR.md')
          status = status_path.read_text(encoding='utf-8')
          status += '''\n## دفعة Schools Command Center Presentation\n\n- تم فصل مركز التشغيل، جاهزية التسليم، رحلة التسليم والإجراءات الأساسية إلى `SchoolCommandCenterPanel.tsx`.\n- التنقل، التمرير، إنشاء الفصل، فتح الطالب، توجيه المشرف وبوابة المتابعة بقيت في `SchoolsManager.tsx` عبر callbacks صريحة.\n- لم تنتقل أي API/store mutation أو منطق إنتاجي إلى مكوّن العرض الجديد.\n- Full Command Center Phase Review: **PASS** قبل commit التطبيق.\n- القبول النهائي ينتظر Safety Gate + Vercel Preview Gate على checkpoint التحقق.\n'''
          status_path.write_text(status, encoding='utf-8')

          ledger_path = Path('docs/architecture/REFACTOR_V2_EXECUTION_LEDGER_AR.md')
          ledger = ledger_path.read_text(encoding='utf-8')
          ledger += '''\n## دفعة Schools Command Center Presentation\n\n**الحالة: Full Phase Review PASS؛ تنتظر Safety Gate + Vercel Preview checkpoint.**\n\n- تم إخراج command-center/readiness/delivery/primary-actions presentation من `SchoolsManager.tsx`.\n- orchestration بقي في parent والـchild presentation-only.\n- عقود المدرسة والـrelationship audit تقرأ ownership الجديد دون تغيير السلوك أو العقود التشغيلية.\n'''
          ledger_path.write_text(ledger, encoding='utf-8')
          PY

          git rm -f tools/refactor/apply-school-command-center-extraction.py
          git config user.name "almeaa-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboards/admin/SchoolsManager.tsx \
            dashboards/admin/SchoolsManager/SchoolCommandCenterPanel.tsx \
            scripts/smoke-school-management-contract.mjs \
            scripts/smoke-batch100f-relationship-audit-contract.mjs \
            scripts/smoke-schools-command-center-boundary-contract.mjs \
            tools/refactor/phase-review-school-command-center.mjs \
            docs/architecture/CURRENT_REFACTOR_STATUS_AR.md \
            docs/architecture/REFACTOR_V2_EXECUTION_LEDGER_AR.md
          git diff --cached --check
          git status --short
          git commit -m "refactor(schools): extract command center presentation"
          git push origin HEAD:refactor/repository-v2-safe
