name: Tracked Secret Hygiene

on:
  pull_request:
    branches:
      - main
    paths:
      - 'README.md'
      - 'docs/**'
      - 'scripts/smoke-tracked-secret-hygiene-contract.mjs'
      - 'package.json'
      - '.github/workflows/tracked-secret-hygiene.yml'
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'docs/**'
      - 'scripts/smoke-tracked-secret-hygiene-contract.mjs'
      - 'package.json'
      - '.github/workflows/tracked-secret-hygiene.yml'

permissions:
  contents: read

jobs:
  tracked-secret-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan tracked documentation for reusable credentials
        run: npm run smoke:tracked-secret-hygiene
