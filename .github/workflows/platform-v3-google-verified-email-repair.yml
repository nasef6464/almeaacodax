name: Platform V3 Google Verified Email Repair

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/platform-v3-google-verified-email-repair.yml

permissions:
  contents: write

concurrency:
  group: platform-v3-google-verified-email-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.number == 26 && github.event.pull_request.head.ref == 'develop/platform-v3-recovery'
    name: Require verified Google email before account linking
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact recovery head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Apply exact verified-email guard
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const authPath = 'server/src/routes/auth.routes.ts';
          let auth = fs.readFileSync(authPath, 'utf8');
          const oldGuard = `  const email = String(profile.email || "").toLowerCase().trim();\n  if (!email) {\n    return res.redirect(\`${'${fallbackRedirect}'}&step=email\`);\n  }\n\n  let user = await UserModel.findOne({ email });`;
          const newGuard = `  const email = String(profile.email || "").toLowerCase().trim();\n  if (!email) {\n    return res.redirect(\`${'${fallbackRedirect}'}&step=email\`);\n  }\n  if (profile.email_verified !== true) {\n    return res.redirect(\`${'${fallbackRedirect}'}&step=email_unverified\`);\n  }\n\n  let user = await UserModel.findOne({ email });`;
          if (auth.split(oldGuard).length - 1 !== 1) throw new Error('Google email guard anchor changed');
          auth = auth.replace(oldGuard, newGuard);

          const createOld = `      emailVerified: Boolean(profile.email_verified),\n      emailVerifiedAt: profile.email_verified ? Date.now() : null,`;
          const createNew = `      emailVerified: true,\n      emailVerifiedAt: Date.now(),`;
          if (auth.split(createOld).length - 1 !== 1) throw new Error('Google account verification fields changed');
          auth = auth.replace(createOld, createNew);

          const updateOld = `    if (!user.emailVerified && profile.email_verified) {\n      user.emailVerified = true;\n      user.emailVerifiedAt = Date.now();\n      touched = true;\n    }`;
          const updateNew = `    if (!user.emailVerified) {\n      user.emailVerified = true;\n      user.emailVerifiedAt = Date.now();\n      touched = true;\n    }`;
          if (auth.split(updateOld).length - 1 !== 1) throw new Error('Google existing-account verification block changed');
          auth = auth.replace(updateOld, updateNew);
          fs.writeFileSync(authPath, auth);

          const contractPath = 'scripts/smoke-auth-login-security-contract.mjs';
          let contract = fs.readFileSync(contractPath, 'utf8');
          const anchor = 'check("frontend warns users about password strength", () => {';
          const check = `check("Google OAuth only links accounts after a verified email claim", () => {\n  assertIncludes(files.auth, "profile.email_verified !== true");\n  assertIncludes(files.auth, "step=email_unverified");\n  const verifiedGuardIndex = files.auth.indexOf("profile.email_verified !== true");\n  const accountLookupIndex = files.auth.indexOf("let user = await UserModel.findOne({ email });");\n  if (verifiedGuardIndex < 0 || accountLookupIndex < 0 || verifiedGuardIndex > accountLookupIndex) {\n    throw new Error("Google verified-email guard must run before local account lookup");\n  }\n});\n\n`;
          if (contract.split(anchor).length - 1 !== 1) throw new Error('Auth security contract verified-email anchor changed');
          contract = contract.replace(anchor, check + anchor);
          fs.writeFileSync(contractPath, contract);
          NODE

      - name: Auth login security contract
        run: npm run smoke:auth-login-security
      - name: Auth account contract
        run: npm run smoke:auth-account
      - name: Auth cookie contract
        run: npm run smoke:auth-cookie
      - name: API security contract
        run: npm run smoke:api-security
      - name: Frontend typecheck
        run: npm run typecheck
      - name: API typecheck
        run: npm --prefix server run check
      - name: Frontend production build
        run: npm run build
      - name: API production build
        run: npm --prefix server run build

      - name: Confirm narrow diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "scripts/smoke-auth-login-security-contract.mjs"
          test "${changed[1]}" = "server/src/routes/auth.routes.ts"

      - name: Commit verified email repair
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin develop/platform-v3-recovery
          test "$(git rev-parse origin/develop/platform-v3-recovery)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/routes/auth.routes.ts scripts/smoke-auth-login-security-contract.mjs
          git commit -m "fix(auth): require verified Google email"
          git push origin HEAD:develop/platform-v3-recovery
