name: Refactor V2 Quiz Question Presentation

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/repository-v2-safe
    paths:
      - 'server/src/routes/quiz.routes.ts'
      - 'server/src/modules/quizzes/presentation/questionPresentation.ts'
      - 'scripts/smoke-quiz-question-query-schema-boundary-contract.mjs'
      - 'scripts/smoke-quiz-definition-schema-boundary-contract.mjs'
      - 'scripts/smoke-quiz-submission-schema-boundary-contract.mjs'
      - 'scripts/smoke-quiz-question-presentation-boundary-contract.mjs'
      - 'scripts/smoke-question-html-security-contract.mjs'
      - 'tools/refactor/apply-quiz-question-presentation.mjs'
      - 'tools/refactor/phase-review-quiz-question-presentation.mjs'
      - '.github/workflows/refactor-v2-quiz-question-presentation.yml'
permissions:
  contents: write

concurrency:
  group: refactor-v2-quiz-question-presentation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Verify question presentation boundary before any apply
        run: node scripts/smoke-quiz-question-presentation-boundary-contract.mjs

      - name: Verify question HTML security owner before any apply
        run: npm run smoke:question-html-security

      - name: API typecheck on source head
        run: npm run server:check

      - name: Apply current refactor phase — quiz question presentation
        if: github.actor != 'github-actions[bot]'
        run: node tools/refactor/apply-quiz-question-presentation.mjs

      - name: Run current refactor phase review
        if: github.actor != 'github-actions[bot]'
        run: node tools/refactor/phase-review-quiz-question-presentation.mjs

      - name: Commit verified current refactor phase
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          git config user.name "almeaa-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/src/routes/quiz.routes.ts

          if git diff --cached --quiet; then
            echo "No verified question presentation refactor changes to commit."
            exit 0
          fi

          git fetch origin refactor/repository-v2-safe
          REMOTE_SHA="$(git rev-parse origin/refactor/repository-v2-safe)"
          if [ "$REMOTE_SHA" != "$EXPECTED_SHA" ]; then
            echo "Refactor branch moved from verified head ${EXPECTED_SHA} to ${REMOTE_SHA}; skipping stale auto-commit safely."
            exit 0
          fi

          git commit -m "refactor(quizzes): extract question presentation helpers"
          if git push origin HEAD:refactor/repository-v2-safe; then
            echo "Verified question presentation refactor changes pushed successfully."
            exit 0
          fi

          git fetch origin refactor/repository-v2-safe
          NEW_REMOTE_SHA="$(git rev-parse origin/refactor/repository-v2-safe)"
          if [ "$NEW_REMOTE_SHA" != "$EXPECTED_SHA" ]; then
            echo "Refactor branch advanced to ${NEW_REMOTE_SHA} during push; newer verification run owns the save."
            exit 0
          fi

          echo "Push failed while remote remained at verified head ${EXPECTED_SHA}." >&2
          exit 1
