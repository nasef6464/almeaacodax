name: Teacher Supervisor Assessment Phase 3

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'components/teacher/**'
      - 'dashboards/SchoolTeacherDashboard.tsx'
      - 'dashboards/school-teacher/**'
      - 'server/src/modules/schools/application/schoolTeacherWorkspace.ts'
      - 'scripts/smoke-account-workspaces-g8-contract.mjs'
      - '.github/workflows/teacher-supervisor-assessment-phase3.yml'

permissions:
  contents: read

concurrency:
  group: teacher-supervisor-assessment-phase3-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  phase3-teacher-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Teacher workspace regression contract
        run: npm run smoke:account-workspaces-g8

      - name: Frontend typecheck
        run: npm run typecheck

      - name: API typecheck
        run: npm run server:check
