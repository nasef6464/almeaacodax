name: Platform V3 Recovery Gate

on:
  workflow_dispatch:
  push:
    branches:
      - develop/platform-v3-recovery
  pull_request:
    branches:
      - main

permissions:
  contents: read
  statuses: read

concurrency:
  group: platform-v3-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  core-build-and-architecture:
    name: Core build + architecture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install API dependencies
        run: npm --prefix server ci
      - name: Frontend typecheck
        run: npm run typecheck
      - name: API typecheck
        run: npm run server:check
      - name: Frontend production build
        run: npm run build
      - name: API production build
        run: npm run server:build
      - name: Generate architecture snapshot
        run: node tools/refactor/repository-audit.mjs
      - name: Immutable architecture contract
        run: node tools/refactor/architecture-gate.mjs
      - name: Progressive module boundary gate
        run: node tools/refactor/module-boundary-gate.mjs
      # smoke:frontend:strict intentionally stays out of PR CI because it verifies
      # the currently deployed production commit. It belongs to post-deploy verification.
      - name: Route loading contract
        run: npm run smoke:route-loading
      - name: Runtime source contract
        run: npm run smoke:runtime-source
      - name: Frontend performance contract
        run: npm run smoke:performance

  student-assessment:
    name: Student + assessment regression
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Global student journey
        run: npm run smoke:global-student-journey
      # The deep student-learning smoke reads the deployed API/catalog. It is live
      # verification, not a deterministic PR contract, and remains available via
      # npm run smoke:student-learning-journey for post-deploy verification.
      - name: Mock exams
        run: npm run smoke:mock-exams
      - name: Exam question source
        run: npm run smoke:exam-question-source
      - name: My quizzes
        run: npm run smoke:my-quizzes
      - name: Quiz access
        run: npm run smoke:quiz-access
      - name: Quiz client security
        run: npm run smoke:quiz-client-security
      - name: Quiz integrity guard
        run: npm run smoke:quiz-integrity-guard
      - name: Quiz answer exposure
        run: npm run smoke:quiz-answer-exposure
      - name: Results
        run: npm run smoke:results
      - name: Certificate integrity
        run: npm run smoke:certificate-integrity
      # Data-visibility smoke also reads the deployed environment and can return
      # 503 during an unrelated outage. Keep it in post-deploy/live verification.

  auth-and-security:
    name: Auth + security regression
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Auth account contract
        run: npm run smoke:auth-account
      - name: Auth frontend contract
        run: npm run smoke:auth-frontend
      - name: Login security contract
        run: npm run smoke:auth-login-security
      - name: Cookie auth contract
        run: npm run smoke:auth-cookie
      - name: Token response contract
        run: npm run smoke:auth-token-response
      - name: School RBAC scope
        run: npm run smoke:rbac-school-scope
      - name: CSRF contract
        run: npm run smoke:csrf
      - name: API security contract
        run: npm run smoke:api-security
      - name: NoSQL sanitizer contract
        run: npm run smoke:nosql-sanitizer
      - name: Question HTML security
        run: npm run smoke:question-html-security
      - name: Discussions RBAC scope
        run: npm run smoke:discussions-rbac-scope

  admin-schools-reports-payments:
    name: Admin + schools + reports + payments
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: School management
        run: npm run smoke:school-management
      - name: School import parsing
        run: npm run smoke:schools-import-parsing
      - name: Admin school command center
        run: npm run smoke:admin-school-command
      - name: Supervisor dashboard
        run: npm run smoke:supervisor-dashboard
      - name: Reports role contract
        run: npm run smoke:reports-role
      - name: Package revenue
        run: npm run smoke:package-revenue
      - name: Membership pricing
        run: npm run smoke:membership-pricing
      - name: Payment package
        run: npm run smoke:payment-package
      - name: Payment tampering
        run: npm run smoke:payment-tampering
      - name: Package course split
        run: npm run smoke:package-course-split
      - name: Package path navigation
        run: npm run smoke:package-path-navigation
      - name: Admin users/schools/parent/payment contract
        run: npm run smoke:batch136-admin-users-schools-parent-payment
