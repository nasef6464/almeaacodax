name: Apply bounded free enrollment entitlement patch

on:
  push:
    branches:
      - codex/course-free-enrollment-entitlement-ui

permissions:
  contents: write

jobs:
  apply-bounded-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/course-free-enrollment-entitlement-ui
          fetch-depth: 0

      - name: Apply exact entitlement semantics patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count} for {old[:80]!r}')
              file.write_text(source.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'pages/CourseView.tsx',
              '    }, [courseId, courses]);',
              '    }, [courseId, courses, enrolledCourses]);',
          )
          replace_once(
              'pages/CourseView.tsx',
              '    const courseForCurrentAccess = withCourseAccessLocks(course, isEnrolled || isStaffViewer || isFreeCourse);',
              '    const courseForCurrentAccess = withCourseAccessLocks(course, isEnrolled || isStaffViewer);',
          )
          replace_once(
              'pages/CourseView.tsx',
              '    const canOpenCoursePlayer = isEnrolled || isStaffViewer || isFreeCourse || hasPlayablePreviewLesson;',
              '    const canOpenCoursePlayer = isEnrolled || isStaffViewer || hasPlayablePreviewLesson;\n    const needsFreeEnrollment = isFreeCourse && !isEnrolled && !isStaffViewer;',
          )
          replace_once(
              'pages/CourseView.tsx',
              "    const courseNextAction = (\n        <div className=\"mx-auto mb-4 mt-4 w-full max-w-5xl px-4\">\n            <StudentNextActionStrip\n                title={canOpenCoursePlayer ? 'ابدأ أول درس الآن' : 'افتح الباقة المناسبة'}\n                description={canOpenCoursePlayer ? 'شاهد درسًا قصيرًا، ثم انتقل لتدريب بسيط من نفس المهارة.' : 'بعد التفعيل تظهر لك الدروس والاختبارات المرتبطة بهذه الدورة.'}\n                primaryLabel={canOpenCoursePlayer ? 'ابدأ التعلم' : 'عرض الباقات'}\n                primaryHref={canOpenCoursePlayer ? `/course/${course.id}?learn=1` : '/pricing'}\n                secondaryLabel=\"التأسيس\"\n                secondaryHref={foundationHref}\n                tone={canOpenCoursePlayer ? 'indigo' : 'amber'}\n            />\n        </div>\n    );",
              "    const courseNextAction = (\n        <div className=\"mx-auto mb-4 mt-4 w-full max-w-5xl px-4\">\n            <StudentNextActionStrip\n                title={canOpenCoursePlayer ? (isEnrolled || isStaffViewer ? 'ابدأ أول درس الآن' : 'جرّب المعاينة المجانية') : needsFreeEnrollment ? 'سجّل مجانًا لفتح الدورة' : 'افتح الباقة المناسبة'}\n                description={canOpenCoursePlayer ? (isEnrolled || isStaffViewer ? 'شاهد درسًا قصيرًا، ثم انتقل لتدريب بسيط من نفس المهارة.' : 'المعاينة العامة متاحة الآن، وباقي محتوى الدورة يفتح بعد التسجيل المجاني.') : needsFreeEnrollment ? 'الدورة مجانية، لكن المحتوى المخصص للمسجلين يفتح بعد تأكيد التسجيل على حسابك.' : 'بعد التفعيل تظهر لك الدروس والاختبارات المرتبطة بهذه الدورة.'}\n                primaryLabel={canOpenCoursePlayer ? (isEnrolled || isStaffViewer ? 'ابدأ التعلم' : 'ابدأ المعاينة') : needsFreeEnrollment ? (isGuestUser ? 'تسجيل الدخول' : 'سجّل مجانًا') : 'عرض الباقات'}\n                primaryHref={canOpenCoursePlayer ? `/course/${course.id}?learn=1` : needsFreeEnrollment ? (isGuestUser ? '/?auth=login' : `/course/${course.id}?buy=1`) : '/pricing'}\n                secondaryLabel=\"التأسيس\"\n                secondaryHref={foundationHref}\n                tone={canOpenCoursePlayer || needsFreeEnrollment ? 'indigo' : 'amber'}\n            />\n        </div>\n    );",
          )
          replace_once(
              'pages/CourseView.tsx',
              '    if (isPlaying && (isEnrolled || isStaffViewer || isFreeCourse || hasPlayablePreviewLesson)) {',
              '    if (isPlaying && (isEnrolled || isStaffViewer || hasPlayablePreviewLesson)) {',
          )

          replace_once(
              'components/CourseOverview.tsx',
              '    const canUsePaidCourseFiles = isStaffViewer || isEnrolled || coursePrice <= 0;',
              '    const canUsePaidCourseFiles = isStaffViewer || isEnrolled;',
          )
          replace_once(
              'components/CourseOverview.tsx',
              "    const handleEnroll = () => {\n        if (!isEnrolled && coursePrice > 0) {\n            if (isGuestUser) {\n                navigate('/?auth=login');\n                return;\n            }\n            if (needsPathEnrollmentBeforePurchase) {\n                sendStudentToPathRegistration();\n                return;\n            }\n            setShowPaymentModal(true);\n            return;\n        }\n        enrollCourse(course.id);\n    };",
              "    const handleEnroll = () => {\n        if (isGuestUser) {\n            navigate('/?auth=login');\n            return;\n        }\n        if (!isEnrolled && coursePrice > 0) {\n            if (needsPathEnrollmentBeforePurchase) {\n                sendStudentToPathRegistration();\n                return;\n            }\n            setShowPaymentModal(true);\n            return;\n        }\n        enrollCourse(course.id);\n    };",
          )
          replace_once(
              'components/CourseOverview.tsx',
              "        if (coursePrice > 0) {\n            if (isGuestUser) {\n                navigate('/?auth=login');\n                return;\n            }\n            if (needsPathEnrollmentBeforePurchase) {",
              "        if (isGuestUser) {\n            navigate('/?auth=login');\n            return;\n        }\n\n        if (coursePrice > 0) {\n            if (needsPathEnrollmentBeforePurchase) {",
          )
          replace_once(
              'components/CourseOverview.tsx',
              "    const handleLockedCourseTestClick = () => {\n        if (isGuestUser) {\n            navigate('/?auth=login');\n            return;\n        }\n        if (needsPathEnrollmentBeforePurchase) {\n            sendStudentToPathRegistration();\n            return;\n        }\n        setShowPaymentModal(true);\n    };",
              "    const handleLockedCourseTestClick = () => {\n        if (isGuestUser) {\n            navigate('/?auth=login');\n            return;\n        }\n        if (coursePrice <= 0) {\n            enrollCourse(course.id);\n            return;\n        }\n        if (needsPathEnrollmentBeforePurchase) {\n            sendStudentToPathRegistration();\n            return;\n        }\n        setShowPaymentModal(true);\n    };",
          )
          replace_once(
              'components/CourseOverview.tsx',
              "    const handleLockedCourseFileClick = () => {\n        if (isGuestUser) {\n            navigate('/?auth=login');\n            return;\n        }\n        if (needsPathEnrollmentBeforePurchase) {\n            sendStudentToPathRegistration();\n            return;\n        }\n        setShowPaymentModal(true);\n    };",
              "    const handleLockedCourseFileClick = () => {\n        if (isGuestUser) {\n            navigate('/?auth=login');\n            return;\n        }\n        if (coursePrice <= 0) {\n            enrollCourse(course.id);\n            return;\n        }\n        if (needsPathEnrollmentBeforePurchase) {\n            sendStudentToPathRegistration();\n            return;\n        }\n        setShowPaymentModal(true);\n    };",
          )
          replace_once(
              'components/CourseOverview.tsx',
              "        if (lesson.isLocked) {\n            if (isGuestUser) {\n                navigate('/?auth=login');\n                return;\n            }\n            setShowPaymentModal(true);\n            return;\n        }",
              "        if (lesson.isLocked) {\n            if (isGuestUser) {\n                navigate('/?auth=login');\n                return;\n            }\n            if (coursePrice <= 0) {\n                enrollCourse(course.id);\n                return;\n            }\n            if (needsPathEnrollmentBeforePurchase) {\n                sendStudentToPathRegistration();\n                return;\n            }\n            setShowPaymentModal(true);\n            return;\n        }",
          )

          replace_once(
              'components/CoursePlayer.tsx',
              "    hasScopedPackageAccess('courses', course.pathId || course.category, course.subjectId || course.subject) ||\n    Number(course.price || 0) <= 0;",
              "    hasScopedPackageAccess('courses', course.pathId || course.category, course.subjectId || course.subject);",
          )

          replace_once(
              'store/slices/accessEnrollmentSlice.ts',
              "        const currentUser = get().user;\n        if (!shouldSyncUserToApi(currentUser)) {",
              "        const currentUser = get().user;\n        if (!isRegisteredUser(currentUser)) {\n            return;\n        }\n        if (!shouldSyncUserToApi(currentUser)) {",
          )

          replace_once(
              'scripts/smoke-course-file-access-contract.mjs',
              "check(\n  \"Course view does not open an empty player for guests without preview lessons\",\n  includes(courseView, \"hasPlayablePreviewLesson\") &&\n    matches(courseView, /if \\(isPlaying && \\(isEnrolled \\|\\| isStaffViewer \\|\\| isFreeCourse \\|\\| hasPlayablePreviewLesson\\)\\)/),\n);",
              "check(\n  \"Course view opens playback only for entitlement or explicit preview\",\n  includes(courseView, \"hasPlayablePreviewLesson\") &&\n    matches(courseView, /if \\(isPlaying && \\(isEnrolled \\|\\| isStaffViewer \\|\\| hasPlayablePreviewLesson\\)\\)/) &&\n    !includes(courseView, \"isEnrolled || isStaffViewer || isFreeCourse\"),\n);",
          )

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | wc -l)" -eq 5
          git diff --name-only | grep -qx 'pages/CourseView.tsx'
          git diff --name-only | grep -qx 'components/CourseOverview.tsx'
          git diff --name-only | grep -qx 'components/CoursePlayer.tsx'
          git diff --name-only | grep -qx 'store/slices/accessEnrollmentSlice.ts'
          git diff --name-only | grep -qx 'scripts/smoke-course-file-access-contract.mjs'

      - name: Commit bounded patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'almeaa-course-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add pages/CourseView.tsx components/CourseOverview.tsx components/CoursePlayer.tsx store/slices/accessEnrollmentSlice.ts scripts/smoke-course-file-access-contract.mjs
          git commit -m 'fix(courses): require confirmed free enrollment for restricted content [skip ci]'
          git push origin HEAD:codex/course-free-enrollment-entitlement-ui
