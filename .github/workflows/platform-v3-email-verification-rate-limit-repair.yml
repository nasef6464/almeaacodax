name: Platform V3 Email Verification Rate Limit Repair

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/platform-v3-email-verification-rate-limit-repair.yml

permissions:
  contents: write

concurrency:
  group: platform-v3-email-verification-rate-limit-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.number == 26 && github.event.pull_request.head.ref == 'develop/platform-v3-recovery'
    name: Rate-limit email verification resend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact recovery head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Apply exact verification resend limiter
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const appPath = 'server/src/app.ts';
          let app = fs.readFileSync(appPath, 'utf8');
          const oldBlock = `      "/api/auth/me/redeem-access-code",\n      "/auth/me/redeem-access-code",`;
          const newBlock = `      "/api/auth/me/redeem-access-code",\n      "/auth/me/redeem-access-code",\n      "/api/auth/email/resend-verification",\n      "/auth/email/resend-verification",`;
          if (app.split(oldBlock).length - 1 !== 1) throw new Error('Sensitive auth limiter anchor changed');
          app = app.replace(oldBlock, newBlock);
          fs.writeFileSync(appPath, app);

          const contractPath = 'scripts/smoke-api-security-contract.mjs';
          let contract = fs.readFileSync(contractPath, 'utf8');
          const anchor = 'check("production errors do not leak server details", () => {';
          const check = `check("email verification resend is protected from notification flooding", () => {\n  assertIncludes(appSource, '\"/api/auth/email/resend-verification\"');\n  assertIncludes(appSource, '\"/auth/email/resend-verification\"');\n  const limiterIndex = appSource.indexOf("sensitiveActionRateLimiter");\n  const canonicalIndex = appSource.indexOf('\"/api/auth/email/resend-verification\"');\n  const aliasIndex = appSource.indexOf('\"/auth/email/resend-verification\"');\n  if (limiterIndex < 0 || canonicalIndex < 0 || aliasIndex < 0) {\n    throw new Error("Verification resend limiter coverage is incomplete");\n  }\n});\n\n`;
          if (contract.split(anchor).length - 1 !== 1) throw new Error('API security contract insertion anchor changed');
          contract = contract.replace(anchor, check + anchor);
          fs.writeFileSync(contractPath, contract);
          NODE

      - name: API security contract
        run: npm run smoke:api-security
      - name: Auth login security contract
        run: npm run smoke:auth-login-security
      - name: CSRF contract
        run: npm run smoke:csrf
      - name: Production hardening contract
        run: npm run smoke:production-hardening
      - name: Frontend typecheck
        run: npm run typecheck
      - name: API typecheck
        run: npm --prefix server run check
      - name: Frontend production build
        run: npm run build
      - name: API production build
        run: npm --prefix server run build

      - name: Confirm narrow diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "scripts/smoke-api-security-contract.mjs"
          test "${changed[1]}" = "server/src/app.ts"

      - name: Commit verified resend limiter
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin develop/platform-v3-recovery
          test "$(git rev-parse origin/develop/platform-v3-recovery)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/app.ts scripts/smoke-api-security-contract.mjs
          git commit -m "fix(security): rate-limit verification resend"
          git push origin HEAD:develop/platform-v3-recovery
