name: Refactor V2 Schools Import Decomposition Phase

on:
  push:
    branches:
      - refactor/repository-v2-safe
    paths:
      - '.github/workflows/refactor-v2-schools-import-phase.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/repository-v2-safe
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Apply schools import decomposition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          manager_path = root / 'dashboards/admin/SchoolsManager.tsx'
          manager = manager_path.read_text(encoding='utf-8')

          old_xlsx_import = "import { loadXlsx, readWorkbookFromBuffer, registerXlsxRuntime, sheetToSafeRows } from '../../utils/xlsxLoader';\n"
          if old_xlsx_import not in manager:
              raise SystemExit('Expected SchoolsManager xlsxLoader import was not found; aborting safe patch.')

          manager = manager.replace(
              old_xlsx_import,
              "import { parseImportFile, parseRelationFile } from './SchoolsManager/importFileReaders';\n"
              "import { getDuplicateImportEmails } from './SchoolsManager/importRowParsing';\n",
              1,
          )

          start_marker = 'const normalizeHeader = (value: string) =>\n'
          end_marker = 'export const SchoolsManager: React.FC = () => {'
          start = manager.find(start_marker)
          end = manager.find(end_marker)
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('Could not locate the exact import parser block in SchoolsManager; aborting safe patch.')
          manager = manager[:start] + manager[end:]
          manager_path.write_text(manager, encoding='utf-8')

          row_parsing = r'''import type { ImportRow, RelationImportRow } from './contracts';

/**
 * Pure row parsing for school student/relationship imports.
 *
 * Keep this module browser- and XLSX-independent so the business mapping can be
 * executed directly by the refactor contract tests.
 */
export const normalizeImportHeader = (value: string) =>
    value
        .trim()
        .toLowerCase()
        .replace(/\uFEFF/g, '')
        .replace(/[ًٌٍَُِّْـ]/g, '')
        .replace(/\s+/g, '');

const aliasSet = (aliases: string[]) => new Set(aliases.map(normalizeImportHeader));

const STUDENT_IMPORT_HEADER_ALIASES = {
    name: aliasSet(['name', 'fullName', 'studentName', 'الاسم', 'اسم الطالب', 'اسم', 'الطالب']),
    email: aliasSet(['email', 'mail', 'البريد', 'البريد الإلكتروني', 'الايميل', 'الإيميل', 'بريد الطالب']),
    className: aliasSet(['className', 'class', 'classroom', 'الفصل', 'اسم الفصل', 'الصف', 'المجموعة']),
    password: aliasSet(['password', 'pass', 'كلمة المرور', 'كلمة السر', 'الرقم السري', 'passwordHint']),
};

const RELATION_IMPORT_HEADER_ALIASES = {
    studentEmail: aliasSet(['studentEmail', 'student', 'بريد الطالب', 'ايميل الطالب', 'إيميل الطالب', 'البريد الإلكتروني للطالب']),
    parentEmail: aliasSet(['parentEmail', 'parent', 'ولي الأمر', 'بريد ولي الأمر', 'ايميل ولي الأمر', 'إيميل ولي الأمر']),
    parentName: aliasSet(['parentName', 'اسم ولي الأمر', 'ولي الامر', 'guardianName']),
    supervisorEmail: aliasSet(['supervisorEmail', 'teacherEmail', 'بريد المشرف', 'ايميل المشرف', 'إيميل المشرف', 'بريد المعلم']),
    supervisorName: aliasSet(['supervisorName', 'teacherName', 'اسم المشرف', 'اسم المعلم']),
    className: aliasSet(['className', 'class', 'الفصل', 'اسم الفصل', 'الصف', 'المجموعة']),
};

const normalizeRows = (rows: unknown[][]) =>
    rows
        .map((row) => row.map((cell) => String(cell ?? '').trim()))
        .filter((row) => row.some(Boolean));

const canonicalizeHeader = <TKey extends string>(
    header: string,
    aliases: Record<TKey, Set<string>>,
): TKey | null => {
    const normalized = normalizeImportHeader(header);
    const entry = (Object.entries(aliases) as Array<[TKey, Set<string>]>).find(([, values]) => values.has(normalized));
    return entry?.[0] ?? null;
};

export const parseImportRows = (rows: unknown[][]): ImportRow[] => {
    const normalizedRows = normalizeRows(rows);
    if (normalizedRows.length < 2) return [];

    const headers = normalizedRows[0].map((header) => {
        const canonical = canonicalizeHeader(header, STUDENT_IMPORT_HEADER_ALIASES);
        return normalizeImportHeader(canonical ?? header);
    });

    const nameIndex = headers.findIndex((header) => header === 'name');
    const emailIndex = headers.findIndex((header) => header === 'email');
    const classIndex = headers.findIndex((header) => header === 'classname');
    const passwordIndex = headers.findIndex((header) => header === 'password');

    if (nameIndex === -1 || emailIndex === -1) {
        throw new Error('الملف يحتاج عمودين أساسيين على الأقل: name و email.');
    }

    return normalizedRows
        .slice(1)
        .map((cells) => ({
            name: (cells[nameIndex] || '').trim(),
            email: (cells[emailIndex] || '').trim(),
            className: classIndex >= 0 ? (cells[classIndex] || '').trim() : undefined,
            password: passwordIndex >= 0 ? (cells[passwordIndex] || '').trim() : undefined,
        }))
        .filter((row) => row.name && row.email);
};

export const parseRelationRows = (rows: unknown[][]): RelationImportRow[] => {
    const normalizedRows = normalizeRows(rows);
    if (normalizedRows.length < 2) return [];

    const headers = normalizedRows[0].map((header) => {
        const canonical = canonicalizeHeader(header, RELATION_IMPORT_HEADER_ALIASES);
        return normalizeImportHeader(canonical ?? header);
    });

    const studentEmailIndex = headers.findIndex((header) => header === 'studentemail');
    const parentEmailIndex = headers.findIndex((header) => header === 'parentemail');
    const parentNameIndex = headers.findIndex((header) => header === 'parentname');
    const supervisorEmailIndex = headers.findIndex((header) => header === 'supervisoremail');
    const supervisorNameIndex = headers.findIndex((header) => header === 'supervisorname');
    const classNameIndex = headers.findIndex((header) => header === 'classname');

    if (studentEmailIndex === -1) {
        throw new Error('ملف الربط يحتاج عمود بريد الطالب على الأقل.');
    }

    return normalizedRows
        .slice(1)
        .map((cells) => ({
            studentEmail: (cells[studentEmailIndex] || '').trim(),
            parentEmail: parentEmailIndex >= 0 ? (cells[parentEmailIndex] || '').trim() : undefined,
            parentName: parentNameIndex >= 0 ? (cells[parentNameIndex] || '').trim() : undefined,
            supervisorEmail: supervisorEmailIndex >= 0 ? (cells[supervisorEmailIndex] || '').trim() : undefined,
            supervisorName: supervisorNameIndex >= 0 ? (cells[supervisorNameIndex] || '').trim() : undefined,
            className: classNameIndex >= 0 ? (cells[classNameIndex] || '').trim() : undefined,
        }))
        .filter((row) => row.studentEmail || row.parentEmail || row.supervisorEmail || row.className);
};

export const getDuplicateImportEmails = (rows: ImportRow[]) => {
    const seen = new Set<string>();
    const duplicates = new Set<string>();

    rows.forEach((row) => {
        const email = row.email.trim().toLowerCase();
        if (!email) return;
        if (seen.has(email)) {
            duplicates.add(email);
            return;
        }
        seen.add(email);
    });

    return Array.from(duplicates);
};
'''
          (root / 'dashboards/admin/SchoolsManager/importRowParsing.ts').write_text(row_parsing, encoding='utf-8')

          file_readers = r'''import { loadXlsx, readWorkbookFromBuffer, registerXlsxRuntime, sheetToSafeRows } from '../../../utils/xlsxLoader';
import type { ImportRow, RelationImportRow } from './contracts';
import { parseImportRows, parseRelationRows } from './importRowParsing';

const readImportMatrix = async (file: File): Promise<unknown[][]> => {
    if (/\.(xlsx|xls)$/i.test(file.name)) {
        const XLSX = await loadXlsx();
        registerXlsxRuntime(XLSX);
        const buffer = await file.arrayBuffer();
        const workbook = await readWorkbookFromBuffer(buffer);
        const firstSheetName = workbook.SheetNames[0];
        if (!firstSheetName) return [];

        return sheetToSafeRows(workbook.Sheets[firstSheetName], '');
    }

    const raw = await file.text();
    const content = raw.replace(/\r\n/g, '\n').trim();
    if (!content) return [];

    const lines = content.split('\n').filter(Boolean);
    if (lines.length < 2) return [];

    const delimiter = lines[0].includes('\t') ? '\t' : ',';
    return lines.map((line) => line.split(delimiter));
};

export const parseImportFile = async (file: File): Promise<ImportRow[]> =>
    parseImportRows(await readImportMatrix(file));

export const parseRelationFile = async (file: File): Promise<RelationImportRow[]> =>
    parseRelationRows(await readImportMatrix(file));
'''
          (root / 'dashboards/admin/SchoolsManager/importFileReaders.ts').write_text(file_readers, encoding='utf-8')

          smoke = r'''import assert from 'node:assert/strict';
import fs from 'node:fs';
import path from 'node:path';
import { performance } from 'node:perf_hooks';
import ts from 'typescript';

const root = process.cwd();
const read = (file) => fs.readFileSync(path.join(root, file), 'utf8');
const lineCount = (text) => text.split(/\r?\n/).length;

const managerFile = 'dashboards/admin/SchoolsManager.tsx';
const rowParserFile = 'dashboards/admin/SchoolsManager/importRowParsing.ts';
const fileReaderFile = 'dashboards/admin/SchoolsManager/importFileReaders.ts';
const manager = read(managerFile);
const rowParserSource = read(rowParserFile);
const fileReaderSource = read(fileReaderFile);

assert.ok(manager.includes("from './SchoolsManager/importFileReaders';"), 'SchoolsManager must delegate file parsing.');
assert.ok(manager.includes("from './SchoolsManager/importRowParsing';"), 'SchoolsManager must delegate duplicate-email parsing.');
assert.ok(!manager.includes("from '../../utils/xlsxLoader';"), 'SchoolsManager must not own XLSX transport after extraction.');
assert.ok(!manager.includes('const normalizeHeader ='), 'Header normalization must live outside the manager component.');
assert.ok(!manager.includes('const parseImportRows ='), 'Student row parsing must live outside the manager component.');
assert.ok(!manager.includes('const parseRelationRows ='), 'Relationship row parsing must live outside the manager component.');
assert.ok(lineCount(manager) <= 5100, `SchoolsManager regression: ${lineCount(manager)} lines exceeds the 5100-line phase budget.`);
assert.ok(lineCount(rowParserSource) <= 300, 'Pure school import row parser must stay <= 300 lines.');
assert.ok(lineCount(fileReaderSource) <= 180, 'School import file reader must stay <= 180 lines.');
assert.ok(!rowParserSource.includes('xlsxLoader'), 'Pure row parsing must stay XLSX-independent.');
assert.ok(!rowParserSource.includes('File)'), 'Pure row parsing must stay browser File-independent.');
assert.ok(fileReaderSource.includes("from '../../../utils/xlsxLoader';"), 'File reader must use the audited lazy XLSX loader.');
for (const helper of ['loadXlsx', 'registerXlsxRuntime', 'readWorkbookFromBuffer', 'sheetToSafeRows']) {
  assert.ok(fileReaderSource.includes(helper), `File reader must preserve safe XLSX helper ${helper}.`);
}
assert.ok(!fileReaderSource.includes("from 'xlsx'"), 'File reader must never import the legacy xlsx package.');
assert.ok(!fileReaderSource.includes('import * as XLSX'), 'File reader must never statically bundle XLSX.');

const transpiled = ts.transpileModule(rowParserSource, {
  compilerOptions: {
    module: ts.ModuleKind.ES2022,
    target: ts.ScriptTarget.ES2022,
  },
  reportDiagnostics: true,
});
const fatalDiagnostics = (transpiled.diagnostics ?? []).filter((item) => item.category === ts.DiagnosticCategory.Error);
assert.equal(fatalDiagnostics.length, 0, 'Pure row parser must transpile without diagnostics.');

const moduleUrl = `data:text/javascript;base64,${Buffer.from(transpiled.outputText).toString('base64')}`;
const parser = await import(moduleUrl);

assert.deepEqual(
  parser.parseImportRows([
    ['Name', 'Email', 'Class', 'Password'],
    ['  أحمد محمد  ', ' STUDENT@Example.com ', ' 3/A ', ' temporary-pass '],
    ['', '', '', ''],
  ]),
  [{ name: 'أحمد محمد', email: 'STUDENT@Example.com', className: '3/A', password: 'temporary-pass' }],
  'English student import aliases and trimming must remain stable.',
);

assert.deepEqual(
  parser.parseImportRows([
    ['اِســم الطَّالِب', 'البريد الإلكتروني', 'اسم الفصل', 'كلمة المرور'],
    ['سارة', 'sara@example.com', 'الثالث أ', '12345678'],
  ]),
  [{ name: 'سارة', email: 'sara@example.com', className: 'الثالث أ', password: '12345678' }],
  'Arabic header normalization, diacritics and tatweel handling must remain stable.',
);

assert.deepEqual(
  parser.parseRelationRows([
    ['بريد الطالب', 'بريد ولي الأمر', 'اسم ولي الأمر', 'بريد المشرف', 'اسم المشرف', 'اسم الفصل'],
    ['student@example.com', 'parent@example.com', 'ولي الطالب', 'teacher@example.com', 'المشرف', 'الفصل 1'],
  ]),
  [{
    studentEmail: 'student@example.com',
    parentEmail: 'parent@example.com',
    parentName: 'ولي الطالب',
    supervisorEmail: 'teacher@example.com',
    supervisorName: 'المشرف',
    className: 'الفصل 1',
  }],
  'Relationship import aliases must remain stable.',
);

assert.throws(
  () => parser.parseImportRows([['Name'], ['Student']]),
  /name و email/,
  'Student import must continue rejecting files without both required columns.',
);
assert.throws(
  () => parser.parseRelationRows([['parentEmail'], ['parent@example.com']]),
  /بريد الطالب/,
  'Relationship import must continue requiring student email.',
);
assert.deepEqual(
  parser.getDuplicateImportEmails([
    { name: 'A', email: 'Student@Example.com' },
    { name: 'B', email: ' student@example.com ' },
    { name: 'C', email: 'other@example.com' },
    { name: 'D', email: 'OTHER@example.com' },
  ]),
  ['student@example.com', 'other@example.com'],
  'Duplicate detection must remain trimmed and case-insensitive.',
);

const largeRows = [['name', 'email', 'className', 'password']];
for (let index = 0; index < 10000; index += 1) {
  largeRows.push([`Student ${index}`, `student${index}@example.com`, `Class ${index % 30}`, 'pass']);
}
const startedAt = performance.now();
const parsedLargeRows = parser.parseImportRows(largeRows);
const elapsedMs = performance.now() - startedAt;
assert.equal(parsedLargeRows.length, 10000, 'Large import parsing must preserve all valid rows.');
assert.ok(elapsedMs < 2000, `10k-row parser regression: ${elapsedMs.toFixed(1)}ms exceeds the 2000ms safety ceiling.`);

console.log(JSON.stringify({
  phase: 'schools-import-parsing',
  status: 'PASS',
  managerLines: lineCount(manager),
  rowParserLines: lineCount(rowParserSource),
  fileReaderLines: lineCount(fileReaderSource),
  parsedRows: parsedLargeRows.length,
  parse10kMs: Number(elapsedMs.toFixed(2)),
}, null, 2));
'''
          (root / 'scripts/smoke-schools-import-parsing-contract.mjs').write_text(smoke, encoding='utf-8')

          phase_review = r'''import { spawnSync } from 'node:child_process';

const checks = [
  ['git diff whitespace validation', 'git', ['diff', '--check']],
  ['frontend typecheck', 'npm', ['run', 'typecheck']],
  ['API typecheck', 'npm', ['run', 'server:check']],
  ['frontend production build', 'npm', ['run', 'build']],
  ['API production build', 'npm', ['run', 'server:build']],
  ['school import parser logic/performance', 'npm', ['run', 'smoke:schools-import-parsing']],
  ['school management contract', 'npm', ['run', 'smoke:school-management']],
  ['school XLSX safety contract', 'npm', ['run', 'smoke:xlsx-safety']],
  ['school package revenue contract', 'npm', ['run', 'smoke:package-revenue']],
  ['school admin/parent/payment contract', 'npm', ['run', 'smoke:batch136-admin-users-schools-parent-payment']],
  ['school relationship audit contract', 'npm', ['run', 'smoke:batch100f-relationship-audit']],
  ['frontend performance contract', 'npm', ['run', 'smoke:performance']],
  ['repository architecture snapshot', 'node', ['tools/refactor/repository-audit.mjs']],
  ['immutable architecture gate', 'node', ['tools/refactor/architecture-gate.mjs']],
  ['progressive module boundary gate', 'node', ['tools/refactor/module-boundary-gate.mjs']],
  ['route loading contract', 'npm', ['run', 'smoke:route-loading']],
  ['runtime source contract', 'npm', ['run', 'smoke:runtime-source']],
  ['quiz integrity contract', 'npm', ['run', 'smoke:quiz-integrity-guard']],
  ['authentication security contract', 'npm', ['run', 'smoke:auth-login-security']],
  ['API security contract', 'npm', ['run', 'smoke:api-security']],
];

const results = [];
for (const [name, command, args] of checks) {
  const startedAt = Date.now();
  console.log(`\n[phase-review] START ${name}`);
  const result = spawnSync(command, args, { stdio: 'inherit', shell: process.platform === 'win32' });
  const durationMs = Date.now() - startedAt;
  results.push({ name, status: result.status === 0 ? 'PASS' : 'FAIL', durationMs });
  if (result.status !== 0) {
    console.error(`\n[phase-review] FAIL ${name}`);
    console.error(JSON.stringify(results, null, 2));
    process.exit(result.status ?? 1);
  }
}

console.log('\n[phase-review] ALL CHECKS PASS');
console.log(JSON.stringify(results, null, 2));
'''
          (root / 'tools/refactor/phase-review-schools-import.mjs').write_text(phase_review, encoding='utf-8')

          package_path = root / 'package.json'
          package_text = package_path.read_text(encoding='utf-8')
          package_needle = '        "smoke:school-management": "node scripts/smoke-school-management-contract.mjs",\n'
          if package_needle not in package_text:
              raise SystemExit('Could not locate smoke:school-management script insertion point.')
          package_text = package_text.replace(
              package_needle,
              package_needle + '        "smoke:schools-import-parsing": "node scripts/smoke-schools-import-parsing-contract.mjs",\n',
              1,
          )
          package_path.write_text(package_text, encoding='utf-8')

          xlsx_contract_path = root / 'scripts/smoke-xlsx-safety-contract.mjs'
          xlsx_contract = xlsx_contract_path.read_text(encoding='utf-8')
          old_block = '''const adminImportFiles = [\n  "dashboards/admin/LessonsManager.tsx",\n  "dashboards/admin/QuestionBankManager.tsx",\n  "dashboards/admin/SchoolsManager.tsx",\n];\n\nfor (const file of adminImportFiles) {\n  addCheck(\n    `${file} uses safe workbook reader`,\n    includes(file, "readWorkbookFromBuffer") &&\n      includes(file, "registerXlsxRuntime") &&\n      (includes(file, "sheetToSafeObjects") || includes(file, "sheetToSafeRows")),\n    "Excel imports must go through xlsxLoader safety helpers",\n  );\n  addCheck(\n    `${file} has no static xlsx import`,\n    notIncludes(file, "import * as XLSX from 'xlsx'") &&\n      notIncludes(file, 'import * as XLSX from "xlsx"') &&\n      notIncludes(file, "from 'xlsx'") &&\n      notIncludes(file, 'from "xlsx"'),\n    "static xlsx imports would bypass lazy loading and safety review",\n  );\n}\n'''
          new_block = '''const adminImportFlows = [\n  { surface: "dashboards/admin/LessonsManager.tsx", reader: "dashboards/admin/LessonsManager.tsx" },\n  { surface: "dashboards/admin/QuestionBankManager.tsx", reader: "dashboards/admin/QuestionBankManager.tsx" },\n  { surface: "dashboards/admin/SchoolsManager.tsx", reader: "dashboards/admin/SchoolsManager/importFileReaders.ts" },\n];\n\nfor (const { surface, reader } of adminImportFlows) {\n  addCheck(\n    `${surface} uses safe workbook reader`,\n    includes(reader, "readWorkbookFromBuffer") &&\n      includes(reader, "registerXlsxRuntime") &&\n      (includes(reader, "sheetToSafeObjects") || includes(reader, "sheetToSafeRows")),\n    "Excel imports must go through xlsxLoader safety helpers, directly or through a feature-owned reader",\n  );\n  addCheck(\n    `${surface} has no static xlsx import`,\n    notIncludes(surface, "import * as XLSX from 'xlsx'") &&\n      notIncludes(surface, 'import * as XLSX from "xlsx"') &&\n      notIncludes(surface, "from 'xlsx'") &&\n      notIncludes(surface, 'from "xlsx"') &&\n      notIncludes(reader, "import * as XLSX from 'xlsx'") &&\n      notIncludes(reader, 'import * as XLSX from "xlsx"') &&\n      notIncludes(reader, "from 'xlsx'") &&\n      notIncludes(reader, 'from "xlsx"'),\n    "static xlsx imports would bypass lazy loading and safety review",\n  );\n}\n'''
          if old_block not in xlsx_contract:
              raise SystemExit('Expected XLSX safety admin import block not found.')
          xlsx_contract_path.write_text(xlsx_contract.replace(old_block, new_block, 1), encoding='utf-8')

          performance_path = root / 'scripts/smoke-performance-contract.mjs'
          performance = performance_path.read_text(encoding='utf-8')
          old_perf = '''for (const file of [\n  'dashboards/admin/UsersManager.tsx',\n  'dashboards/admin/SchoolsManager.tsx',\n  'dashboards/admin/SchoolPortalManager.tsx',\n  'dashboards/admin/QuizzesManager.tsx',\n  'dashboards/admin/QuestionBankManager.tsx',\n  'dashboards/admin/LibraryManager.tsx',\n  'dashboards/admin/LessonsManager.tsx',\n  'dashboards/admin/GroupsManager.tsx',\n]) {\n  assertIncludes(file, "from '../../utils/xlsxLoader';");\n  assertIncludes(file, 'loadXlsx');\n  assertNotIncludes(file, "import * as XLSX from 'xlsx';");\n}\n'''
          new_perf = '''for (const file of [\n  'dashboards/admin/UsersManager.tsx',\n  'dashboards/admin/SchoolPortalManager.tsx',\n  'dashboards/admin/QuizzesManager.tsx',\n  'dashboards/admin/QuestionBankManager.tsx',\n  'dashboards/admin/LibraryManager.tsx',\n  'dashboards/admin/LessonsManager.tsx',\n  'dashboards/admin/GroupsManager.tsx',\n]) {\n  assertIncludes(file, "from '../../utils/xlsxLoader';");\n  assertIncludes(file, 'loadXlsx');\n  assertNotIncludes(file, "import * as XLSX from 'xlsx';");\n}\nassertIncludes('dashboards/admin/SchoolsManager.tsx', "from './SchoolsManager/importFileReaders';");\nassertIncludes('dashboards/admin/SchoolsManager/importFileReaders.ts', "from '../../../utils/xlsxLoader';");\nassertIncludes('dashboards/admin/SchoolsManager/importFileReaders.ts', 'loadXlsx');\nassertNotIncludes('dashboards/admin/SchoolsManager/importFileReaders.ts', "import * as XLSX from 'xlsx';");\n'''
          if old_perf not in performance:
              raise SystemExit('Expected performance XLSX contract block not found.')
          performance_path.write_text(performance.replace(old_perf, new_perf, 1), encoding='utf-8')

          guard_path = root / '.github/workflows/refactor-v2-guard.yml'
          guard = guard_path.read_text(encoding='utf-8')
          guard_needle = '''      - name: School XLSX safety contract\n        run: node scripts/smoke-xlsx-safety-contract.mjs\n\n'''
          guard_insert = guard_needle + '''      - name: School import parsing logic and performance contract\n        run: npm run smoke:schools-import-parsing\n\n      - name: Frontend performance contract\n        run: npm run smoke:performance\n\n'''
          if guard_needle not in guard:
              raise SystemExit('Could not locate Safety Gate insertion point.')
          guard_path.write_text(guard.replace(guard_needle, guard_insert, 1), encoding='utf-8')

          ledger = '''# سجل تنفيذ Refactor V2 — ALMEAA\n\n> هذا الملف هو المرجع التشغيلي المستمر أثناء إعادة الهيكلة.\n> الفرع الوحيد لهذه المرحلة: `refactor/repository-v2-safe`.\n\n## الهدف الثابت\n\nتحويل المنصة تدريجيًا إلى **Modular Monolith** واضح الحدود، أسهل في الصيانة والتوسع والعمل بواسطة المطورين والـAgents، مع الحفاظ الكامل على منطق المنتج والعقود التشغيلية الحالية أثناء النقل البنيوي.\n\n### قيود لا يتم كسرها\n\n- لا تغيير في frontend URLs أو API methods/paths أو router mounts بسبب refactor بنيوي.\n- لا تغيير في auth/RBAC أو quiz scoring/integrity أو payment/access semantics.\n- لا destructive Mongo migration ولا تغيير أسماء environment variables أو جذور Vercel/Render/Docker.\n- لا Big Bang rewrite لملف ضخم. كل concern يُستخرج على دفعة صغيرة ثم يُفحص.\n- لا circular dependencies ولا unresolved runtime imports.\n- لا تخفيف Architecture Budget فقط لتمرير CI.\n- أي تحسن في الحدود أو الاختبارات يتحول إلى gate دائم كلما كان ذلك عمليًا.\n\n## ما تم إنجازه قبل هذه الدفعة\n\n- Baseline معماري ثابت + repository audit + architecture gate + module boundary gate.\n- الوصول إلى `0` runtime dependency cycles و`0` unresolved runtime relative imports.\n- فك دورة notifications بدون تغيير API العام.\n- فصل عقود وواجهات فرعية من `SchoolsManager` وإزالة child-to-parent imports.\n- فصل `dataAdapters.ts` من `SchoolsManager`.\n- فصل بنية التصدير والطباعة إلى `SchoolsManager/exportHelpers.ts` مع الحفاظ على escape/safety contract.\n- إزالة كود CSV قديم غير قابل للتنفيذ.\n- آخر Safety Gate قبل هذه الدفعة كان أخضر بالكامل.\n\n## الدفعة الحالية — Schools Import Decomposition\n\nالحالة عند إنشاء هذا السجل: **يتم قبولها فقط إذا نجح Phase Review ثم Refactor V2 Safety Gate.**\n\nتم نقل مسؤوليات الاستيراد التالية خارج `SchoolsManager.tsx`:\n\n1. تطبيع headers العربية/الإنجليزية وتحويل rows إلى عقود الطلاب والعلاقات -> `importRowParsing.ts`.\n2. قراءة CSV/TSV/XLSX واستخدام safe lazy XLSX runtime -> `importFileReaders.ts`.\n3. اختبار تنفيذي مباشر لمنطق parsing والـaliases والأخطاء والduplicates و10,000 row performance ceiling -> `smoke-schools-import-parsing-contract.mjs`.\n4. Phase review script يشغّل typecheck/build للواجهة والـAPI، عقود المدارس، XLSX، performance، architecture، routes، runtime source، quiz/auth/API security -> `tools/refactor/phase-review-schools-import.mjs`.\n5. تم تحديث XLSX/performance contracts بحيث تسمح بالتفويض إلى reader داخل feature بدل إجبار God Component على امتلاك parser مباشرة.\n6. تم إضافة parser/performance checks إلى Refactor V2 Safety Gate كحماية دائمة.\n\n### معايير قبول الدفعة\n\n- `SchoolsManager.tsx <= 5100` سطر بعد الاستخراج.\n- ملفات parsing الجديدة أقل من حدود الملفات الجديدة المسموح بها.\n- Arabic/English header behavior محفوظ.\n- required-column errors محفوظة.\n- duplicate email semantics محفوظة (trim + case-insensitive).\n- 10k-row pure parsing ينجح داخل safety ceiling الفضفاض لمنع انحدار O(n²).\n- XLSX يبقى lazy ويستخدم `readWorkbookFromBuffer` + `registerXlsxRuntime` + safe row conversion.\n- typecheck/build frontend + API PASS.\n- architecture/module boundaries/school contracts/security PASS.\n\n## ترتيب العمل التالي بعد إغلاق هذه الدفعة\n\n1. مواصلة تفكيك `SchoolsManager.tsx` بالبدء في pure/readiness/report view-model helpers ثم UI sections كبيرة، بدون تغيير السلوك.\n2. تخفيض `SchoolPackagesPanel.tsx` و`SchoolRelationsPanel.tsx` إلى وحدات presentation/application أصغر مع حدود dependency واضحة.\n3. بعد وصول hotspot المدارس إلى نقطة مستقرة، الانتقال إلى `pages/Reports.tsx`.\n4. ثم `server/src/routes/content.routes.ts` و`server/src/routes/quiz.routes.ts` بتحويل routes تدريجيًا إلى thin HTTP + application services.\n5. بعد تثبيت facades والحدود، يبدأ النقل المنظم إلى `src/features/*` و`server/src/modules/*` مع compatibility exports.\n\n## بروتوكول الإغلاق لأي مرحلة لاحقة\n\nقبل اعتبار أي مرحلة مكتملة:\n\n1. فحص diff وعدم وجود whitespace/merge artifacts.\n2. frontend + API typecheck.\n3. frontend + API production build.\n4. اختبارات منطقية خاصة بالجزء الذي تم نقله، وليس source-text فقط متى أمكن.\n5. performance contract ذي صلة.\n6. domain smoke contracts.\n7. repository audit + architecture gate + module boundary gate.\n8. route/runtime/quiz/auth/API security gates.\n9. إصلاح أي failure قبل commit، ثم إعادة نفس المراجعة.\n10. Safety Gate أخضر على commit النهائي للمرحلة.\n\n## قاعدة الاستمرار\n\nأي Agent يكمل العمل يبدأ من: `AGENTS.md` -> `PROJECT_MAP.md` -> هذا السجل -> آخر Safety Gate، ثم يغيّر concern واحدًا فقط ويحدّث هذا السجل عند إغلاق دفعة كبيرة.\n'''
