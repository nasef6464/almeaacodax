name: TAH-MATH V2 three visual crops for scientific review
on:
  pull_request:
    paths:
      - 'scripts/tah-math-v2-review-three-crops.mjs'
      - '.github/workflows/tah-math-v2-visual-three.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-three:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Retrieve three crop bytes for source visual QA
        run: node scripts/tah-math-v2-review-three-crops.mjs
