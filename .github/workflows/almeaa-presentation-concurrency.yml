name: ALMEAA Presentation Concurrent Defaults

on:
  push:
    branches: [test/almeaa-isolated-20261008]
    paths:
      - server/src/modules/content/http/contentPresentationRoutes.ts
      - scripts/smoke-homepage-settings-concurrent.mjs
      - .github/workflows/almeaa-presentation-concurrency.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atomic-defaults:
    name: Verify first-visitor race without production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      PORT: "4010"
      CLIENT_URL: http://127.0.0.1:4173
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
      MONGODB_URI: mongodb://127.0.0.1:27017/almeaa_presentation_ci_${{ github.run_id }}
      REDIS_URL: ""
      RATE_LIMIT_REDIS_ENABLED: "false"
      NOTIFICATION_QUEUE_ENABLED: "false"
      GOOGLE_OAUTH_ENABLED: "false"
      DEV_LOCAL_ADMIN_BYPASS: "false"
      ADMIN_PASSWORD_SYNC_ON_BOOT: "false"
      AI_PROVIDER: none
      R2_UPLOAD_ENABLED: "false"
      ADMIN_EMAIL: almeaa-isolated-qa@example.invalid
      ADMIN_NAME: Isolated QA Admin
      ISOLATED_API_BASE: http://127.0.0.1:4010/api
    steps:
      - name: Checkout branch without persisted GitHub credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require isolated test host and Mongo URI
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const mongo = new URL(process.env.MONGODB_URI);
          const api = new URL(process.env.ISOLATED_API_BASE);
          assert.equal(process.env.NODE_ENV, 'test');
          assert.equal(mongo.hostname, '127.0.0.1');
          assert.match(mongo.pathname,/^\/almeaa_presentation_ci_[0-9]+$/);
          assert.equal(api.hostname, '127.0.0.1');
          console.log('PASS isolated-only boundary');
          NODE

      - name: Generate run-only JWT/admin secrets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const {randomBytes} = require('node:crypto');
          const jwt = randomBytes(48).toString('base64url');
          const admin = randomBytes(36).toString('base64url');
          console.log('::add-mask::'+jwt);
          console.log('::add-mask::'+admin);
          fs.appendFileSync(process.env.GITHUB_ENV, 'JWT_SECRET='+jwt+'\nADMIN_PASSWORD='+admin+'\n');
          NODE

      - name: Install, typecheck and build test backend
        run: |
          npm --prefix server ci
          npm --prefix server run check
          npm --prefix server run build

      - name: Start API and verify ready
        shell: bash
        run: |
          set -euo pipefail
          node server/dist/server.js > /tmp/almeaa-presentation-api.log 2>&1 &
          echo $! > /tmp/almeaa-presentation.pid
          for i in $(seq 1 55); do
            if curl -fsS http://127.0.0.1:4010/api/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -n 100 /tmp/almeaa-presentation-api.log
          exit 1

      - name: Check 64 simultaneous first-visitor requests
        timeout-minutes: 3
        run: node scripts/smoke-homepage-settings-concurrent.mjs

      - name: Print synthetic API failures
        if: failure()
        run: tail -n 150 /tmp/almeaa-presentation-api.log || true

      - name: Stop ephemeral backend
        if: always()
        run: |
          if [ -f /tmp/almeaa-presentation.pid ]; then kill "$(cat /tmp/almeaa-presentation.pid)" 2>/dev/null || true; fi
