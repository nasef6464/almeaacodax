name: Refactor V2 Notification SSE Surgical Fix

on:
  push:
    branches:
      - refactor/repository-v2-safe
    paths:
      - '.github/workflows/refactor-v2-notification-sse-surgical-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/repository-v2-safe
          fetch-depth: 0

      - name: Extract SSE route composition exactly
        shell: python
        run: |
          from pathlib import Path

          file = Path('server/src/routes/notification.routes.ts')
          source = file.read_text(encoding='utf-8')

          import_anchor = 'import { sendExternalNotification } from "../services/notificationProviders.js";'
          adapter_import = 'import { openNotificationSseStream } from "../modules/notifications/http/openNotificationSseStream.js";'
          if adapter_import not in source:
              if source.count(import_anchor) != 1:
                  raise SystemExit('notification provider import anchor changed')
              source = source.replace(import_anchor, import_anchor + '\n' + adapter_import, 1)

          old_start = 'notificationRouter.get("/stream", requireAuth, async (req, res) => {'
          next_route = 'notificationRouter.patch("/:id/read", requireAuth, async (req, res, next) => {'
          replacement = 'notificationRouter.get("/stream", requireAuth, openNotificationSseStream);\n\n'

          if replacement not in source:
              start = source.find(old_start)
              end = source.find(next_route)
              if start < 0 or end < 0 or end <= start:
                  raise SystemExit('SSE route boundaries changed')
              source = source[:start] + replacement + source[end:]

          file.write_text(source, encoding='utf-8')

      - name: Commit surgical SSE extraction
        shell: bash
        run: |
          if git diff --quiet -- server/src/routes/notification.routes.ts; then
            echo "Notification SSE route is already extracted."
            exit 0
          fi
          git config user.name "almeaa-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/src/routes/notification.routes.ts
          git commit -m "refactor(notifications): route SSE through isolated adapter"
          git push origin HEAD:refactor/repository-v2-safe
