name: ALMEAA Remote MCP Live Certification

on:
  push:
    branches:
      - main
    paths:
      - 'server/src/modules/command-center/**'
      - 'server/src/app.ts'
      - 'scripts/smoke-command-center-mcp-boundary.mjs'
      - 'scripts/smoke-command-center-mcp-live.mjs'
      - '.github/workflows/command-center-mcp-live-certification.yml'
  workflow_dispatch:
    inputs:
      run_full_live_scan:
        description: "Require enabled MCP metadata/discovery/tool scan (manual closure proof)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live-mcp-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for exact Render release identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          expected_short="$(printf '%s' "$EXPECTED_SHA" | cut -c1-12)"
          for attempt in $(seq 1 40); do
            body="$(curl -fsS https://almeaacodax.vercel.app/api/health/live || true)"
            if printf '%s' "$body" | grep -q "$expected_short"; then
              echo "Exact production release is live."
              exit 0
            fi
            echo "Waiting for production release identity ($attempt/40)..."
            sleep 15
          done
          echo "Production did not converge to exact main head." >&2
          exit 1

      - name: Remote MCP fail-closed boundary — lightweight
        run: node scripts/smoke-command-center-mcp-boundary.mjs

      - name: Remote MCP metadata + discovery + tool scan — manual closure proof only
        if: github.event_name == 'workflow_dispatch' && inputs.run_full_live_scan == true
        run: node scripts/smoke-command-center-mcp-live.mjs

      - name: Upload Remote MCP boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-center-mcp-boundary-${{ github.sha }}
          path: audit-artifacts/command-center-mcp-boundary/summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload full Remote MCP evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_full_live_scan == true
        uses: actions/upload-artifact@v4
        with:
          name: command-center-mcp-live-${{ github.sha }}
          path: audit-artifacts/command-center-mcp-live/summary.json
          if-no-files-found: error
          retention-days: 30
