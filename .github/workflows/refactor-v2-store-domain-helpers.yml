name: Refactor V2 Store Domain Helpers

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/repository-v2-safe
    paths:
      - 'store/useStore.ts'
      - 'store/storeDomainHelpers.ts'
      - 'scripts/smoke-store-domain-helpers-boundary-contract.mjs'
      - 'tools/refactor/apply-store-domain-helpers.mjs'
      - 'tools/refactor/phase-review-store-domain-helpers.mjs'
      - '.github/workflows/refactor-v2-store-domain-helpers.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'store/useStore.ts'
      - 'store/storeDomainHelpers.ts'
      - 'scripts/smoke-store-domain-helpers-boundary-contract.mjs'
      - 'tools/refactor/apply-store-domain-helpers.mjs'
      - 'tools/refactor/phase-review-store-domain-helpers.mjs'
      - '.github/workflows/refactor-v2-store-domain-helpers.yml'

permissions:
  contents: write

concurrency:
  group: refactor-v2-store-domain-helpers-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify store domain helper boundary before any apply
        run: node scripts/smoke-store-domain-helpers-boundary-contract.mjs

      - name: Frontend typecheck on source head
        run: npm run typecheck

      - name: Apply current refactor phase — store domain helpers
        if: github.actor != 'github-actions[bot]'
        run: node tools/refactor/apply-store-domain-helpers.mjs

      - name: Run current refactor phase review
        if: github.actor != 'github-actions[bot]'
        run: node tools/refactor/phase-review-store-domain-helpers.mjs

      - name: Commit verified current refactor phase
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          ALLOWED="store/useStore.ts store/storeDomainHelpers.ts"

          STAGED="$(git diff --cached --name-only | sort)"
          for file in $STAGED; do
            case " $ALLOWED " in
              *" $file "*) ;;
              *) echo "Unexpected staged file: $file" >&2; exit 1 ;;
            esac
          done

          git config user.name "almeaa-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add $ALLOWED

          if git diff --cached --quiet; then
            echo "No verified store-domain-helper refactor changes to commit."
            exit 0
          fi

          git fetch origin refactor/repository-v2-safe
          REMOTE_SHA="$(git rev-parse origin/refactor/repository-v2-safe)"
          if [ "$REMOTE_SHA" != "$EXPECTED_SHA" ]; then
            echo "Refactor branch moved from verified head ${EXPECTED_SHA} to ${REMOTE_SHA}; skipping stale auto-commit safely."
            exit 0
          fi

          git commit -m "refactor(store): extract pure domain helpers"
          if git push origin HEAD:refactor/repository-v2-safe; then
            echo "Verified store-domain-helper refactor changes pushed successfully."
            exit 0
          fi

          git fetch origin refactor/repository-v2-safe
          NEW_REMOTE_SHA="$(git rev-parse origin/refactor/repository-v2-safe)"
          if [ "$NEW_REMOTE_SHA" != "$EXPECTED_SHA" ]; then
            echo "Refactor branch advanced to ${NEW_REMOTE_SHA} during push; newer verification run owns the save."
            exit 0
          fi

          echo "Push failed while remote remained at verified head ${EXPECTED_SHA}." >&2
          exit 1
