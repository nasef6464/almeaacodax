name: COL2627 R2 V2 Audit

on:
  push:
    branches:
      - chatgpt/r2-v2-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical R2 V2 objects
        run: node scripts/audit-col2627-r2-v2.mjs
      - name: Upload R2 audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: col2627-r2-v2-audit
          path: audit-artifacts/r2-v2/
          if-no-files-found: error
          retention-days: 14
