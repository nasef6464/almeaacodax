name: Platform V3 Supervisor Contract Repair Once

on:
  push:
    branches:
      - develop/platform-v3-recovery
    paths:
      - .github/workflows/platform-v3-supervisor-contract-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/platform-v3-recovery
          fetch-depth: 0

      - name: Align supervisor overview contract
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/live-supervisor-school-command-audit.mjs')
          text = path.read_text(encoding='utf-8')
          old = '["نظرة عامة", "إجمالي الطلاب", "المحتوى بانتظار الاعتماد"]'
          new = '["نظرة عامة", "إجمالي الطلاب", "بانتظار الاعتماد"]'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one supervisor overview contract match, got {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Verify script syntax
        run: node --check scripts/live-supervisor-school-command-audit.mjs

      - name: Commit exact repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/platform-v3-supervisor-contract-repair-once.yml
          git add -- scripts/live-supervisor-school-command-audit.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "test(platform-v3): align supervisor overview contract"
          git push origin HEAD:develop/platform-v3-recovery
