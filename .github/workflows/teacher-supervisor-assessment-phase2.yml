name: Teacher Supervisor Assessment Phase 2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'dashboards/admin/UnifiedQuizBuilder.tsx'
      - 'scripts/smoke-unified-quiz-builder-role-policy-contract.mjs'
      - 'package.json'
      - '.github/workflows/teacher-supervisor-assessment-phase2.yml'

permissions:
  contents: read

concurrency:
  group: teacher-supervisor-assessment-phase2-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  phase2-builder-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Unified builder role policy contract
        run: npm run smoke:unified-quiz-builder-role-policy

      - name: Frontend typecheck
        run: npm run typecheck
