name: Refactor V2 Fix Schools Export Helper Contract

on:
  push:
    branches:
      - refactor/repository-v2-safe
    paths:
      - '.github/workflows/refactor-v2-fix-schools-export-helper-contract.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/repository-v2-safe
          fetch-depth: 0

      - name: Preserve parent escapeHtml dependency through helper module
        shell: python
        run: |
          from pathlib import Path

          helper = Path('dashboards/admin/SchoolsManager/exportHelpers.ts')
          helper_source = helper.read_text(encoding='utf-8')
          old_helper = 'const escapeHtml = (value: string | number | null | undefined) =>'
          new_helper = 'export const escapeHtml = (value: string | number | null | undefined) =>'
          if new_helper not in helper_source:
              if helper_source.count(old_helper) != 1:
                  raise SystemExit('escapeHtml helper declaration changed')
              helper_source = helper_source.replace(old_helper, new_helper, 1)
              helper.write_text(helper_source, encoding='utf-8')

          parent = Path('dashboards/admin/SchoolsManager.tsx')
          source = parent.read_text(encoding='utf-8')
          old_import = '''import {
              createCsvDownload,
              createWorkbookDownload,
              createXlsxDownload,
              openPrintWindow,
              renderPrintTable,
          } from './SchoolsManager/exportHelpers';'''
          new_import = '''import {
              createCsvDownload,
              createWorkbookDownload,
              createXlsxDownload,
              escapeHtml,
              openPrintWindow,
              renderPrintTable,
          } from './SchoolsManager/exportHelpers';'''
          if new_import not in source:
              if source.count(old_import) != 1:
                  raise SystemExit('SchoolsManager export helper import changed')
              source = source.replace(old_import, new_import, 1)
              parent.write_text(source, encoding='utf-8')

      - name: Commit compatibility fix
        shell: bash
        run: |
          if git diff --quiet -- dashboards/admin/SchoolsManager.tsx dashboards/admin/SchoolsManager/exportHelpers.ts; then
            echo "Export helper compatibility is already fixed."
            exit 0
          fi
          git config user.name "almeaa-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboards/admin/SchoolsManager.tsx dashboards/admin/SchoolsManager/exportHelpers.ts
          git commit -m "fix(schools): preserve escape helper after export extraction"
          git push origin HEAD:refactor/repository-v2-safe
