name: Gemini AI Repository Assistant

on:
  workflow_dispatch:
    inputs:
      task_instruction:
        description: 'المهمة أو الأمر المطلوب تنفيذه بموديل Argon (مثل: افحص صفحة كذا وعدل كذا)'
        required: false
        type: string
        default: ''
  pull_request:
    branches:
      - main
    paths:
      - 'components/**'
      - 'pages/**'
      - 'src/**'
      - 'server/**'
      - 'scripts/**'
  push:
    branches:
      - main
    paths:
      - 'components/**'
      - 'pages/**'
      - 'src/**'
      - 'server/**'
      - 'scripts/**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gemini-ai-assistant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gemini-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix server ci

      - name: Run Task Instruction or Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TASK_INSTRUCTION: ${{ inputs.task_instruction }}
        run: |
          if [ -n "$TASK_INSTRUCTION" ]; then
            echo "Executing Argon Task: $TASK_INSTRUCTION"
            node scripts/argon-executor.mjs "$TASK_INSTRUCTION"
          else
            echo "Running Default Gemini Repository Audit"
            node scripts/gemini-repo-audit.mjs
          fi

      - name: Create Pull Request with Changes
        if: inputs.task_instruction != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK_INSTRUCTION: ${{ inputs.task_instruction }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected! Preparing automated branch and PR..."
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            BRANCH_NAME="argon-task-${{ github.run_id }}"
            git checkout -b "$BRANCH_NAME"
            
            COMMIT_MSG="feat(ai): apply task - ${TASK_INSTRUCTION:0:50}"
            if [ -f ".argon_last_run.json" ]; then
              EXTRACTED_MSG=$(node -e "try { const d = JSON.parse(require('fs').readFileSync('.argon_last_run.json','utf8')); if (d.commitMessage) console.log(d.commitMessage); } catch {}")
              if [ -n "$EXTRACTED_MSG" ]; then
                COMMIT_MSG="$EXTRACTED_MSG"
              fi
              rm -f .argon_last_run.json
            fi
            
            git add .
            git commit -m "$COMMIT_MSG"
            git push origin "$BRANCH_NAME"
            
            PR_BODY="## 🤖 Automated Argon Task Execution

**Task Instruction:**
> $TASK_INSTRUCTION

* Changes generated automatically via Google Gemini / Argon in GitHub Actions.
* Workflow Run: [View Execution Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

            gh pr create --title "$COMMIT_MSG" --body "$PR_BODY" --base main --head "$BRANCH_NAME"
            echo "Pull Request successfully created!"
          else
            echo "No file modifications were made by the task."
          fi
