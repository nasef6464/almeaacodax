name: Gemini AI Repository Assistant

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'components/**'
      - 'pages/**'
      - 'src/**'
      - 'server/**'
      - 'scripts/**'
  push:
    branches:
      - main
    paths:
      - 'components/**'
      - 'pages/**'
      - 'src/**'
      - 'server/**'
      - 'scripts/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gemini-ai-assistant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gemini-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix server ci

      - name: Run Gemini Repository & Architecture Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/gemini-repo-audit.mjs
