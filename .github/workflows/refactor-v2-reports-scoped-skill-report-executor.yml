name: Refactor V2 Reports Scoped Skill Report Executor

on:
  push:
    branches:
      - refactor/repository-v2-safe
    paths:
      - '.github/workflows/refactor-v2-reports-scoped-skill-report-executor.yml'

permissions:
  contents: write

jobs:
  execute-scoped-skill-report-extraction:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/repository-v2-safe
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Apply scoped skill report extraction
        run: node tools/refactor/apply-reports-scoped-skill-report.mjs

      - name: Run Reports scoped skill report phase review
        run: node tools/refactor/phase-review-reports-scoped-skill-report.mjs

      - name: Commit verified extraction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "almeaa-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            pages/Reports.tsx \
            scripts/smoke-reports-role-contract.mjs \
            scripts/smoke-global-student-journey-contract.mjs

          if git diff --cached --quiet; then
            echo "No extraction changes to commit."
            exit 0
          fi

          git commit -m "refactor(reports): extract scoped skill report view model"
          git push origin HEAD:refactor/repository-v2-safe
