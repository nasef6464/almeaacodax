name: Refactor V2 Freeze Baseline

on:
  push:
    branches:
      - refactor/repository-v2-safe
    paths:
      - '.github/workflows/refactor-v2-freeze-baseline.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/repository-v2-safe
          fetch-depth: 0

      - name: Freeze current generated evidence once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/architecture/baseline
          if [ -e docs/architecture/baseline/CONTRACTS_PRE_STRUCTURAL.json ]; then
            echo "Baseline already exists; refusing to overwrite it."
            exit 0
          fi
          test -f docs/architecture/generated/BASELINE_CONTRACT_MANIFEST.json
          test -f docs/architecture/generated/CURRENT_REPOSITORY_AUDIT.json
          cp docs/architecture/generated/BASELINE_CONTRACT_MANIFEST.json docs/architecture/baseline/CONTRACTS_PRE_STRUCTURAL.json
          cp docs/architecture/generated/CURRENT_REPOSITORY_AUDIT.json docs/architecture/baseline/REPOSITORY_PRE_STRUCTURAL.json
          cat > docs/architecture/baseline/README.md <<'EOF'
          # Immutable pre-structural baseline

          These files were frozen immediately before Refactor V2 starts moving runtime source files.

          They are intentionally **not regenerated**. Architecture gates compare later repository states against these contracts to detect accidental route/API/env loss during structural migration.
          EOF

          git config user.name "almeaa-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/architecture/baseline
          git commit -m "docs(refactor): freeze pre-structural architecture baseline"
          git push origin HEAD:refactor/repository-v2-safe
