name: Refactor V2 Quiz Query Utilities

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/repository-v2-safe
    paths:
      - 'server/src/routes/quiz.routes.ts'
      - 'server/src/modules/quizzes/http/queryUtilities.ts'
      - 'scripts/smoke-quiz-query-utilities-boundary-contract.mjs'
      - 'scripts/smoke-batch100p-question-bank-runtime-crud-contract.mjs'
      - 'tools/refactor/apply-quiz-query-utilities.mjs'
      - 'tools/refactor/phase-review-quiz-query-utilities.mjs'
      - '.github/workflows/refactor-v2-quiz-query-utilities.yml'
permissions:
  contents: write

concurrency:
  group: refactor-v2-quiz-query-utilities-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix server ci

      - name: Verify query utility boundary before any apply
        run: node scripts/smoke-quiz-query-utilities-boundary-contract.mjs

      - name: Verify question-bank regex safety before any apply
        run: node scripts/smoke-batch100p-question-bank-runtime-crud-contract.mjs

      - name: API typecheck on source head
        run: npm run server:check

      - name: Apply current refactor phase — quiz query utilities
        if: github.actor != 'github-actions[bot]'
        run: node tools/refactor/apply-quiz-query-utilities.mjs

      - name: Run current refactor phase review
        if: github.actor != 'github-actions[bot]'
        run: node tools/refactor/phase-review-quiz-query-utilities.mjs

      - name: Commit verified current refactor phase
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          git config user.name "almeaa-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/src/routes/quiz.routes.ts

          if git diff --cached --quiet; then
            echo "No verified quiz query utility refactor changes to commit."
            exit 0
          fi

          git fetch origin refactor/repository-v2-safe
          REMOTE_SHA="$(git rev-parse origin/refactor/repository-v2-safe)"
          if [ "$REMOTE_SHA" != "$EXPECTED_SHA" ]; then
            echo "Refactor branch moved from verified head ${EXPECTED_SHA} to ${REMOTE_SHA}; skipping stale auto-commit safely."
            exit 0
          fi

          git commit -m "refactor(quizzes): extract query utilities"
          if git push origin HEAD:refactor/repository-v2-safe; then
            echo "Verified quiz query utility refactor changes pushed successfully."
            exit 0
          fi

          git fetch origin refactor/repository-v2-safe
          NEW_REMOTE_SHA="$(git rev-parse origin/refactor/repository-v2-safe)"
          if [ "$NEW_REMOTE_SHA" != "$EXPECTED_SHA" ]; then
            echo "Refactor branch advanced to ${NEW_REMOTE_SHA} during push; newer verification run owns the save."
            exit 0
          fi

          echo "Push failed while remote remained at verified head ${EXPECTED_SHA}." >&2
          exit 1
